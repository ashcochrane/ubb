# CI for the UBB monorepo: ubb-platform (Django) + ubb-sdk (Python client).
#
# - Python is pinned to 3.13 to match the development venv (3.13.14).
# - Dependencies install from ubb-platform/requirements.lock.txt (the frozen,
#   reproducible set — includes pytest/pytest-django/factory_boy); the SDK is
#   installed editable from the checkout, mirroring the dev venv.
# - DJANGO_SETTINGS_MODULE comes from ubb-platform/pytest.ini for the suite and
#   from manage.py for the management commands; it is NOT set here.
#
# Env contract (config/settings.py):
#   SECRET_KEY            required at import (settings.py:12 — KeyError without it).
#   DEBUG=True            DEBUG=False demands ALLOWED_HOSTS at import
#                         (settings.py:18-20) and enables SECURE_SSL_REDIRECT,
#                         which would 301 every Django-test-client request;
#                         True matches the dev .env.
#   DATABASE_URL          the postgres:16 service below (user is the instance
#                         superuser, so the test-database CREATE works).
#   REDIS_URL             the redis:7 service below; the root conftest.py moves
#                         tests onto DB index 15 of the same server.
#   STRIPE_SECRET_KEY / STRIPE_WEBHOOK_SECRET
#                         dummies — the autouse conftest guard forces a sentinel
#                         key and blocks real Stripe network I/O, and the one
#                         live test stays skipped (UBB_STRIPE_LIVE_TEST unset).
# Everything else settings.py reads has a safe default (ALLOWED_HOSTS, UBB_*,
# STRIPE_TEST_*, STRIPE_CONNECT_CLIENT_ID, CORS_ALLOWED_ORIGINS).

name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ubb
          POSTGRES_PASSWORD: ubb
          POSTGRES_DB: ubb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ubb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://ubb:ubb@localhost:5432/ubb
      REDIS_URL: redis://localhost:6379/1
      SECRET_KEY: ci-only-dummy-secret-key
      DEBUG: "True"
      STRIPE_SECRET_KEY: sk_test_dummy
      STRIPE_WEBHOOK_SECRET: whsec_dummy

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ubb-platform/requirements.lock.txt

      - name: Install dependencies (locked)
        run: |
          python -m pip install --upgrade pip
          pip install -r ubb-platform/requirements.lock.txt
          pip install -e ./ubb-sdk

      - name: Django system check
        working-directory: ubb-platform
        run: python manage.py check

      - name: Migrations are complete (makemigrations --check)
        working-directory: ubb-platform
        run: python manage.py makemigrations --check --dry-run

      - name: Platform test suite
        working-directory: ubb-platform
        run: python -m pytest

      - name: SDK test suite
        working-directory: ubb-sdk
        run: python -m pytest

  # The repository-wide contract suite (#198, ADR-0008 §2 and §7). Today it is
  # the vocabulary registry's validity gate; as slice 0 lands it becomes the
  # single coordinating verdict for the registry and every consumer generated
  # from it — the platform, the console, the SDK and the committed spec.
  #
  # It lives at the git root rather than inside any one of them because it
  # verifies AGREEMENT BETWEEN them, and a check hosted by one party to the
  # agreement can only ever see its own side.
  #
  # Two pinned packages, no Postgres, no Redis, no settings: this suite must run
  # without Django, and installing the platform lock would make that claim
  # unfalsifiable. `test_contract_suite_is_enforced.py` asserts exactly that
  # about this job, along with the absence of `continue-on-error`, an `if:` and
  # a path filter — so disarming this gate means deleting the test that says it
  # is armed, which is a visible act in a diff.
  contracts:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history AND every branch: the migration ledger's ratchet (#201)
          # compares against the ledger the change branched from, which it
          # resolves through the merge base with `origin/main`. Without the
          # history the ratchet cannot run — and it FAILS rather than skipping,
          # since a silently skipped comparison is how a debt reaches main
          # unreviewed. Same call the breaking gate made for its tag.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tests/contracts/requirements.txt

      - name: Install the contract suite's dependencies (pinned)
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/contracts/requirements.txt

      # The contract suite renders each generated artifact in memory and
      # compares. This step runs the command a CONTRIBUTOR runs and compares
      # with git — the one thing the in-memory check cannot cover: a writer
      # that emitted CRLF, or wrote to the wrong path, would leave the suite
      # green while the documented regeneration step corrupted the file (#200).
      # Same ratchet shape as the spec drift gate and the SDK core/exception
      # gates below.
      #
      # The verdict is the whole worktree, not a named path, so a target added
      # to `tools.vocabulary.generate.TARGETS` (#207, #208) is covered on the
      # day it is added — including the case a named-path check cannot see at
      # all, which is a NEW generated file nobody committed.
      - name: Vocabulary generation gate — regeneration produces zero diff
        run: |
          python -m tools.vocabulary --write
          if [ -n "$(git status --porcelain)" ]; then
            echo "The worktree is dirty after regenerating. If a generated"
            echo "vocabulary artifact is listed below, it is not what the"
            echo "registry produces: run 'python -m tools.vocabulary --write'"
            echo "and commit the result."
            git status --porcelain
            git diff
            exit 1
          fi

      - name: Contract suite — the registry, and the gates over it
        run: python -m pytest tests/contracts

      # The migration ledger only shrinks (#201, #158 §11.3). Everything else
      # about the ledger is checked in the suite above, offline; this step
      # exists separately because this is the one question that needs git
      # history — does the proposed ledger owe MORE than the ledger this change
      # branched from?
      #
      # An addition is refused unless a seeding authorisation naming the gate is
      # new in this change, which is what makes seeding an explicit, reviewed
      # act rather than a review habit. Same ratchet shape as the spec drift and
      # SDK regeneration gates: the committed state is the floor.
      - name: Migration ledger ratchet — it only shrinks
        run: python -m tools.gates ratchet

  # Schemathesis conformance sweep (#87): fuzz the app in-process against the
  # committed openapi/v1.json and report every place the implementation
  # contradicts the document (see ubb-platform/conformance/). WANTED, NOT
  # GATING — continue-on-error on the sweep step means findings annotate the
  # run and land in the job summary + artifact, but never turn a PR red.
  # Promoting this to a gate is a separate future decision. Schemathesis is
  # installed here, pinned, not in the lock — the same in-job tool pattern as
  # oasdiff and the SDK generator below.
  conformance:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ubb
          POSTGRES_PASSWORD: ubb
          POSTGRES_DB: ubb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ubb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://ubb:ubb@localhost:5432/ubb
      REDIS_URL: redis://localhost:6379/1
      SECRET_KEY: ci-only-dummy-secret-key
      DEBUG: "True"
      STRIPE_SECRET_KEY: sk_test_dummy
      STRIPE_WEBHOOK_SECRET: whsec_dummy

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ubb-platform/requirements.lock.txt

      - name: Install dependencies (locked) + schemathesis (pinned)
        run: |
          python -m pip install --upgrade pip
          pip install -r ubb-platform/requirements.lock.txt
          pip install "schemathesis==4.24.2"

      - name: Conformance sweep (non-blocking)
        id: sweep
        continue-on-error: true
        working-directory: ubb-platform
        run: |
          python -m pytest conformance -q --tb=long 2>&1 | tee /tmp/conformance-report.txt
          exit "${PIPESTATUS[0]}"

      - name: Publish the report to the job summary
        if: always()
        run: |
          {
            echo "## Schemathesis conformance sweep (non-gating, #87)"
            if [ "${{ steps.sweep.outcome }}" = "success" ]; then
              echo "No conformance findings."
            else
              echo "Findings below — triage into bug tickets; this job never gates a PR."
            fi
            echo '```'
            tail -c 60000 /tmp/conformance-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-report
          path: /tmp/conformance-report.txt

  # The spec-as-truth ratchet (#77, ADR-002): the committed openapi/v1.json is
  # the single source of truth for the tenant surface. Three gates:
  #   drift    — offline regeneration must produce zero diff (code == document)
  #   breaking — oasdiff against the immutable `api-v1-launch` baseline, so the
  #              question is "has every break since the contract was published
  #              been reviewed?", not "did this PR break it?" (#195); the
  #              committed suppression files make accepting a break a visible,
  #              reviewed change; severity-levels encodes the open-enum stance
  #   TS smoke — the committed spec must generate clean TypeScript types
  # The env block mirrors the test job's: settings import needs the vars, but
  # nothing here touches Postgres/Redis, so no services are started.
  contract:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgres://ubb:ubb@localhost:5432/ubb
      REDIS_URL: redis://localhost:6379/1
      SECRET_KEY: ci-only-dummy-secret-key
      DEBUG: "True"
      STRIPE_SECRET_KEY: sk_test_dummy
      STRIPE_WEBHOOK_SECRET: whsec_dummy

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history AND tags: the breaking gate resolves the immutable
          # `api-v1-launch` baseline by tag. Without the tag the gate cannot
          # run — and it fails rather than skipping, since a silently skipped
          # comparison is how breaks reach main unreviewed.
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ubb-platform/requirements.lock.txt

      - name: Install dependencies (locked)
        run: |
          python -m pip install --upgrade pip
          pip install -r ubb-platform/requirements.lock.txt

      - name: Drift gate — offline regeneration produces zero diff
        working-directory: ubb-platform
        run: |
          python scripts/export_openapi.py
          git -C .. diff --exit-code -- openapi/v1.json

      # The SDK's generated transport+DTO core (ubb/_core) rides the SAME
      # ratchet as the spec (issue #84, ADR-002): the committed core must be
      # exactly what the pinned generator produces from the committed spec, so
      # hand edits and stale-spec cores turn CI red. The generator version is
      # the only input (ruff post-hook disabled, newlines LF-normalized), so
      # this Linux runner reproduces the bytes committed from any OS.
      - name: SDK core regeneration gate — zero diff
        run: |
          pip install "openapi-python-client==0.29.0"
          python ubb-sdk/codegen/generate_core.py
          git diff --exit-code -- ubb-sdk/ubb/_core ubb-sdk/ubb/_spec_revision.py

      # The registry-derived exception hierarchy rides the ratchet too: the
      # committed ubb/_exceptions_generated.py must be exactly what the
      # generator produces from openapi/error-codes.json (issue #84).
      - name: SDK exception hierarchy regeneration gate — zero diff
        run: |
          python ubb-sdk/codegen/generate_exceptions.py
          git diff --exit-code -- ubb-sdk/ubb/_exceptions_generated.py

      # The version is pinned in openapi/contract_gate.py and read from there,
      # so the binary installed here cannot drift from the one the committed
      # entries were generated with (they are matched by reported text).
      - name: Install oasdiff (pinned)
        run: |
          VERSION="$(python openapi/contract_gate.py --print-pinned-version)"
          curl -sSfL -o /tmp/oasdiff.tar.gz \
            "https://github.com/oasdiff/oasdiff/releases/download/v${VERSION}/oasdiff_${VERSION}_linux_amd64.tar.gz"
          tar -xzf /tmp/oasdiff.tar.gz -C /tmp oasdiff
          sudo mv /tmp/oasdiff /usr/local/bin/oasdiff

      # Cumulative, against `api-v1-launch` — every break since the contract
      # was published must be recorded as reviewed, and every committed entry
      # must still suppress something (openapi/README.md).
      - name: Breaking gate — cumulative vs the api-v1-launch baseline
        run: python openapi/contract_gate.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm
        run: corepack enable

      - name: Install UI dependencies (locked)
        run: pnpm install --frozen-lockfile

      - name: UI contract snapshot gate — committed spec produces zero diff
        run: pnpm ui:api:check

      - name: TypeScript smoke gate — committed spec generates clean types
        run: npx --yes openapi-typescript@7.13.0 openapi/v1.json -o /tmp/ubb-v1.d.ts

      # The gates above only prove the SPEC is self-consistent and that a client
      # can be generated from it. Neither compiles the console, which is how the
      # app drifted three contract changes behind the API (#129, #131, #132)
      # without anything going red — and how .gitignore's unanchored `lib/`
      # silently dropped 22 imported modules for weeks. A clean checkout could
      # not build at all. These two steps are what make that impossible.
      - name: UI typecheck — the console compiles against the committed contract
        run: pnpm --dir apps/ui exec tsc -b

      - name: UI tests
        run: pnpm --dir apps/ui test
