  G17:
    statement: >-
      Every hand-written SDK call targets a real operation, named through one
      generated registry rather than by spelling a route.
    oracle: openapi/v1.json, plus gates/migration-ledger.yaml for the routes it excuses
    source: ADR-0007 §4, #155 §8.3
    status: installed
    notes: >-
      Static, over the SDK's source: the gate reads `ubb-sdk/ubb/*.py` with
      `ast` and never imports the client. That is what lets it live in a suite
      with no `httpx`, and it is the correction to the failure itself — the
      three dead calls were green because their tests patched the transport, and
      source cannot be mocked. The three known invalid calls are in the ledger,
      owed by slice 4.
      #209 changed what there is to check. A call no longer spells a route at
      all: it names a constant in `ubb-sdk/ubb/_operations.py`, generated from
      the contract and the ledger and gated for zero diff, so a renamed
      operation renames its constant and a wrapper that did not move stops
      resolving. What remains checkable is the name and the fill — an
      undeclared constant, and the wrong number of values for a path's
      parameters, which an f-string could not have caught at all.
      Three conjuncts keep that from being advice. A request naming its target
      any other way is refused, so there is nowhere left to write a route. Every
      route literal anywhere in the hand shell is refused, so
      `self._http.get(...)` is caught rather than unseen. And a route named in a
      DOCSTRING must still be one the contract publishes, is a family of, or the
      ledger excuses — because #155 §8.3's claim is that a rename cannot leave a
      stale string behind, and a docstring is a string.
      That third conjunct found nothing on the day it landed, and that is worth
      stating rather than dressing up: of the 53 documented routes, 48 resolve
      exactly, 4 name a family, and 1 is the `rate-cards/batch` route the ledger
      already excuses. It is installed for the rename that has not happened yet
      — the one that would otherwise fix a call and leave the prose behind.
      ADR-0007 §4's method-AND-path identity did not weaken; it moved to the one
      place the mistake can still be made. A call site cannot spell a method, so
      a valid path under the wrong verb is now only reachable as a registry
      entry, and that is where it is checked.
    enforced_by:
      - suite: contracts
        node: tests/contracts/test_sdk_operations.py::test_every_hand_written_call_targets_a_published_operation
      - suite: contracts
        node: tests/contracts/test_sdk_operations.py::test_no_route_literal_survives_in_the_hand_written_layer
      - suite: contracts
        node: tests/contracts/test_sdk_operations.py::test_the_registry_regenerates_with_zero_diff

  G18:
    statement: >-
      Every published operation carries an explicit SDK disposition; an increase
      in the unwrapped count is a reviewed change.
    oracle: the generated disposition manifest
    source: ADR-0007 §4
    status: installed
    notes: >-
      `ubb-sdk/operation-coverage.yaml`, one row per published operation, all
      134. Every disposition is DERIVED — `wrapped` from a resolved call,
      `generated_only` from the presence of the operation's module in `_core`,
      `not_yet_wrapped` from the absence of both — because a hand-written
      classification would be a second copy of a fact the tree already states.
      56 operations are unwrapped, which ADR-0007 §4 does not require to reach
      zero; what it requires is that a new gap be signed for, and the ratchet
      step below refuses one that is not — comparing the SET of unwrapped
      operations, because wrapping three while publishing two unwrapped ones is
      a net fall and two unreviewed gaps. `not_yet_wrapped` is zero today and is
      kept because G16 compares the generator against itself: an operation the
      generator silently skips is missing from both sides of that comparison and
      only this row would notice. Note that this narrows #155 §8.2's wording,
      which described `not_yet_wrapped` as "deliberately unavailable" and
      imagined a human declaring it; here deliberateness is carried by the
      authorisation instead, and the word means "unreachable by any route".
    enforced_by:
      - suite: contracts
        node: tests/contracts/test_sdk_operations.py::test_every_published_operation_carries_a_disposition
      - suite: contracts
        node: tests/contracts/test_sdk_operations.py::test_the_coverage_manifest_regenerates_with_zero_diff
      - job: contracts
        step: SDK coverage manifest gate — regeneration produces zero diff
      - job: contracts
        step: SDK coverage ratchet — no gap opens without a signature

  G19:
    statement: >-
      Field transition classes are enforced in the database across `save()`,
      `QuerySet.update()` and raw SQL.
    oracle: ADR-0007 §2
    source: ADR-0007 §2
    status: installed
    notes: >-
      Installed by slice 3 over the first protected columns: a nullable
      `provider_cost_micros` resolving atomically with `costing_status` as a
      RESOLVE_ONCE pair, and `claimed_provider_cost_micros` FROZEN (#317 added
      the columns, #318 declared them into those classes and installed the
      enforcement, #319 flipped this row). All three are held by a `BEFORE
      UPDATE` trigger on `ubb_posting`, because a `CHECK` sees one row at a time
      and so cannot tell completing a blank from changing an answer — which is
      the whole of the distinction RESOLVE_ONCE draws.
      The first node below WALKS the declarations — through
      `core.transitions.columns_declared_into_defended_classes`, naming no
      column — so a column a later slice declares is judged on the day it is
      declared rather than when somebody remembers to extend a list. The other
      three drive both declared classes through all three doors of the statement
      above — a refusal for RESOLVE_ONCE, a refusal for FROZEN, and the one
      ADMITTED move, which is named beside the refusals because a trigger that
      refused every settlement would satisfy the refusals alone. All four run in
      the `platform` suite, whose job and step are declared and verified under
      `suites:` above.
      Slice 3 is the first slice with protected columns, not the last. Later
      slices adding FROZEN, SET_ONCE or PRUNABLE columns extend the installed
      gate rather than re-owning this row.
      EXTENDED BY SLICE 4 (#352), which is what that sentence anticipated: the
      customer price pair — a nullable `billed_cost_micros` resolving atomically
      with `pricing_status`, RESOLVE_ONCE, the one permitted move `unknown` to
      `known` — declared on the same model and held by a SECOND `BEFORE UPDATE`
      trigger on the same table. A second RULE, not a second MECHANISM: the two
      govern disjoint columns, each `WHEN` clause names only its own, and
      dropping either leaves the other standing, which is what makes each
      measurable and reversible on its own. A `CHECK` or a Postgres `RULE`
      holding one pair while a trigger held the other is what was refused —
      two mechanisms over sibling pairs on one table is how the two rules come
      to disagree about the same write. Its per-write cost was re-measured by
      `ubb-platform/scripts/measure_posting_transition_cost.py`, which asks for
      BOTH triggers by name and times a price resolution beside the supplier
      settlement (ADR-0007's Consequences).
      EXTENDED AGAIN BY SLICE 4 (#353), by the same reasoning and over a
      column of a different kind: the Pricing Receipt, `RESOLVE_ONCE`, held by
      a THIRD `BEFORE UPDATE` trigger on the same table. The class is declared
      over a `jsonb` record rather than a scalar, so its argument is written on
      the model — the record's own construction boundary holds each of its two
      sections to *an amount is present exactly when the status says it is
      settled, and the method with it*, so the fields that are null exactly
      while a section is unresolved are that section's method and its amount,
      and the declaration is that sentence one level up: a section RECORDED AS
      UNRESOLVED completes exactly once, as a whole, and nothing else in the
      record may ever move. Unresolved rather than merely unsettled: `waived`
      and `not_applicable` null the same two fields, so the record's shape
      cannot tell a decision somebody made from information UBB is missing, and
      the rule whitelists the one completable status per side that
      `core.amount_status_pairs` names — as both sibling rules whitelist
      theirs. The column may therefore see one statement per
      unresolved section, every one of them a resolution rather than a
      correction, which is the only distinction the class draws. A receipt with
      nothing left unresolved is sealed whole, and so is one written in a shape
      with no sections to complete — which is where `receipts.py`'s *old
      receipts are read, never rewritten* is enforced rather than intended.
      ⚠ THE RECEIPT IS A COLUMN ON THIS TABLE, NOT A TABLE OF ITS OWN, so what
      makes its rule provable in isolation is not where it lives: it names a
      disjoint column, every one of its refusals names that column in the
      message Postgres answers with, and dropping it leaves both neighbours
      standing. All three rules are declared `resolve_once`, so the class alone
      has not discriminated since #352 and `REFUSAL_NAMES` is what does.
      ⚠ AND THIS IS THE FIRST OF THE THREE WHOSE PER-WRITE COST IS MEASURABLE
      RATHER THAN INSIDE THE NOISE FLOOR. `measure_posting_transition_cost.py`
      now asks for all three triggers by name and times a receipt completion as
      a fifth column; the completion pays about +0.018 ms per row against a
      floor of 0.016 (9 runs x 2,000 rows), which is the rule walking a `jsonb`
      record where the other two compare scalars. The insert and the ordinary
      update — the hot paths — stay flat, and a completion happens once per
      posting in a recovery path. The numbers are in the acceptance record for
      #353 (ADR-0007's Consequences).
      ⚠ THE FIRST NODE BELOW PROVES ONLY THAT A COLUMN IS *NAMED* BY A RULE.
      It is a word-boundary search for the column name over the concatenated
      trigger bodies on its table, so it goes green the moment any rule spells
      the column — including a branch that refuses nothing, which #325 measured
      on the cost side. That is still worth having, because it judges a new
      declaration on the day it is made with no edit here. It is not evidence
      that a rule HOLDS, and the behavioural nodes below are what is. The last
      node is that distinction measured rather than asserted: it replaces the
      shipped price rule with one naming both columns and refusing nothing, and
      watches this gate's own check report a clean board over it.
      One obligation is deferred, by name — `PostingMeasurement`'s whole-record
      `DELETE` rule, permitted only at or after `prunable_at` and only while its
      parent posting is not `unresolved`, reads a status that lands in slice 4,
      so slice 4 adds it as an EXTENSION of this installed gate rather than by
      re-owning this row; it sits outside the statement above because every
      column of that record is declared `RECORD_RULE`, which `core/transitions.py`
      places outside `DATABASE_DEFENDED`, and so is not a field transition class
      at all.
    enforced_by:
      - suite: platform
        node: ubb-platform/apps/platform/tests/test_transition_class_declarations.py::TransitionClassDeclarationsTest::test_every_declared_column_is_defended_by_the_database
      - suite: platform
        node: ubb-platform/apps/metering/usage/tests/test_a_cost_settles_once.py::TheSettledAmountIsNotEditableTest::test_a_settled_amount_cannot_be_overwritten
      - suite: platform
        node: ubb-platform/apps/metering/usage/tests/test_a_cost_settles_once.py::TheClaimedCostIsFrozenTest::test_a_claimed_cost_cannot_be_edited
      - suite: platform
        node: ubb-platform/apps/metering/usage/tests/test_a_cost_settles_once.py::TheOnePermittedMoveIsAdmittedTest::test_an_unresolved_cost_settles_through_every_door
      - suite: platform
        node: ubb-platform/apps/metering/usage/tests/test_a_price_resolves_once.py::TheResolvedPriceIsNotEditableTest::test_a_resolved_price_cannot_be_overwritten
      - suite: platform
        node: ubb-platform/apps/metering/usage/tests/test_a_price_resolves_once.py::OnlyAnUnknownPriceResolvesTest::test_a_waived_posting_is_never_a_resolution_candidate
      - suite: platform
        node: ubb-platform/apps/metering/usage/tests/test_a_price_resolves_once.py::ATriggerRefusingEveryWriteWouldSatisfyTheRefusalsAloneTest::test_an_unknown_price_resolves_through_every_door
      - suite: platform
        node: ubb-platform/apps/metering/usage/tests/test_a_price_resolves_once.py::AGreenDeclarationCheckDoesNotProveTheRuleHoldsTest::test_a_rule_that_refuses_nothing_still_passes_the_declaration_check
      - suite: platform
        node: ubb-platform/apps/metering/usage/tests/test_a_receipt_seals_once_it_is_complete.py::ASealedReceiptIsNotEditableTest::test_a_settled_amount_cannot_be_edited
      - suite: platform
        node: ubb-platform/apps/metering/usage/tests/test_a_receipt_seals_once_it_is_complete.py::AnUnresolvedFieldCompletesExactlyOnceTest::test_a_completed_field_cannot_be_completed_again
      - suite: platform
        node: ubb-platform/apps/metering/usage/tests/test_a_receipt_seals_once_it_is_complete.py::AFieldThatWasNeverUnresolvedIsNotWritableTest::test_a_completion_cannot_carry_an_edit_alongside_it
      - suite: platform
        node: ubb-platform/apps/metering/usage/tests/test_a_receipt_seals_once_it_is_complete.py::OnlyAnUnresolvedFieldIsCompletableTest::test_a_waived_price_is_never_a_completion_candidate
      - suite: platform
        node: ubb-platform/apps/metering/usage/tests/test_a_receipt_seals_once_it_is_complete.py::ATriggerRefusingEveryWriteWouldSatisfyTheRefusalsAloneTest::test_an_unresolved_cost_completes_through_every_door
      - suite: platform
        node: ubb-platform/apps/metering/usage/tests/test_a_receipt_seals_once_it_is_complete.py::TheModelGuardIsNotTheEnforcementTest::test_the_guard_being_absent_would_change_nothing
      - suite: platform
        node: ubb-platform/apps/metering/usage/tests/test_a_receipt_seals_once_it_is_complete.py::AGreenDeclarationCheckDoesNotProveTheRuleHoldsTest::test_a_rule_that_refuses_nothing_still_passes_the_declaration_check

  G20:
    statement: Migrations carry their data — a rename, never an add-and-remove pair.
    oracle: ADR-0007 §1
    source: ADR-0007 §1
    status: owned_by_slice_8
    blocked_on: >-
      ADR-0007 §1 states the data-carrying rule does not bind before the cutover
