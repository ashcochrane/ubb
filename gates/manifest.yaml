# The gate manifest — one row per gate in ADR-0008 §8, plus the obligations
# that are not gates at all (#201).
#
# ADR-0008 §8 lists twenty-seven standing gates. Before this file existed they
# lived in a table inside a frozen decision document, which is a list of
# intentions: nothing compared it against the repository, and a gate that
# quietly stopped running would have gone on being listed as one.
#
# So each row states what the gate asserts, what oracle settles it, and exactly
# one status. An `installed` row names its enforcement sites and those sites are
# verified — the job runs on push and pull request, the job and step are not
# `continue-on-error`, there is no `if:` and no path filter, and a named test
# node is one the suite actually collects and is not marked skip or xfail. An
# `owned_by_slice_N` row names a slice from `slices.yaml` and states what must
# exist before the gate can be installed.
#
# This is the defence against the failure mode this repository has already
# shipped three times: a check that exists but cannot fail anything. The sweep
# wired `continue-on-error`. The only end-to-end money test sat in no CI job.
# Three SDK tests patched the transport, so the mock reproduced the mistake.
#
# What it does NOT prove is that a running gate's assertions are worth making.
# Every gate here is a consistency check (ADR-0008 §9), and this manifest is a
# consistency check over those. Consistency with a wrong declaration is green.
#
# See gates/README.md for how a row is flipped from owned to installed.

version: 1

# --- The pytest suites a row may name ---------------------------------------
#
# Every suite here is verified whether or not a gate names it today, so
# declaring one is a claim that gets checked rather than a convenience.
#
# There is no `ui` suite: the console's tests are vitest, and no gate needs a
# vitest NODE yet. The UI checks that gate today are named as workflow steps
# below, which is the honest form for them. A slice that needs a vitest node
# adds the suite kind then, rather than this file carrying a checker nobody has
# exercised.
suites:
  contracts:
    summary: >-
      The repository-wide contract suite at the git root — agreement BETWEEN the
      platform, the console, the SDK and the committed contract.
    job: contracts
    step: Contract suite — the registry, and the gates over it
    root: tests/contracts
    config: tests/contracts/pytest.ini

  platform:
    summary: >-
      The Django suite. Home of the checks whose subject is the model layer,
      because they need the app registry loaded.
    job: test
    step: Platform test suite
    root: ubb-platform
    config: ubb-platform/pytest.ini

  sdk:
    summary: The Python client's own suite.
    job: test
    step: SDK test suite
    root: ubb-sdk
    # No pytest configuration file: collection follows pytest's defaults.

# --- The twenty-seven standing gates ----------------------------------------

gates:
  G1:
    statement: >-
      The registry is internally valid — no duplicate canonical term, no
      conflicting definition across files.
    oracle: domain-vocabulary/schema.yaml
    source: ADR-0008 §2, #158 §3.7
    status: installed
    enforced_by:
      - suite: contracts
        node: tests/contracts/test_vocabulary_registry.py::test_the_shipped_registry_is_valid

  G2:
    statement: >-
      Every closed value set matches its backend, console and SDK consumers.
    oracle: the vocabulary registry
    source: ADR-0008 §2, #158 §3.2
    status: installed
    notes: >-
      THE UNIT IS A VALUE, NOT A FILE, and the question asked of it is whether
      a declared consumer holds it BY REFERENCE to the generated artifact.
      #191 decision 3 rules out the textual alternative — scanning consumer
      source for matching string literals is a check a coincidence can satisfy,
      since two unrelated places spelling one word pass it and so does a value
      that has already moved. So nothing here reads a value. It reads the
      NAMES the generator binds, asked of `tools.vocabulary.generate` rather
      than rebuilt beside it, and finds them through imports, which cannot be a
      coincidence. A consumer holding two of a concept's three constants
      measures as two of three, which is what
      apps/platform/tenants/models.py is.
      ONE MECHANISM, TWO READINGS. `tools/consumers` takes the census once; G2
      reads it over `closed` concepts and G3 over `open` ones. It is also the
      predicate #208 consumes for its own rule that the spec advertises a value
      only where the backend serves it, which is why it is a package rather
      than a test helper — two implementations of one predicate is the shape
      that bit #203, whose agreement test was wrong until it was run.
      THREE STATED LIMITS, recorded rather than left to be discovered.
      (1) The census walks the consumers the REGISTRY DECLARES, so an
      enumeration in a file no concept names is invisible to it. That is not an
      oversight: attributing a bare value list to a concept means comparing its
      members against a value set, which is the literal scan decision 3
      forbids. But invisible must not mean unaccounted, so the gap is COUNTED
      rather than merely admitted:
      tests/contracts/test_undeclared_value_sets.py pins every `choices=` in
      living backend code by file — 46 across 19 files — so a value set the
      agreed model says nothing about cannot arrive in silence. It is
      deliberately an inventory and not a ledger, because a ledger entry names
      a canonical term and a removal slice and neither exists for a concept
      nobody has decided. It is also deliberately backend-only: `choices=` is
      Django declaring that a field has a closed value set, while a TypeScript
      `as const` array is as often a query key as vocabulary, and a pinned
      count over those would pin noise and be raised until it stopped failing.
      The SDK declares none at all, and both facts are themselves checked.
      (2) The console's LABEL MAPS are G6's, not this gate's. `labels.ts`
      enumerates values twice — once as `as const` arrays and once as the keys
      of its label maps — and G2 sees only the first, because the second is
      exactly what "every label maps to a valid registry value" already
      covers. #210 installs that half.
      (3) `openapi` is a declared surface with NO generated artifact, so no
      consumer there can hold a value by reference at all and the census
      refuses the question rather than answering it. Its check is G4's,
      installed by #208.
      ADR-0005'S SELECTOR INVARIANT IS SUPERSEDED HERE (#191 §13).
      `test_posting_and_rate_share_one_selector_vocabulary` in
      ubb-platform/apps/platform/tests/test_grouping_field_invariants.py holds
      `Rate.SELECTORS` to the `Posting`'s columns (#269 renamed the model, the
      test and this reference in one commit) — the closest thing in the
      tree to a registry check, and #145 removed its subject in the target
      model. The rule it encodes, that a selector must exist as a declared
      column, survives as this gate's registry-backed form. THE EXISTING TEST
      STAYS until slice 4 deletes `Rate`, and this note is what stops that
      deletion later reading as a loss of coverage.
      `ProductFeeConfig.fee_type` GETS NO CONCEPT, and the reason is checked
      rather than asserted. #206 moved `flat` out of the sweep's input on the
      evidence of 1,069 hits, which left
      ubb-platform/apps/billing/tenant_billing/models.py's bare `CharField`
      carrying a retired sense that no gate could see. #191 story 15 requires a
      PUBLIC value set to declare its kind — and this one is not public: it
      appears in no committed contract, no SDK and no console, and is written
      only by UBB's own operators. Registering it would put a private operator
      field in the statement of the agreed model and would mean coining a
      replacement for `flat` on a subject no slice rebuilds. So it is recorded
      here instead, with the claim under test:
      tests/contracts/test_product_fee_type_is_not_public.py fails the day it
      reaches any of the three public surfaces, at which point story 15 binds
      and the concept is owed. That module is deliberately NOT listed in
      `enforced_by` below: it checks story 15's premise, not this gate's
      statement, and a row whose armed-ness turned on an unrelated test would
      be claiming something it does not measure. It gates by location instead —
      ADR-0008 §7, everything under tests/contracts/ is required.
    enforced_by:
      - suite: contracts
        node: >-
          tests/contracts/test_consumer_census.py::test_g2_every_closed_value_is_held_by_reference_or_owed
      - suite: contracts
        node: >-
          tests/contracts/test_consumer_census.py::test_negative_control_a_restated_closed_value_set_is_a_finding
      - suite: contracts
        node: >-
          tests/contracts/test_consumer_census.py::test_g2_every_seeded_entry_is_still_a_real_violation
      - suite: contracts
        node: >-
          tests/contracts/test_consumer_census.py::test_g2_every_entrys_extent_is_exactly_what_the_census_finds
      - suite: contracts
        node: tests/contracts/test_consumer_census.py::test_the_census_read_every_surface
      - suite: contracts
        node: >-
          tests/contracts/test_consumer_census.py::test_the_census_was_taken_without_a_fault

  G3:
    statement: >-
      Every registry-known open value is present in UBB-owned consumers. The
      check is asymmetric: a runtime value the registry has never seen stays
      legal where the concept is open.
    oracle: the vocabulary registry
    source: ADR-0008 §2, #158 §3.3
    status: installed
    notes: >-
      The same census as G2, read over `open` concepts — see that row for the
      mechanism and its three stated limits. What makes this a separate gate
      rather than a clause of G2 is the asymmetry, and it is the half that is
      easy to get backwards: a registry-known value missing from a UBB-owned
      consumer is a defect, while a runtime value the registry has never seen
      is legal and is NEVER reported.
      THE SECOND HALF IS UNREPRESENTABLE, not merely unreported. A verdict's
      `held` and `missing` partition exactly the registry's declared values for
      its concept, so there is nowhere for an unknown value to appear even if
      the walker wanted to report one — it reads generated names, and a value
      UBB has never seen has none. That is stronger than a rule somebody has to
      remember not to break, and it is what keeps ADR-0003 true: a G3 that
      reported the second half would make UBB learning a new value a CI
      failure. Proved with a control rather than asserted —
      `test_negative_control_an_unknown_runtime_value_is_never_a_finding` puts
      a consumer that handles an unseen value through the real census and
      requires silence, beside its opposite so the silence is a choice rather
      than a gate that reports nothing at all.
    enforced_by:
      - suite: contracts
        node: >-
          tests/contracts/test_consumer_census.py::test_g3_every_known_open_value_is_held_by_reference_or_owed
      - suite: contracts
        node: >-
          tests/contracts/test_consumer_census.py::test_g3_every_seeded_entry_is_still_a_real_violation
      - suite: contracts
        node: >-
          tests/contracts/test_consumer_census.py::test_g3_every_entrys_extent_is_exactly_what_the_census_finds
      - suite: contracts
        node: >-
          tests/contracts/test_consumer_census.py::test_negative_control_an_unknown_runtime_value_is_never_a_finding
      - suite: contracts
        node: >-
          tests/contracts/test_consumer_census.py::test_negative_control_a_known_value_left_behind_is_a_finding
      - suite: contracts
        node: >-
          tests/contracts/test_consumer_census.py::test_the_census_never_reports_a_value_the_registry_has_never_seen
      - suite: contracts
        node: tests/contracts/test_consumer_census.py::test_the_census_read_every_surface

  G4:
    statement: >-
      No open concept has been silently converted to a closed schema enum;
      recognised values appear as `x-ubb-known-values` metadata, never as an
      `enum` array.
    oracle: the vocabulary registry, compared against openapi/v1.json
    source: ADR-0008 §2, #158 §3.6
    status: installed
    notes: >-
      THE CONCEPT-TO-SCHEMA MAPPING IS CARRIED BY THE DOCUMENT ITSELF. This row
      was blocked on the registry not saying where in the spec a concept
      appears, and #208 answers that without teaching the registry about schema
      internals: a schema field names its concept and nothing else
      (`x-ubb-concept`), the values arrive at export time from
      `openapi/known-values.json`, and the marker survives into the published
      document — so the mapping this gate walks is a fact the contract states
      rather than one inferred by comparing spellings, which is the literal
      scan #191 decision 3 rules out.
      THE KIND DECIDES THE REPRESENTATION, in one function, and nothing
      downstream reads the kind again. An `open` concept gets
      `x-ubb-known-values` beside an untouched `type: string`; a `closed` one
      gets a real `enum`; a `tenant_defined` or `free_text` one, and any
      concept the registry gives no `openapi` consumer, contributes nothing and
      a marker on it is REFUSED. So converting an open concept to an enum is
      not a mistake this mechanism can make quietly — it is not a mistake it
      can make at all without changing that mapping.
      THE SECOND HALF IS WHAT SEES A *SILENT* CONVERSION, and it is why this
      row names two gate nodes rather than one. A hand-written `Literal[...]`
      produces an `enum` on a node carrying no marker, which the walk above
      would never reach. So every `enum` in the committed contract is
      accounted for by JSON pointer — three today, all pre-registry, each with
      a stated reason — checked in both directions. It is an INVENTORY and not
      a ledger, for `test_undeclared_value_sets.py`'s reason: two of the three
      enumerate something the registry describes no concept for, so there is no
      canonical term to expect and no slice that owes a rename.
      THE SPEC ADVERTISES A VALUE ONLY WHERE THE BACKEND SERVES IT, asked
      through `tools.consumers`' census — G2 and G3's predicate, consumed
      rather than reimplemented, which is the acceptance criterion #227 wrote
      for this ticket. Nothing in the tree serves any concept yet, so the
      contract carries no metadata today and the twenty-nine concepts the
      registry says appear in it are individually identified ledger entries
      owed by the slices that rename them. That is the correct outcome for
      slice 0 rather than a shortfall, and it makes the marker-driven half
      vacuous on the committed document — which is why the enum inventory, the
      fixed-point check over the committed contract, and a positive control
      that makes `advertised` reachable at all are all named below.
    enforced_by:
      - suite: contracts
        node: >-
          tests/contracts/test_openapi_known_values.py::test_g4_no_open_concept_is_a_closed_enum_in_the_contract
      - suite: contracts
        node: >-
          tests/contracts/test_openapi_known_values.py::test_g4_every_enum_in_the_contract_is_accounted_for
      - suite: contracts
        node: >-
          tests/contracts/test_openapi_known_values.py::test_g4_every_unadvertised_concept_is_an_identified_debt
      - suite: contracts
        node: >-
          tests/contracts/test_openapi_known_values.py::test_g4_every_seeded_entry_is_still_a_real_violation
      - suite: contracts
        node: >-
          tests/contracts/test_openapi_known_values.py::test_g4_every_entrys_extent_is_exactly_what_the_document_records
      - suite: contracts
        node: >-
          tests/contracts/test_openapi_known_values.py::test_a_concept_is_advertised_exactly_where_the_backend_serves_it
      - suite: contracts
        node: >-
          tests/contracts/test_openapi_known_values.py::test_the_committed_contract_is_a_fixed_point_of_the_applier
      - suite: contracts
        node: >-
          tests/contracts/test_openapi_known_values.py::test_an_open_concept_becomes_documentation_metadata_never_an_enum
      - suite: contracts
        node: >-
          tests/contracts/test_openapi_known_values.py::test_positive_control_a_converted_consumer_makes_the_contract_advertise
      - suite: contracts
        node: >-
          tests/contracts/test_openapi_known_values.py::test_the_gate_read_the_committed_contract

  G5:
    statement: >-
      Generated artifacts are current — regenerating from the registry produces
      zero diff.
    oracle: the vocabulary registry
    source: ADR-0008 §2, #158 §3.5
    status: installed
    notes: >-
      The CI step's verdict is the whole worktree rather than a named path, so a
      target added to `tools.vocabulary.generate.TARGETS` by #207 or #208 is
      covered on the day it is added — including a new generated file nobody
      committed, which a named-path check cannot see at all.
    enforced_by:
      - suite: contracts
        node: tests/contracts/test_generated_vocabulary.py::test_every_generated_artifact_matches_the_registry
      - job: contracts
        step: Vocabulary generation gate — regeneration produces zero diff

  G6:
    statement: >-
      Every required registry value has a label; every label maps to a valid
      registry value; no retired token remains labelled; every supported locale
      carries the key.
    oracle: the vocabulary registry, compared against the console's label catalogue
    source: ADR-0008 §4, #158 §4.2
    status: installed
    enforced_by:
      - suite: contracts
        node: >-
          tests/contracts/test_label_catalogue.py::test_every_registry_value_has_wording_in_every_locale
      - suite: contracts
        node: >-
          tests/contracts/test_label_catalogue.py::test_every_label_names_a_live_registry_value
      - suite: contracts
        node: >-
          tests/contracts/test_label_catalogue.py::test_no_retired_token_keeps_its_wording
      - suite: contracts
        node: >-
          tests/contracts/test_label_catalogue.py::test_the_ledger_records_exactly_what_the_legacy_adapter_still_does
      - suite: contracts
        node: >-
          tests/contracts/test_label_catalogue.py::test_the_adapter_gains_no_new_importer
      - job: contract
        step: UI tests
    notes: >-
      FOUR NODES FOR ADR-0008 §4.2'S FOUR PROMISES, except that the first and
      the fourth are one question rather than two: the coverage check runs once
      per LOADED locale, so "every supported locale carries the required key"
      is the first promise asked in a loop. With one locale the loop runs once;
      the day a second catalogue lands, a half-translated one fails with no
      edit here. A fifth node comparing the locales against each other was
      written and DELETED — with one locale it compared a set with itself, and
      with two it could only report what the first already reports. Naming a
      check that cannot fail is worse than naming none, because this manifest
      would go on offering it as evidence.
      The remaining split is not decoration: coverage in one direction is the
      check everybody writes, and it is the other — every label names a LIVE
      registry value — that stops the catalogue accumulating wording for values
      renamed two slices ago. The retired-token promise is stated separately
      again, over the catalogue's own keys, because it is IMPLIED by the other
      two only for as long as no live value collides with a retired one.
      THE LAST SUITE NODE IS THE HALF THAT MATTERS MOST. Coverage proves the catalogue is
      complete, not that anything USES it. `apps/ui/src/lib/labels.ts` still
      hand-writes value maps and files still import the humaniser ADR-0008 §4.3
      retires, so #210 keeps it as an explicit legacy adapter and makes every
      one of its debts a migration-ledger entry with an owner slice — one per
      map, per renderer and per humanising importer, 42 of them when it was
      seeded and fewer with every slice that pays one. The live count is the
      ledger's to state and is deliberately not restated here.
      THE LEDGER IS THE ALLOWLIST: a new map or a new humanising import is
      a ledger addition and the ratchet refuses it without a reviewed
      authorisation. That is what makes "reachable from allowlisted sites and
      nowhere else" mechanical rather than a review habit, and it is why this
      row's check reads `gates/migration-ledger.yaml` directly instead of
      holding a constant of its own — one encoding, the shape #203 got wrong.
      THE IMPORTER RATCHET IS THE OTHER HALF OF THAT SENTENCE, and it is not
      the ledger. #210 also says new code "may not reach the adapter" — and
      every map it exports falls back to the humaniser for a value it does not
      recognise, so ONE MORE importer spreads the retired behaviour without
      adding one ledger entry. None of the fifty-one seeded is a separate debt
      (each imports a map somebody already owes), so they are pinned in the
      test as a shrink-only set rather than seeded as fifty-one entries that
      would double the ledger and clear at exactly the same moment.
      THE `UI tests` STEP is named because the console's own suite is the only
      place the LOOKUP runs. The contract suite reads two files and compares
      them; it cannot see a catalogue that is complete and unreachable — a
      broken import, a resolver reading the wrong locale, a fallback quietly
      reintroduced. `apps/ui/src/lib/localisation.test.tsx` renders the three
      outcomes into the DOM. It is a workflow step rather than a suite node
      because there is still no vitest suite kind: this row needs the STEP
      armed, not a named vitest node, so adding a checker nobody has exercised
      would buy nothing.
      TWO PERMANENT EXCEPTIONS, not debts. `subscriptionStatusLabel` and
      `planIntervalLabel` word STRIPE's vocabulary. Map #137 constraint 5
      forbids UBB shipping a vendor catalogue, so the registry must never
      declare those concepts, so no label key can ever exist to move them to
      and no slice owes the work. A ledger entry for either would be a debt
      nobody could pay and would put G22's zero out of reach by construction.
      WHAT THIS GATE CANNOT SAY is whether the wording is any good, consistent
      or correctly translated. Those need judgement about meaning, which
      ADR-0008 §1 keeps human. It proves a value has words, that the words name
      something real, and that nothing invents them.

  G7:
    statement: >-
      Forbidden-term search — no retired word appears on any living surface:
      code, spec, SDK, console or living docs.
    oracle: the registry's `retired_aliases`, from #154 §8's table
    source: ADR-0006, #154 §12
    status: installed
    enforced_by:
      - suite: contracts
        node: >-
          tests/contracts/test_forbidden_terms.py::test_no_retired_word_appears_unaccounted_for
      - suite: contracts
        node: >-
          tests/contracts/test_forbidden_terms.py::test_every_tracked_file_is_swept_or_excluded_by_exactly_one_rule
      - suite: contracts
        node: >-
          tests/contracts/test_forbidden_terms.py::test_each_rule_excludes_exactly_the_number_of_files_it_declares
      - suite: contracts
        node: >-
          tests/contracts/test_forbidden_terms.py::test_the_declared_exclusion_set_is_exactly_what_the_file_says
    notes: >-
      Four nodes rather than one, because #206 asks for two different things and
      a single node would let either half rot. The first is the gate; the second
      is the TOTAL ACCOUNTING that makes it trustworthy — every tracked file is
      swept or matched by exactly one declared rule, so a surface quietly
      dropped from the walk fails, which counting exclusions alone cannot
      catch. The third and fourth are the exclusion list held to what it claims,
      by per-rule count and by a pinned literal of the whole set.
      TWO STATED LIMITS, recorded rather than left to be discovered. The match
      is case-sensitive over the token as the registry spells it, so a
      Pascal-cased spelling of a retired word is not a hit — and it is no other
      gate's subject either, since G9 compares a table against its own model
      rather than against the vocabulary. And `retired_senses` is deliberately
      not input: eight words are retired in one sense while live in another, and
      ADR-0008 §1 keeps that human-judged. #206 moved three of the eight —
      `flat`, `hold`, `estimate` — out of `retired_aliases` on the evidence of
      the sweep's first run, where between them they produced 1,069 hits and
      almost none of them the retired sense.
      ONE OCCURRENCE IS LOST TO THAT MOVE and is recorded rather than absorbed:
      `ProductFeeConfig.fee_type == "flat"` is the retired sense, and after the
      move no gate sees it — G7 because the word is no longer input, G2 because
      `fee_type` is a bare CharField the registry declares no concept for.
      SETTLED BY #227, which took the second of #191 story 15's two ways out:
      the field is not a public value set at all, so no concept is owed, and
      tests/contracts/test_product_fee_type_is_not_public.py is what makes that
      claim falsifiable. See G2's row for the reasoning.

  G8:
    statement: >-
      Webhook catalogue shape — every event is `<owner>.<past_tense>`, and every
      terminal Task event maps to a status value.
    oracle: >-
      the vocabulary registry, decomposed into ADR-0006 §5's two halves, against
      the event catalogue in apps/platform/events/schemas.py
    source: ADR-0006 §5, #154 §12
    status: installed
    notes: >-
      A SHAPE check, not a membership one, and that is what keeps it distinct
      from G2. The registry's end-state values are taken apart into the domain
      owners and the states entered, and a live name is judged on its halves —
      so a name the registry has never seen can still be assessed, which is what
      "shape" has to mean. G2 asks the membership question, over every surface,
      and #227 installed it. The Task conjunct is stated
      over BOTH `task.*` and `subtask.*` and over all six statuses rather than
      only the terminal five: "terminal Task events map to a status" is then a
      consequence rather than a rule needing its own definition of terminal.
      #205 installed it over twenty violations and renamed none of them, because
      an event name is a public contract and the rename belongs with the slice
      that rebuilds the event's subject. #222 then renamed the thirteen whose
      subject nothing rebuilds, in one act rather than four, because ADR-0006's
      Consequences say the v1 contract breaks deliberately ONCE. Seven remain in
      the ledger, owed by slices 5 and 6, and none of them is a rename: the two
      Task events SPLIT into `killed` and `expired` (#140 §4.3) and the five
      control events are rewritten under #150's four families.
      What it does NOT prove is that a declared transition is a past-tense form:
      no oracle here settles English tense, so that judgement is made once when
      a name is declared and mechanically held from then on (ADR-0008 §1, §9).
      A literal `-ed` rule was tried and refused nine of the registry's own
      thirty-seven names, including `credit_grant.expiring` and
      `wallet.balance_low`.
    enforced_by:
      - suite: contracts
        node: tests/contracts/test_webhook_catalogue.py::test_every_event_is_named_for_the_state_entered
      - suite: contracts
        node: tests/contracts/test_webhook_catalogue.py::test_every_task_event_maps_to_a_status_value
      - suite: contracts
        node: tests/contracts/test_webhook_catalogue.py::test_the_declared_end_state_obeys_the_rules_it_supplies

  G9:
    statement: >-
      `db_table == canonical(model_name)` for every first-party managed concrete
      model; every exception carries a reason.
    oracle: ADR-0006 §9, against the Django app registry
    source: ADR-0006 §9, #154 §6.4
    status: installed
    notes: >-
      Managed concrete first-party models only (#154 §6.4) — an unmanaged model
      maps a table UBB does not own. Three mismatches are in the ledger, owed by
      slices 4 and 8; `ConnectOAuthState` is in the permanent exceptions, and is
      an exception to the mechanism rather than to the rule. The same module
      carries #154 §6.4's two pre-flight checks — that no two models canonicalise
      onto one table, and that no canonical name exceeds PostgreSQL's identifier
      limit — because a gate demanding a name the database cannot hold would have
      no legal answer.
    enforced_by:
      - suite: platform
        node: ubb-platform/apps/platform/tests/test_model_naming.py::test_table_name_is_the_canonical_snake_cased_model_name

  G10:
    statement: >-
      No writable column exists for a fact ADR-0006 §4 says is derived —
      `tenant_posture`, and `measurements_status` since #271.
    oracle: ADR-0006 §4, against the Django app registry
    source: ADR-0006 §4, #154 §12
    status: installed
    notes: >-
      Green in the tree, and seeds nothing. It ships with a negative control
      that puts a real model carrying the column through the same entry point,
      because an absence test with nothing proving it can fail is a test that
      asserts nothing — the shape this repository has already shipped three
      times. That control is driven over the declared set rather than over one
      name, so a fact joining the gate is shown to be catchable in the commit
      that adds it. "Writable" is a concrete column: a property or serializer
      field serving the derived value read-only is exactly what ADR-0006 §4
      permits, and both facts here are served that way — the posture from
      `customer_billing_mode`, the measurement status by the serialiser of the
      posting detail response.
    enforced_by:
      - suite: platform
        node: ubb-platform/apps/platform/tests/test_model_naming.py::test_no_writable_column_stores_a_derived_fact

  G11:
    statement: >-
      `_micros` appears only on money-typed fields; no other unit uses the suffix.
    oracle: ADR-0006 §1, against the Django app registry
    source: ADR-0006 §1, #154 §12
    status: installed
    notes: >-
      Two conjuncts: a `_micros` field may not name a second unit, and it must be
      an integer column wide enough to hold micros. The first catches a second
      unit named in the field's OWN name, which is the shape the one real
      ambiguity took (`markup_percentage_micros`, both seeded); a `_micros`
      column silently holding seconds under a money-shaped name is invisible to
      it and belongs to review — ADR-0008 §9's limit, at field scale.
    enforced_by:
      - suite: platform
        node: ubb-platform/apps/platform/tests/test_model_naming.py::test_the_micros_suffix_names_money_and_nothing_else

  G12:
    statement: >-
      The enum-name rule over declaring models — `method`, `mode` and
      `structure` mean the three different things ADR-0006 §3 says they mean.
    oracle: ADR-0006 §3 and §7, against the Django app registry
    source: ADR-0006 §3, #154 §12
    status: installed
    notes: >-
      The near-miss comparison is against the five names ADR-0006 §3 spells, not
      an edit distance against the three bare words: `code` is one character from
      `mode`, and `status_code`, `reason_code` and `referral_code` are correct
      names a distance rule would condemn. A second conjunct refuses Django's own
      noun as a field word (§7 — the framework yields), so a future
      `analytics_model` is caught and not only the one collision §3 already
      names. `Rate.pricing_model` is seeded. The VALUES of a method or mode field
      are G2's business, not this gate's.
    enforced_by:
      - suite: platform
        node: ubb-platform/apps/platform/tests/test_model_naming.py::test_method_mode_and_structure_describe_different_things

  G13:
    statement: No unqualified domain import of a Celery `tasks` module.
    oracle: ADR-0006 §7, against the platform's import graph
    source: ADR-0006 §7, #154 §12
    status: installed
    notes: >-
      The rule is about a BINDING, not a path: `import apps.x.tasks` binds `apps`
      and its uses are therefore qualified, which is exactly what ADR-0006 §7
      asks for. What is refused is binding the bare word `tasks` — and, in a
      second conjunct recorded here rather than smuggled in, binding Celery's own
      `Task` unqualified, which is the identical collision one level down and
      would otherwise be legal. Same shape as G12's second conjunct. It walks
      every AST node, so a lazy function-body import is caught exactly as a
      module-scope one — the historical erosion vector ADR-001's Context names —
      and unlike the boundary walker beside it, tests and migrations are in
      scope: no fixture has a reason to bind this word, and the tree is clean, so
      the strict form leaves no allowlist to erode. It seeds NOTHING, which is
      why it ships with negative controls for all four violating shapes and
      positive controls for each qualified form the failure message recommends
      — an absence test with nothing proving it can fail asserts nothing.
    enforced_by:
      - suite: platform
        node: ubb-platform/apps/platform/tests/test_celery_import_discipline.py::test_no_domain_module_imports_a_celery_tasks_module_unqualified
      - suite: platform
        node: ubb-platform/apps/platform/tests/test_celery_import_discipline.py::test_celery_does_not_bind_the_domain_noun

  G14:
    statement: The four `kind` discriminator pins.
    oracle: "#154 §3.8"
    source: "#154 §3.8, #154 §12"
    status: owned_by_slice_5
