# The gate manifest — one row per gate in ADR-0008 §8, plus the obligations
# that are not gates at all (#201).
#
# ADR-0008 §8 lists twenty-seven standing gates. Before this file existed they
# lived in a table inside a frozen decision document, which is a list of
# intentions: nothing compared it against the repository, and a gate that
# quietly stopped running would have gone on being listed as one.
#
# So each row states what the gate asserts, what oracle settles it, and exactly
# one status. An `installed` row names its enforcement sites and those sites are
# verified — the job runs on push and pull request, the job and step are not
# `continue-on-error`, there is no `if:` and no path filter, and a named test
# node is one the suite actually collects and is not marked skip or xfail. An
# `owned_by_slice_N` row names a slice from `slices.yaml` and states what must
# exist before the gate can be installed.
#
# This is the defence against the failure mode this repository has already
# shipped three times: a check that exists but cannot fail anything. The sweep
# wired `continue-on-error`. The only end-to-end money test sat in no CI job.
# Three SDK tests patched the transport, so the mock reproduced the mistake.
#
# What it does NOT prove is that a running gate's assertions are worth making.
# Every gate here is a consistency check (ADR-0008 §9), and this manifest is a
# consistency check over those. Consistency with a wrong declaration is green.
#
# See gates/README.md for how a row is flipped from owned to installed.

version: 1

# --- The pytest suites a row may name ---------------------------------------
#
# Every suite here is verified whether or not a gate names it today, so
# declaring one is a claim that gets checked rather than a convenience.
#
# There is no `ui` suite: the console's tests are vitest, and no gate needs a
# vitest NODE yet. The UI checks that gate today are named as workflow steps
# below, which is the honest form for them. A slice that needs a vitest node
# adds the suite kind then, rather than this file carrying a checker nobody has
# exercised.
suites:
  contracts:
    summary: >-
      The repository-wide contract suite at the git root — agreement BETWEEN the
      platform, the console, the SDK and the committed contract.
    job: contracts
    step: Contract suite — the registry, and the gates over it
    root: tests/contracts
    config: tests/contracts/pytest.ini

  platform:
    summary: >-
      The Django suite. Home of the checks whose subject is the model layer,
      because they need the app registry loaded.
    job: test
    step: Platform test suite
    root: ubb-platform
    config: ubb-platform/pytest.ini

  sdk:
    summary: The Python client's own suite.
    job: test
    step: SDK test suite
    root: ubb-sdk
    # No pytest configuration file: collection follows pytest's defaults.

# --- The twenty-seven standing gates ----------------------------------------

gates:
  G1:
    statement: >-
      The registry is internally valid — no duplicate canonical term, no
      conflicting definition across files.
    oracle: domain-vocabulary/schema.yaml
    source: ADR-0008 §2, #158 §3.7
    status: installed
    enforced_by:
      - suite: contracts
        node: tests/contracts/test_vocabulary_registry.py::test_the_shipped_registry_is_valid

  G2:
    statement: >-
      Every closed value set matches its backend, console and SDK consumers.
    oracle: the vocabulary registry
    source: ADR-0008 §2, #158 §3.2
    status: owned_by_slice_0
    blocked_on: >-
      Two of the three consumers do not exist. The backend constants are
      generated and checked (#200); the console and SDK constants are generated
      by #207, and until they are there is nothing to compare on those surfaces.
      Installing the gate over the backend alone would let it report green while
      saying nothing about two thirds of its own statement. The values it will
      compare against are the complete end-state set in domain-vocabulary/
      (#202), which disagrees with the tree today — so #207 seeds every
      disagreement it finds into the ledger in the same pull request.

  G3:
    statement: >-
      Every registry-known open value is present in UBB-owned consumers. The
      check is asymmetric: a runtime value the registry has never seen stays
      legal where the concept is open.
    oracle: the vocabulary registry
    source: ADR-0008 §2, #158 §3.3
    status: owned_by_slice_0
    blocked_on: >-
      The same missing consumers as G2 — the console and SDK vocabulary
      constants generated by #207, seeded from the same domain-vocabulary/
      known values (#202).

  G4:
    statement: >-
      No open concept has been silently converted to a closed schema enum;
      recognised values appear as `x-ubb-known-values` metadata, never as an
      `enum` array.
    oracle: the vocabulary registry, compared against openapi/v1.json
    source: ADR-0008 §2, #158 §3.6
    status: owned_by_slice_0
    blocked_on: >-
      The registry does not yet say where in the spec a concept appears, so
      there is nothing to compare a schema against. #208 generates the
      known-value metadata and with it the concept-to-schema mapping this gate
      reads, from the open concepts domain-vocabulary/ declares (#202).

  G5:
    statement: >-
      Generated artifacts are current — regenerating from the registry produces
      zero diff.
    oracle: the vocabulary registry
    source: ADR-0008 §2, #158 §3.5
    status: installed
    notes: >-
      The CI step's verdict is the whole worktree rather than a named path, so a
      target added to `tools.vocabulary.generate.TARGETS` by #207 or #208 is
      covered on the day it is added — including a new generated file nobody
      committed, which a named-path check cannot see at all.
    enforced_by:
      - suite: contracts
        node: tests/contracts/test_generated_vocabulary.py::test_every_generated_artifact_matches_the_registry
      - job: contracts
        step: Vocabulary generation gate — regeneration produces zero diff

  G6:
    statement: >-
      Every required registry value has a label; every label maps to a valid
      registry value; no retired token remains labelled; every supported locale
      carries the key.
    oracle: the vocabulary registry, compared against the console's label catalogue
    source: ADR-0008 §4, #158 §4.2
    status: owned_by_slice_0
    blocked_on: >-
      The console has no label catalogue to check. `apps/ui/src/lib/labels.ts`
      is today both identity and expression (#158 §16); #210 splits them and
      lands the catalogue, the strict lookup and the coverage check. The keys it
      must cover are the `label_key_prefix` of every valued concept in
      domain-vocabulary/ (#202), and the tokens it may not label are that
      registry's retired terms.

  G7:
    statement: >-
      Forbidden-term search — no retired word appears on any living surface:
      code, spec, SDK, console or living docs.
    oracle: the registry's `retired_aliases`, from #154 §8's table
    source: ADR-0006, #154 §12
    status: owned_by_slice_0
    blocked_on: >-
      The sweep itself, and its declared and counted exclusions — #206. The
      retired terms are already registry data (#198), so the input exists; the
      walker and its exclusion accounting do not.

  G8:
    statement: >-
      Webhook catalogue shape — every event is `<owner>.<past_tense>`, and every
      terminal Task event maps to a status value.
    oracle: ADR-0006 §5, against the event catalogue
    source: ADR-0006 §5, #154 §12
    status: owned_by_slice_0
    blocked_on: The catalogue-shape gate, installed by #205 over today's 35-event catalogue.

  G9:
    statement: >-
      `db_table == canonical(model_name)` for every first-party managed concrete
      model; every exception carries a reason.
    oracle: ADR-0006 §9, against the Django app registry
    source: ADR-0006 §9, #154 §6.4
    status: installed
    notes: >-
      Managed concrete first-party models only (#154 §6.4) — an unmanaged model
      maps a table UBB does not own. Three mismatches are in the ledger, owed by
      slices 4 and 8; `ConnectOAuthState` is in the permanent exceptions, and is
      an exception to the mechanism rather than to the rule. The same module
      carries #154 §6.4's two pre-flight checks — that no two models canonicalise
      onto one table, and that no canonical name exceeds PostgreSQL's identifier
      limit — because a gate demanding a name the database cannot hold would have
      no legal answer.
    enforced_by:
      - suite: platform
        node: ubb-platform/apps/platform/tests/test_model_naming.py::test_table_name_is_the_canonical_snake_cased_model_name

  G10:
    statement: No writable `tenant_posture` column exists — the fact is derived, not stored.
    oracle: ADR-0006 §4, against the Django app registry
    source: ADR-0006 §4, #154 §12
    status: installed
    notes: >-
      Green in the tree, and seeds nothing. It ships with a negative control
      that puts a real model carrying the column through the same entry point,
      because an absence test with nothing proving it can fail is a test that
      asserts nothing — the shape this repository has already shipped three
      times. "Writable" is a concrete column: a property or serializer field
      serving the derived value read-only is exactly what ADR-0006 §4 permits.
    enforced_by:
      - suite: platform
        node: ubb-platform/apps/platform/tests/test_model_naming.py::test_no_writable_column_stores_the_derived_tenant_posture

  G11:
    statement: >-
      `_micros` appears only on money-typed fields; no other unit uses the suffix.
    oracle: ADR-0006 §1, against the Django app registry
    source: ADR-0006 §1, #154 §12
    status: installed
    notes: >-
      Two conjuncts: a `_micros` field may not name a second unit, and it must be
      an integer column wide enough to hold micros. The first catches a second
      unit named in the field's OWN name, which is the shape the one real
      ambiguity took (`markup_percentage_micros`, both seeded); a `_micros`
      column silently holding seconds under a money-shaped name is invisible to
      it and belongs to review — ADR-0008 §9's limit, at field scale.
    enforced_by:
      - suite: platform
        node: ubb-platform/apps/platform/tests/test_model_naming.py::test_the_micros_suffix_names_money_and_nothing_else

  G12:
    statement: >-
      The enum-name rule over declaring models — `method`, `mode` and
      `structure` mean the three different things ADR-0006 §3 says they mean.
    oracle: ADR-0006 §3 and §7, against the Django app registry
    source: ADR-0006 §3, #154 §12
    status: installed
    notes: >-
      The near-miss comparison is against the five names ADR-0006 §3 spells, not
      an edit distance against the three bare words: `code` is one character from
      `mode`, and `status_code`, `reason_code` and `referral_code` are correct
      names a distance rule would condemn. A second conjunct refuses Django's own
      noun as a field word (§7 — the framework yields), so a future
      `analytics_model` is caught and not only the one collision §3 already
      names. `Rate.pricing_model` is seeded. The VALUES of a method or mode field
      are G2's business, not this gate's.
    enforced_by:
      - suite: platform
        node: ubb-platform/apps/platform/tests/test_model_naming.py::test_method_mode_and_structure_describe_different_things

  G13:
    statement: No unqualified domain import of a Celery `tasks` module.
    oracle: ADR-0006 §7, against the platform's import graph
    source: ADR-0006 §7, #154 §12
    status: owned_by_slice_0
    blocked_on: >-
      The import-discipline gate (#205). The module move (#196) is what makes it
      meaningful and has landed; the walker has not.

  G14:
    statement: The four `kind` discriminator pins.
    oracle: "#154 §3.8"
    source: "#154 §3.8, #154 §12"
    status: owned_by_slice_5
    blocked_on: >-
      `UsageEvent.kind` does not exist. Slice 5 introduces the column with the
      `Charge` entity and its 1:1 posting projection, which is what produces a
      `task_charge` row at all. A gate whose subject does not exist is a test
      that passes on nothing.
    notes: >-
      Two of the four pins — `recorded_events` counting `metered_usage` only,
      and analytics excluding `task_charge` — reach their final form in slice 7
      (#189). If slice 5 finds it can only pin two, it re-owns this row to
      slice 7 rather than installing half a gate.

  G15:
    statement: >-
      OpenAPI drift, oasdiff breaking (cumulative against the immutable
      `api-v1-launch` baseline), TypeScript smoke, UI contract snapshot and UI
      typecheck.
    oracle: openapi/v1.json
    source: ADR-002, ADR-0008 §8, ci.yml
    status: installed
    notes: >-
      The cumulative comparison #191 decision 11 adds landed with #195; the
      breaking step below already compares against the tag rather than against
      the previous commit.
    enforced_by:
      - job: contract
        step: Drift gate — offline regeneration produces zero diff
      - job: contract
        step: Breaking gate — cumulative vs the api-v1-launch baseline
      - job: contract
        step: TypeScript smoke gate — committed spec generates clean types
      - job: contract
        step: UI contract snapshot gate — committed spec produces zero diff
      - job: contract
        step: UI typecheck — the console compiles against the committed contract

  G16:
    statement: >-
      SDK core and exception-hierarchy regeneration — the committed artifacts
      are exactly what the pinned generators produce.
    oracle: openapi/v1.json and openapi/error-codes.json
    source: ADR-002, ci.yml
    status: installed
    enforced_by:
      - job: contract
        step: SDK core regeneration gate — zero diff
      - job: contract
        step: SDK exception hierarchy regeneration gate — zero diff

  G17:
    statement: >-
      Every hand-written SDK call targets a real operation, matched by method
      plus normalised path or by `operationId`.
    oracle: openapi/v1.json
    source: ADR-0007 §4
    status: owned_by_slice_0
    blocked_on: >-
      The SDK operation gate (#204), which also seeds the three known calls to
      routes that exist in no spec and no router.

  G18:
    statement: >-
      Every published operation carries an explicit SDK disposition; an increase
      in the unwrapped count is a reviewed change.
    oracle: the generated disposition manifest
    source: ADR-0007 §4
    status: owned_by_slice_0
    blocked_on: >-
      The disposition manifest itself, generated by #204 over the spec's 134
      operations.

  G19:
    statement: >-
      Field transition classes are enforced in the database across `save()`,
      `QuerySet.update()` and raw SQL.
    oracle: ADR-0007 §2
    source: ADR-0007 §2
    status: owned_by_slice_3
    blocked_on: >-
      No column is declared into a transition class yet. Slice 3 introduces the
      first RESOLVE_ONCE pair — a nullable `provider_cost_micros` resolving
      atomically with `costing_status` — which is the subject this gate needs.
    notes: >-
      Slice 3 is the first slice with protected columns, not the last. Later
      slices adding FROZEN, SET_ONCE or PRUNABLE columns extend the installed
      gate rather than re-owning this row.

  G20:
    statement: Migrations carry their data — a rename, never an add-and-remove pair.
    oracle: ADR-0007 §1
    source: ADR-0007 §1
    status: owned_by_slice_8
    blocked_on: >-
      ADR-0007 §1 states the data-carrying rule does not bind before the cutover
      squash. Installing it now would gate the eight slices that are explicitly
      exempt from it.

  G21:
    statement: The five cutover assertions.
    oracle: "#153 §13.5"
    source: "#155 §11.3"
    status: owned_by_slice_8
    blocked_on: The cutover itself — there is no migration squash, audit reset or baseline rotation to assert about.

  G22:
    statement: >-
      Every seeded allowlist at zero; the SDK invalid-call list at zero; no
      unexplained oasdiff difference.
    oracle: "#155"
    source: "#155 §11.3"
    status: owned_by_slice_8
    blocked_on: >-
      The migration ledger reaches zero AT slice 8 (#158 §11.3). Asserting zero
      before then would fail every slice from 0 to 7 by design.
    notes: >-
      This is the gate the ledger exists to make reachable, and the reason
      permanent reasoned exceptions are a separate list — mixing them in would
      make zero unachievable by construction.

  G23:
    statement: >-
      Code Builder static layer — operation IDs resolve, no secrets are
      rendered, declared names are preserved, the verdict matches the plan.
    oracle: the spec, the resolved plan and the registry
    source: ADR-0008 §5, #158 §5.2
    status: owned_by_slice_builder
    blocked_on: The Code Builder does not exist. #184 lands the plan contract, the renderer and the verify stage.

  G24:
    statement: Code Builder renderer branches, pinned by snapshot.
    oracle: the committed snapshots
    source: ADR-0008 §5, #158 §5.2
    status: owned_by_slice_builder
    blocked_on: There is no renderer to snapshot. #184 lands `ubb-codegen`.

  G25:
    statement: >-
      Code Builder execution — complete artifacts are written to disk and run
      unmodified against a real ephemeral application.
    oracle: the running application
    source: ADR-0008 §5, #158 §5.3
    status: owned_by_slice_builder
    blocked_on: >-
      No artifact is generated to run. #184 lands the renderer and the execution
      harness; ADR-0008 §5 forbids CI repairing the code it runs, so the harness
      is part of the gate rather than scaffolding around it.

  G26:
    statement: >-
      The five secret tests — no secret value in generated source, none in
      fixtures or snapshots, every secret reference carries setup instructions,
      every non-secret platform-known value renders consistently, every runtime
      value lands at its declared scope.
    oracle: "#156 §7"
    source: "#156 §13, #158 §8"
    status: owned_by_slice_builder
    blocked_on: There is no generated source to inspect. #184 lands the renderer these five tests run over.

  G27:
    statement: >-
      The payment-rail activation invariant — `prepaid` and `postpaid` may not
      be enabled without a matching activation record for the rail.
    oracle: the PaymentRailActivation record
    source: ADR-0008 §6, #158 §10.3
    status: owned_by_slice_8
    blocked_on: >-
      `PaymentRailActivation` does not exist as a record or a flag. #191
      decision 14 splits this: slice 0 declares the vocabulary and this
      obligation; slice 8 builds the record, the flag and the centrally enforced
      invariant.
    notes: >-
      ADR-0008 §6 requires the invariant to be enforced centrally and never as
      an advisory console convention, so this row is not satisfied by a UI
      check. Slice 0's half is DONE and is checkable now: `payment_rail` and
      `payment_rail_environment` are `closed` concepts in
      domain-vocabulary/concepts/payment-rails.yaml (#202), declaring no
      consumers, because ADR-0008 §10.4 requires the names to exist before
      anything is built on them and ADR-0007 §3 forbids a provisional one. This
      row staying owned is what distinguishes that early declaration from the
      later implementation of the check — the names existing must never be read
      as the invariant being enforced.

# --- Obligations that are not gates -----------------------------------------
#
# ADR-0008 §6 is explicit that these are "carried as an explicit deferred
# prerequisite with a reason, an owner and required evidence — never silently
# marked passed". Without a home they are carried in prose in a frozen document,
# which is how an obligation becomes a surprise. They are listed apart from the
# gates because they are not §8 rows and never become CI checks: no oracle can
# settle them, by ADR-0008 §1's third clause.
obligations:
  O1:
    statement: >-
      One owned pre-launch acceptance audit, recorded against a named commit and
      API baseline, covering only what ADR-0008 §1 leaves to judgement.
    oracle: none — this is the human half, by construction
    source: ADR-0008 §8, #158 §9
    status: deferred_obligation
    reason: >-
      Every question it covers requires judgement about meaning, adequacy or
      acceptable risk rather than comparison against an authoritative source.
      Encoding one as a brittle assertion would overstate what it established —
      ADR-0008 §1's third clause exists to prevent exactly that conversion.
    owner_role: >-
      The accountable engineering owner. ADR-0008 §9 records the role, not the
      individual: no personnel data is checked into this repository, and naming
      the person is an act outside it.
    evidence_required: >-
      The record of #158 §9.2 — audit date, auditor role, commit and API
      baseline, decision documents and ADRs reviewed, standing CI gates relied
      upon, manual scenarios exercised, known accepted limitations — plus
      ADR-0008 §9's sentence verbatim.

  O2:
    statement: >-
      Platform admission — the deliberate act after which a tenant in
      `customer_billing_mode: external` may be enabled.
    oracle: none — a decision with a name on it
    source: ADR-0008 §6, #158 §10.2
    status: deferred_obligation
    reason: >-
      ADR-0007 §5 assumed one admission act; ADR-0008 §6 splits it, because a
      tenant billing their own customers elsewhere never touches a payment rail
      and gating them on payment infrastructure blocks them on something they
      will never use.
    owner_role: The accountable engineering owner, as O1.
    evidence_required: >-
      The acceptance audit passed, CI green, the API and SDK baseline
      established, Code Builder execution tests passed, and the accepted
      limitations recorded. The dated note in docs/api-compatibility.md is
      deleted at this act, since it is the point after which ADR-0003 §4 governs
      the contract.

  O3:
    statement: >-
      Billing-capability activation, scoped per payment rail — the act after
      which `prepaid` or `postpaid` may be enabled for that rail.
    oracle: none — a commercial decision with external dependencies
    source: ADR-0008 §6, #158 §11.5
    status: deferred_obligation
    reason: >-
      A live-money transaction is not a platform-completion condition.
      Requiring one to finish internal engineering turns an external commercial
      dependency into an artificial blocker, and invites a payment account
      created to satisfy a ticket's wording. #158 §11 moves it off slice 8's
      completion gate for that reason, which is precisely why it must be carried
      here instead of assumed.
    owner_role: >-
      The named approver recorded on the activation, per ADR-0008 §6's
      `PaymentRailActivation { rail, environment, activated_at, approved_by,
      evidence }`.
    evidence_required: >-
      An automated test-mode round trip, live credentials and webhooks verified,
      one controlled live-mode transaction, reconciliation and idempotency
      confirmed, runbooks owned, and a named approver — per rail, so one
      successful transaction on one rail is never read as readiness for another.
