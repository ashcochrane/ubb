# The migration ledger — every current violation of an INSTALLED gate, as an
# individually identified entry that a named slice owes (#201, #158 §11.3).
#
# It is a finite migration plan, not permission for the old architecture to
# survive. It only ever shrinks, it reaches zero at slice 8 before platform
# admission, and every entry names the slice that removes it — which is #155
# §17's recorded residue closed: an entry cannot survive to slice 8 because
# everyone assumed somebody else owned it.
#
# Three mechanical rules, all enforced (gates/README.md has the reasoning):
#
#   1. It only shrinks. CI compares this file against the base branch's and
#      fails on any added entry, unless a `seeding_authorisation` below names
#      the gate — the explicit, reviewed override. An entry's owner slice may
#      move earlier but never later, because deferring a debt quietly is the
#      same failure as adding one.
#   2. Every entry names a real gate and a real slice. The gate must be
#      `installed` in gates/manifest.yaml: an entry against a gate that cannot
#      fail anything is a note, not a debt, and nothing would ever prove it
#      right or wrong.
#   3. An entry whose owner slice has already landed fails CI.
#
# ---------------------------------------------------------------------------
#
# THE FIRST SEEDING: the four model-naming gates (#203).
#
# G9, G10, G11 and G12 were installed in the pull request that added these
# entries, over a tree that violates three of them. That ordering is the point
# rather than an embarrassment: a gate installed before the code complies is
# what makes the vocabulary impossible to regress (#155 §3.1). G10 seeds
# nothing — no writable `tenant_posture` column exists — so it carries no
# authorisation below, because an override that overrides nothing is the shape
# of a check that cannot fail.
#
# Every entry's `site` is exactly the string the gate itself prints, and
# `ubb-platform/apps/platform/tests/test_model_naming.py::
# test_every_seeded_entry_is_still_a_real_violation` fails if a seeded site
# stops being a violation. So an entry cannot outlive the debt it records:
# paying it and deleting it are one act.

version: 1

entries:
  # --- G9: `db_table == canonical(model_name)` ------------------------------
  #
  # The `Rate` / `RateCard` inversion — each model sitting on the other's
  # table. #154 §6.2 records that it resolves BY CONSTRUCTION rather than by a
  # rename: #138 splits `Rate` into supplier cost and pricing rules, #148
  # replaces `RateCard` with the Pricing Book, and both tables are rebuilt
  # regardless. The replacements take correct names instead of inheriting
  # inverted legacy ones, which is why renaming them earlier would be work with
  # no product (#155 §3.1).
  #
  # Owned by slice 4 rather than slice 3: `Rate` carries both halves of the
  # split (`card_type ∈ {cost, price}`), so the model — and its table — can
  # only go when the price half goes too. Slice 4 is where `Rate` stops
  # existing.
  - id: g9-rate-sits-on-the-rate-card-table
    gate: G9
    site: ubb-platform/apps/metering/pricing/models.py::Rate
    expected: ubb_rate
    found: ubb_rate_card
    owner_slice: slice_4
    reason: >-
      `Rate` sits on the legacy `ubb_rate_card` table, which its own name says
      belongs to `RateCard`. Resolved by construction when slice 4 finishes
      replacing `Rate` with the Pricing Book's rules (#154 §6.2).

  - id: g9-rate-card-sits-on-the-container-table
    gate: G9
    site: ubb-platform/apps/metering/pricing/models.py::RateCard
    expected: ubb_rate_card
    found: ubb_rate_card_container
    owner_slice: slice_4
    reason: >-
      The other half of the inversion: `RateCard` was pushed onto
      `ubb_rate_card_container` when the misnamed original took its table.
      Slice 4's Pricing Book replaces it and takes the correct name (#154 §6.2).

  # No domain slice touches `CustomerSubscriptionItem` — #194's slice table
  # never names subscriptions — so nothing earlier than the cutover removes this
  # debt, and recording it against a slice that does not do the work would be
  # #155 §17's failure with a nicer label. Slice 8's migration squash (#155
  # §11.1) is what clears it: the fresh initial set creates the table under the
  # correct name, and §11.3 already requires every seeded allowlist to be at
  # zero by then.
  #
  # #154 §6.3 demanded this be a GENUINE rename, preserving rows, keys and
  # constraints rather than a drop-and-recreate. #155 §5.5 dissolves that
  # requirement out loud: under a squash there is no prior table to rename. The
  # debt survives the dissolved requirement — the wrong name is still on the
  # tree today — which is why it is recorded here rather than treated as
  # already handled.
  #
  # An owner slice may move EARLIER but never later, so any slice that touches
  # subscriptions before the cutover may take this and pull the rename forward.
  - id: g9-customer-subscription-item-table-abbreviated
    gate: G9
    site: ubb-platform/apps/subscriptions/models.py::CustomerSubscriptionItem
    expected: ubb_customer_subscription_item
    found: ubb_customer_sub_item
    owner_slice: slice_8
    reason: >-
      `sub` is a short form beside a long form, which ADR-0006 §2 refuses. No
      domain slice touches this model; slice 8's squash creates the table under
      the correct name (#155 §11.1, and §5.5 for why no rename migration is
      owed).

  # --- G11: `_micros` means millionths of a currency unit ------------------
  #
  # The suffix means money on 73 columns and millionths of a PERCENT on these
  # two. #147 §9.2 records what the ambiguity has already cost: the
  # `le=1_000_000_000` bound exists specifically because such a value "is far
  # more likely a unit error (percent passed as micros) than a real commercial
  # term". `expected` is ADR-0006 §1's honest spelling — same scale, right unit.
  #
  # Both are owned by slice 4, which per #194's slice table deletes `TenantMarkup`
  # and `Plan.markup_percentage_micros` outright. Deletion clears the debt as
  # surely as a rename; what may not happen is the field surviving under this
  # name past that slice.
  - id: g11-tenant-markup-percentage-micros
    gate: G11
    site: ubb-platform/apps/metering/pricing/models.py::TenantMarkup.markup_percentage_micros
    expected: markup_micro_percent
    found: markup_percentage_micros
    owner_slice: slice_4
    reason: >-
      Millionths of a percent under the money suffix. Slice 4 deletes
      `TenantMarkup` when pricing rules replace it (#154 §3.5, #147 §9.2).

  - id: g11-plan-markup-percentage-micros
    gate: G11
    site: ubb-platform/apps/platform/plans/models.py::Plan.markup_percentage_micros
    expected: markup_micro_percent
    found: markup_percentage_micros
    owner_slice: slice_4
    reason: >-
      The same unit collision on the kernel's Plan. Slice 4 deletes it; the Plan
      gains a required `pricing_book_id` instead (#154 §6, #151 §7).

  # --- G12: method, mode and structure describe different things ------------
  #
  # `pricing_model` sits one character from `pricing_mode`, a declared concept
  # meaning something entirely different — which pricing regime governs a Task,
  # rather than the arithmetic shape of a rate. #151 §13.2 ratified
  # `rate_structure` precisely because a name "may not survive one character
  # from `pricing_mode`".
  - id: g12-rate-pricing-model
    gate: G12
    site: ubb-platform/apps/metering/pricing/models.py::Rate.pricing_model
    expected: rate_structure
    found: pricing_model
    owner_slice: slice_4
    reason: >-
      One character from `pricing_mode`, and unrelated to it. Slice 4's pricing
      rules carry `rate_structure ∈ {per_unit, fixed_component}` (#151 §13.2).

  # --- G17: every hand-written SDK call targets a real operation -------------
  #
  # THE SECOND SEEDING (#204). The three calls #155 §1.3 found: routes that
  # exist in no spec and in no router, green in CI for months because the tests
  # that cover them patch the HTTP client, so the mock reproduced the mistake
  # instead of contradicting it. `gates/README.md` lists that as one of the
  # three times this repository has shipped a check that could not fail.
  #
  # Two conventions differ from the model-naming entries above, and both follow
  # from the subject rather than from preference:
  #
  # - `found` is `METHOD` plus the path with each parameter collapsed to `{}`,
  #   which is the identity the gate matches on (ADR-0007 §4: method AND path,
  #   because `GET /x/{id}` is not `POST /x/{id}`). Collapsed rather than as
  #   written, so renaming a local variable in a dead method does not turn the
  #   board red for no reason.
  # - `expected` is the END STATE, not a canonical name. There is no correct
  #   route to point at: the operations these methods want were never published,
  #   and the debt is discharged by the call going away. A name here would be an
  #   invention, which is what ADR-0007 §3 refuses.
  #
  # All three are owned by slice 4, the same slice that owns the `Rate` /
  # `RateCard` table inversion above and for the same reason: #194's slice table
  # gives slice 4 the Pricing Book, which is what replaces the rate-card surface
  # these three methods are the ergonomics for. An owner slice may move earlier
  # but never later, so any slice that rewrites the SDK's pricing methods before
  # then may take them.
  #
  # They are NOT deleted here. #155 §8.1 puts the SDK's next breaking release
  # after slice 8 as one coordinated event, and removing three public methods is
  # a surface break; #204 asks for the invariant behind the review, which is
  # what this gate is.
  - id: g17-sdk-updates-a-rate-card-on-a-retired-flat-path
    gate: G17
    site: ubb-sdk/ubb/metering.py::MeteringClient.update_rate_card
    expected: no call — the method goes with the rate-card surface
    found: PUT /api/v1/metering/pricing/rate-cards/{}
    owner_slice: slice_4
    reason: >-
      The bare `/pricing/rate-cards/{card_id}` addressing the #86 sweep re-nested
      under the book — `api/v1/metering_endpoints.py` records the move on the
      DELETE that survived it. Nothing publishes a PUT there under any method.
      Slice 4's Pricing Book replaces versioning a card in place.

  - id: g17-sdk-reads-a-rate-card-history-that-is-not-published
    gate: G17
    site: ubb-sdk/ubb/metering.py::MeteringClient.get_rate_card_history
    expected: no call — the method goes with the rate-card surface
    found: GET /api/v1/metering/pricing/rate-cards/{}/history
    owner_slice: slice_4
    reason: >-
      A lineage history endpoint that exists in no spec and no router. Slice 4's
      immutable Pricing Book Publish records are what a caller reads instead
      (#148, #155 §3).

  - id: g17-sdk-batch-creates-rate-cards-with-no-such-route
    gate: G17
    site: ubb-sdk/ubb/metering.py::MeteringClient.bulk_create_rate_cards
    expected: no call — the method goes with the rate-card surface
    found: POST /api/v1/metering/pricing/rate-cards/batch
    owner_slice: slice_4
    reason: >-
      An atomic batch create that exists in no spec and no router. Rates are
      added to a book one at a time and the book is published as a unit, which
      is the atomicity this method was reaching for.

  # --- G8: a webhook event is named for the state entered -------------------
  #
  # THE THIRD SEEDING (#205), and the largest: twenty of the catalogue's
  # thirty-five events. That is not decay, it is the absence of a convention —
  # ADR-0006 §5 fixed one on 2026-08-03 and the catalogue predates it. Some
  # namespaces are resources, some are products (`billing` owns the wallet's
  # levels, the grant's lifecycle and the customer's suspension), some are
  # mechanisms (`stop`, `soft_floor`), one is a retired spend-control family
  # (`budget`) and one is a measure (`margin`). Two spellings of one concept
  # coexist across this catalogue and the audit registry: `auto_topup` here,
  # `auto_top_up` there.
  #
  # **#205 installs the gate and renames nothing.** A rename is a public
  # contract change — the event name is what a subscriber subscribes to — so it
  # belongs to the slice that rebuilds the event's subject and can carry the
  # spec, the SDK and the console with it in one vertical. Renaming twenty
  # events in a gate-installation ticket would be the largest surface break of
  # the programme performed by the ticket least able to test it.
  #
  # Conventions, both following from the subject:
  #
  # - `site` is the declaring payload class, because `events/catalog.py` DERIVES
  #   its tuple from those classes — the class is where the name actually lives.
  #   `found` is the published name, and the excuse is keyed on BOTH (#204's
  #   rule): an entry keyed on the class alone would stay green if that class
  #   kept its debt and changed which wrong name it published.
  # - `expected` is the end-state name from
  #   domain-vocabulary/concepts/webhooks.yaml, and the gate checks that it IS
  #   one. Two entries name two events, joined by `and`: #140 §4.3 splits a
  #   spend kill from a Task nobody ever closed, so one overloaded event becomes
  #   two distinct states and a subscriber classifies by subscribing.
  #
  # Owner slices are #194's slice table, applied as "the slice that owns the
  # event's subject". Seven fall to slice 8, and that is the #203 precedent
  # rather than a shrug: no slice in the table rebuilds top-ups, withdrawals,
  # auto-top-up, credit grants or invoicing, and recording a debt against a
  # slice that does not do the work would be #155 §17's failure with a nicer
  # label. An owner slice may move earlier but never later, so any slice that
  # touches one of these surfaces first may take it.

  # Slice 5 (Work) — the Task's terminal states are its subject.
  - id: g8-task-limit-exceeded-names-a-bound-not-a-state
    gate: G8
    site: ubb-platform/apps/platform/events/schemas.py::TaskLimitExceeded
    expected: task.killed and task.expired
    found: task.limit_exceeded
    owner_slice: slice_5
    reason: >-
      Named for a bound rather than for the state entered, and `limit_exceeded`
      is no `task_status` value — so the event announces a state a Task cannot
      be in. It becomes TWO events: a subscriber alerting on spend incidents
      must stop being paged when a worker dies, and "how often did work stop on
      a ceiling?" must be answerable without parsing a reason string
      (#140 §4.3). Slice 5 lands the six lifecycle states.

  - id: g8-subtask-limit-exceeded-names-a-bound-not-a-state
    gate: G8
    site: ubb-platform/apps/platform/events/schemas.py::SubtaskLimitExceeded
    expected: subtask.killed and subtask.expired
    found: subtask.limit_exceeded
    owner_slice: slice_5
    reason: >-
      The same defect on contained work. One model and one status set means one
      rule, so the Subtask's terminal events split exactly as the Task's do
      (#154 §3.1). Slice 5 lands both.

  # Slice 6 (Spend control) — the four families, and the wallet they draw on.
  - id: g8-stop-fired-is-a-mechanism-namespace
    gate: G8
    site: ubb-platform/apps/platform/events/schemas.py::StopFired
    expected: customer.stopped
    found: stop.fired
    owner_slice: slice_6
    reason: >-
      `stop` is the mechanism, not a domain owner. A customer-wide stop is a
      state the CUSTOMER entered; which control fired travels as
      `control_family` and why as `reason_code`, which is exactly what
      ADR-0006 §5 moves out of the name. Slice 6 lands the four families.

  - id: g8-stop-cleared-is-a-mechanism-namespace
    gate: G8
    site: ubb-platform/apps/platform/events/schemas.py::StopCleared
    expected: customer.stop_cleared
    found: stop.cleared
    owner_slice: slice_6
    reason: >-
      The other half of the episode pair, under the same mechanism namespace.
      It moves with the event it closes, or the two stop pairing (#155 §3.1).

  - id: g8-soft-floor-crossed-is-a-mechanism-namespace
    gate: G8
    site: ubb-platform/apps/platform/events/schemas.py::SoftFloorCrossed
    expected: wallet_policy.soft_floor_crossed
    found: soft_floor.crossed
    owner_slice: slice_6
    reason: >-
      The soft floor is a wallet policy setting, and the policy is the declared
      control family that owns the namespace. One public concept, one public
      name, on the webhook and in `control_family` alike (ADR-0006 §2).

  - id: g8-soft-floor-cleared-is-a-mechanism-namespace
    gate: G8
    site: ubb-platform/apps/platform/events/schemas.py::SoftFloorCleared
    expected: wallet_policy.soft_floor_cleared
    found: soft_floor.cleared
    owner_slice: slice_6
    reason: >-
      The clear that pairs with the crossing above, and it moves with it.

  - id: g8-budget-threshold-reached-uses-a-retired-family
    gate: G8
    site: ubb-platform/apps/platform/events/schemas.py::BudgetThresholdReached
    expected: customer_spend_pool.threshold_reached
    found: budget.threshold_reached
    owner_slice: slice_6
    reason: >-
      `budget` named all four spend controls at once and left the vocabulary
      entirely (#154 §3.4); it survives here as the namespace of the event the
      pool fires. Slice 6 lands `customer_spend_pool` as the family.

  - id: g8-billing-owns-the-wallets-low-balance
    gate: G8
    site: ubb-platform/apps/platform/events/schemas.py::BalanceLow
    expected: wallet.balance_low
    found: billing.balance_low
    owner_slice: slice_6
    reason: >-
      `billing` is a product, not a domain owner, so it cannot own the wallet's
      own levels. Slice 6 lands the wallet policy that sets them.

  - id: g8-billing-owns-the-wallets-critical-balance
    gate: G8
    site: ubb-platform/apps/platform/events/schemas.py::BalanceCritical
    expected: wallet.balance_critical
    found: billing.balance_critical
    owner_slice: slice_6
    reason: >-
      The second of the wallet's three levels under a product namespace. All
      three move together or the set reads as three unrelated events.

  - id: g8-billing-owns-the-wallets-overage
    gate: G8
    site: ubb-platform/apps/platform/events/schemas.py::BalanceOverage
    expected: wallet.balance_overage
    found: billing.balance_overage
    owner_slice: slice_6
    reason: >-
      The third level, and the same product namespace.

  - id: g8-billing-owns-the-customers-suspension
    gate: G8
    site: ubb-platform/apps/platform/events/schemas.py::CustomerSuspended
    expected: customer.suspended
    found: billing.customer_suspended
    owner_slice: slice_6
    reason: >-
      Suspension is a state the customer entered, and the customer already owns
      a namespace in this catalogue — so the subject appears once as an owner
      and once inside a product's transition token, which is the ambiguity
      ADR-0006 §5 exists to remove. It follows the hard floor that causes it.

  # Slice 7 (Analytics) — both are emitted by the accrual margin engine in
  # apps/subscriptions/economics/, which slice 7's single economic query
  # replaces. Renaming either earlier would edit an emitter about to be deleted.
  - id: g8-margin-owns-the-customers-profitability
    gate: G8
    site: ubb-platform/apps/platform/events/schemas.py::MarginCustomerUnprofitable
    expected: customer.unprofitable
    found: margin.customer_unprofitable
    owner_slice: slice_7
    reason: >-
      Named for the figure being watched rather than the subject of the alert.
      The customer is what became unprofitable, and `gross_margin` is the
      measure that says so — a measure is not a domain owner.

  - id: g8-margin-owns-the-providers-cost-spike
    gate: G8
    site: ubb-platform/apps/platform/events/schemas.py::MarginProviderCostSpike
    expected: provider.cost_spike
    found: margin.provider_cost_spike
    owner_slice: slice_7
    reason: >-
      The same shape: the provider's cost spiked, and margin is the figure that
      moved as a result. Slice 2 makes Provider a real entity and slice 3 lands
      the cost, so either may pull this forward.

  # Slice 8 (Cutover) — no slice in #194's table rebuilds these subjects.
  - id: g8-billing-owns-the-top-up-request
    gate: G8
    site: ubb-platform/apps/platform/events/schemas.py::TopUpRequested
    expected: top_up.requested
    found: billing.topup_requested
    owner_slice: slice_8
    reason: >-
      A product namespace, and the audit ledger already registers this action as
      `top_up.requested` — so one concept is spelled two ways across two
      contracts today. No slice rebuilds top-ups; the cutover's one deliberate
      contract break carries it (#155 §11.1).

  - id: g8-billing-owns-the-withdrawal-request
    gate: G8
    site: ubb-platform/apps/platform/events/schemas.py::WithdrawalRequested
    expected: withdrawal.requested
    found: billing.withdrawal_requested
    owner_slice: slice_8
    reason: >-
      The same product namespace over a withdrawal's own state. No slice
      rebuilds withdrawals.

  - id: g8-auto-top-up-is-spelled-two-ways
    gate: G8
    site: ubb-platform/apps/platform/events/schemas.py::AutoTopupRequiresAction
    expected: auto_top_up.requires_action
    found: auto_topup.requires_action
    owner_slice: slice_8
    reason: >-
      One concept, two spellings: this event says `auto_topup` and the audit
      registry says `auto_top_up`, and they have disagreed for as long as both
      have existed (ADR-0006 §2). The only entry here that is purely a spelling
      correction — any slice touching auto-top-up may take it, and none is
      scheduled to.

  - id: g8-billing-owns-the-grants-expiry-warning
    gate: G8
    site: ubb-platform/apps/platform/events/schemas.py::CreditGrantExpiring
    expected: credit_grant.expiring
    found: billing.credit_grant_expiring
    owner_slice: slice_8
    reason: >-
      The grant owns its own lifecycle; `billing` is the product it is filed
      under. No slice rebuilds credit grants.

  - id: g8-billing-owns-the-grants-expiry
    gate: G8
    site: ubb-platform/apps/platform/events/schemas.py::CreditGrantExpired
    expected: credit_grant.expired
    found: billing.credit_grant_expired
    owner_slice: slice_8
    reason: >-
      The terminal half of the grant's lifecycle, under the same product
      namespace, and it moves with the warning above.

  - id: g8-usage-owns-the-invoice-push
    gate: G8
    site: ubb-platform/apps/platform/events/schemas.py::UsageInvoicePushed
    expected: usage_invoice.pushed
    found: usage.invoice_pushed
    owner_slice: slice_8
    reason: >-
      The invoice's own state, filed under the thing that produced it — so the
      subject appears inside the transition token instead of owning the
      namespace. No slice rebuilds invoicing.

  - id: g8-usage-owns-the-invoice-push-failure
    gate: G8
    site: ubb-platform/apps/platform/events/schemas.py::UsageInvoicePushFailedPermanent
    expected: usage_invoice.push_failed_permanent
    found: usage.invoice_push_failed_permanent
    owner_slice: slice_8
    reason: >-
      The permanent-failure half of the same push, and the same misplaced
      subject. It moves with the event above.

# Every act of seeding, kept as history. The ratchet permits additions for a
# gate only when an authorisation naming it is NEW in this pull request — so an
# old authorisation cannot license a later addition, and the list stays an audit
# trail rather than standing permission. The count must be exactly how many
# entries arrived: a reviewer approves a quantity, not an intention.
seeding_authorisations:
  - gate: G9
    issue: 203
    entries_added: 3
    reason: >-
      This pull request installs `db_table == canonical(model_name)` over every
      first-party managed concrete model, and records the three tables that
      violate it today. The fourth mismatch, `ConnectOAuthState`, is a reasoned
      permanent exception rather than a debt and lives in
      gates/permanent-exceptions.yaml.

  - gate: G11
    issue: 203
    entries_added: 2
    reason: >-
      This pull request installs the rule that the money suffix names money and
      nothing else, and records the two columns where `_micros` currently means
      millionths of a percent.

  - gate: G12
    issue: 203
    entries_added: 1
    reason: >-
      This pull request installs the method/mode/structure naming rule over the
      declaring models, and records the one field standing a single character
      from a sanctioned name with an unrelated meaning.

  - gate: G17
    issue: 204
    entries_added: 3
    reason: >-
      This pull request installs the rule that every hand-written SDK call
      targets a published operation, matched on method AND normalised path, and
      records the three calls to routes that exist in no spec and no router.
      G18's unwrapped operations are deliberately NOT recorded here: ADR-0007 §4
      states that count need not reach zero, and a debt nobody owes would make
      "the ledger is at zero" unreachable by construction — the same reason the
      permanent exceptions are a separate file.

  - gate: G8
    issue: 205
    entries_added: 20
    reason: >-
      This pull request installs ADR-0006 §5's shape over the event catalogue —
      one domain owner, one state entered, cause and mechanism in payload fields
      — and records the twenty of thirty-five events that predate the
      convention. It renames none of them: an event name is a public contract,
      so each rename belongs to the slice that rebuilds the event's subject and
      can carry the spec, the SDK and the console with it. Every `expected`
      names an end-state value the registry declares, and the gate checks that
      it does. G13, installed in the same pull request, seeds nothing — no
      module in the tree binds the bare name `tasks` — which is why it carries
      no authorisation here.
