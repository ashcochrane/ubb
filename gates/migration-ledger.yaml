  # --- G4: the published contract advertises only what the backend serves ---
  #
  # #208 installs the known-value metadata: the spec begins telling API
  # consumers which values UBB knows about, generated from the registry
  # according to each concept's KIND — an `open` concept's recognised values
  # as `x-ubb-known-values` documentation metadata beside an untouched
  # `type: string`, a `closed` one's as a real `enum`, and nothing at all for a
  # concept whose values the tenant owns. ADR-0003's open-enum stance is not
  # reversed, and the gate proves no open concept was quietly closed.
  #
  # THESE TWENTY-NINE ARE THE RULE THAT KEEPS IT HONEST: the spec advertises a
  # value only where the backend already SERVES it, asked through #227's census
  # predicate rather than a second copy of it. Nothing in the tree serves any
  # concept yet — #227 recorded that from the consumers' side as fifty-four
  # entries — so the contract carries no metadata today and every concept the
  # registry says appears in it is owed here instead. Emitting the final values
  # on a field that still returns the retired one would put a falsehood into a
  # PUBLISHED document, which is worse than saying nothing because a consumer
  # can act on it.
  #
  # So this is a large seeding that changes `openapi/v1.json` by zero bytes,
  # and both halves of that are the intended outcome rather than a shortfall.
  #
  # `found` is the extent the generated document records, checked in BOTH
  # directions against it — too low and the consumer regressed, too high and
  # the entry is an excuse the ratchet could never see, since it compares entry
  # identities rather than their contents. Two entries are already part-paid
  # from #200: `customer_billing_mode` at 2 of 3 and `reason_code` at 1 of 5.
  #
  # THE OWNER IS THE SLICE THAT REBUILDS THE CONCEPT'S SUBJECT, and it is the
  # same owner #227 gave the same concept — one concept, one removal slice,
  # whether the debt is a Django model restating it or the contract staying
  # silent about it. Paying a G4 entry is therefore the second half of paying
  # that slice's G2 or G3 entry: convert the consumer, then mark the schema
  # field, and the export refuses the marker if they are done the other way
  # round.
  #
  # Two entries have no positive owner, and both are inherited rather than
  # chosen: `audit_action`, whose fifty-eight actions name subjects across
  # every slice, and `customer_billing_mode`, whose siblings gate on
  # payment-rail activation. They are recorded against the cutover for want of
  # an owner — #206's `meter_only` and #227's `audit_action` in a third place
  # — and any slice may take them earlier.

