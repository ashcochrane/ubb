# The migration ledger — every current violation of an INSTALLED gate, as an
# individually identified entry that a named slice owes (#201, #158 §11.3).
#
# It is a finite migration plan, not permission for the old architecture to
# survive. It only ever shrinks, it reaches zero at slice 8 before platform
# admission, and every entry names the slice that removes it — which is #155
# §17's recorded residue closed: an entry cannot survive to slice 8 because
# everyone assumed somebody else owned it.
#
# Three mechanical rules, all enforced (gates/README.md has the reasoning):
#
#   1. It only shrinks. CI compares this file against the base branch's and
#      fails on any added entry, unless a `seeding_authorisation` below names
#      the gate — the explicit, reviewed override. An entry's owner slice may
#      move earlier but never later, because deferring a debt quietly is the
#      same failure as adding one.
#   2. Every entry names a real gate and a real slice. The gate must be
#      `installed` in gates/manifest.yaml: an entry against a gate that cannot
#      fail anything is a note, not a debt, and nothing would ever prove it
#      right or wrong.
#   3. An entry whose owner slice has already landed fails CI.
#
# ---------------------------------------------------------------------------
#
# THE FIRST SEEDING: the four model-naming gates (#203).
#
# G9, G10, G11 and G12 were installed in the pull request that added these
# entries, over a tree that violates three of them. That ordering is the point
# rather than an embarrassment: a gate installed before the code complies is
# what makes the vocabulary impossible to regress (#155 §3.1). G10 seeds
# nothing — no writable `tenant_posture` column exists — so it carries no
# authorisation below, because an override that overrides nothing is the shape
# of a check that cannot fail.
#
# Every entry's `site` is exactly the string the gate itself prints, and
# `ubb-platform/apps/platform/tests/test_model_naming.py::
# test_every_seeded_entry_is_still_a_real_violation` fails if a seeded site
# stops being a violation. So an entry cannot outlive the debt it records:
# paying it and deleting it are one act.

version: 1

entries:
  # --- G9: `db_table == canonical(model_name)` ------------------------------
  #
  # The pricing inversion — two models, each sitting on the other's table.
  # #154 §6.2 recorded that it would resolve BY CONSTRUCTION rather than by a
  # rename: #138 splits the rule entity into supplier cost and pricing rules,
  # #148 replaces the container with the Pricing Book, and both tables are
  # rebuilt regardless — so renaming them earlier would be work with no product
  # (#155 §3.1).
  #
  # ⚠ **BOTH HALVES ARE NOW PAID, AND THE PREDICTION WAS RIGHT ABOUT ONE AND
  # WRONG ABOUT THE OTHER.** The rule side resolved BY A RENAME after all
  # (#367): nothing rebuilt `Rate`, and the kind column it was supposed to be
  # waiting on was DELETED rather than split, so there was no rebuild left to
  # inherit a correct name from — a hand-written `AlterModelTable` carried the
  # rows to `ubb_rate`. The container side resolved as predicted (#368): it was
  # not renamed onto the name it had lent out, it SPLIT into a Pricing Book on
  # `ubb_pricing_book` and a cost book on `ubb_cost_book`, and each took the
  # name its own entity asks for. Both entries went with their debts, in the
  # commits that discharged them. **This gate now owes nothing in the pricing
  # app.**
  #
  # No domain slice touches `CustomerSubscriptionItem` — #194's slice table
  # never names subscriptions — so nothing earlier than the cutover removes this
  # debt, and recording it against a slice that does not do the work would be
  # #155 §17's failure with a nicer label. Slice 8's migration squash (#155
  # §11.1) is what clears it: the fresh initial set creates the table under the
  # correct name, and §11.3 already requires every seeded allowlist to be at
  # zero by then.
  #
  # #154 §6.3 demanded this be a GENUINE rename, preserving rows, keys and
  # constraints rather than a drop-and-recreate. #155 §5.5 dissolves that
  # requirement out loud: under a squash there is no prior table to rename. The
  # debt survives the dissolved requirement — the wrong name is still on the
  # tree today — which is why it is recorded here rather than treated as
  # already handled.
  #
  # An owner slice may move EARLIER but never later, so any slice that touches
  # subscriptions before the cutover may take this and pull the rename forward.
  - id: g9-customer-subscription-item-table-abbreviated
    gate: G9
    site: ubb-platform/apps/subscriptions/models.py::CustomerSubscriptionItem
    expected: ubb_customer_subscription_item
    found: ubb_customer_sub_item
    owner_slice: slice_8
    reason: >-
      `sub` is a short form beside a long form, which ADR-0006 §2 refuses. No
      domain slice touches this model; slice 8's squash creates the table under
      the correct name (#155 §11.1, and §5.5 for why no rename migration is
      owed).

  # --- G11: `_micros` means millionths of a currency unit ------------------
  #
  # The suffix means money on every column that carries it, and it once meant
  # millionths of a PERCENT on two — one on the tenant-level markup record, one
  # on the kernel's Plan. #147 §9.2 records what that ambiguity had already
  # cost: the `le=1_000_000_000` bound existed specifically because such a value
  # "is far more likely a unit error (percent passed as micros) than a real
  # commercial term". `expected` was ADR-0006 §1's honest spelling — same scale,
  # right unit — and it was taken on a NEW column rather than on either of
  # these.
  #
  # Both were owned by slice 4, which per #194's slice table deletes them
  # outright. Deletion clears the debt as surely as a rename would, and #369 is
  # the commit that did it.
  # ⚠ G11 OWES NOTHING, AND BOTH ITS ENTRIES WERE PAID BY DELETION RATHER THAN
  # BY THE RENAME THEIR `expected` COLUMN NAMED (#369). Two columns held
  # millionths of a PERCENT under the money suffix — one on the tenant-level
  # markup record, one on the kernel's Plan — and each entry's own reason said
  # the payment was the column going. A ticket reading only the `expected` value
  # would have renamed a column it was about to drop, and the honest spelling
  # would then sit on a column with no reader left. It was taken instead on
  # `TenantDefaultMarkup.markup_micro_percent`, a NEW column where it cost
  # nothing (#357). Each entry was deleted here and from
  # `test_model_naming.py`'s own copy in the commit that discharged it.

  # --- G12: method, mode and structure describe different things ------------
  #
  # G12 OWES NOTHING. Its one entry was the rate's arithmetic-shape column,
  # which sat one character from `pricing_mode` — a declared concept about
  # which pricing regime governs a Task, not about how a rate computes. #151
  # §13.2 ratified `rate_structure` precisely because a name "may not survive
  # one character from `pricing_mode`", and #366 took it: the column, its two
  # values and the three schemas publishing it, in one commit.
  #
  # The entry is DELETED rather than marked paid, which is this ledger's rule in
  # both directions — an excuse that no longer describes a real violation
  # overstates the debt exactly as an understated `found:` count does.
  # `apps/platform/tests/test_model_naming.py` holds the empty set beside its
  # G9 and G11 siblings so the absence is a declaration rather than a silence.

  # --- G17: every hand-written SDK call targets a real operation -------------
  #
  # THE SECOND SEEDING (#204). The three calls #155 §1.3 found: routes that
  # existed in no spec and in no router, green in CI for months because the
  # tests that covered them patched the HTTP client, so the mock reproduced the
  # mistake instead of contradicting it. `gates/README.md` lists that as one of
  # the three times this repository has shipped a check that could not fail.
  #
  # ⚠ G17 OWES NOTHING. ALL THREE ENTRIES WERE PAID IN ONE COMMIT (#373), AND
  # ONE COMMIT IS THE ONLY WAY THEY COULD BE PAID. `tools/sdk_operations`
  # generates each dead route's `UNPUBLISHED_` constant FROM the entry that
  # excuses it, so deleting an entry deletes the constant and the method that
  # named it stops resolving in the same second. Paying one of three would have
  # left the other two calling constants nothing rendered — a red board, not a
  # partial payment. The seeding authorisation below is untouched: it records
  # that three entries were once added, which stays true.
  #
  # `expected` was the END STATE rather than a canonical name, and that was the
  # load-bearing part. There was no correct route to point at — the operations
  # these methods wanted were never published — so the debt could only be
  # discharged by the call going away, and a ticket reading the column for a
  # name to rename onto would have found none. `found` was `METHOD` plus the
  # path with each parameter collapsed to `{}`, the identity the gate matches on
  # (ADR-0007 §4: method AND path, because `GET /x/{id}` is not
  # `POST /x/{id}`).
  #
  # What went with them: three methods on the metering client, the private
  # helper that parsed their rows, the hand-written result type that helper
  # filled, their three test cases, and the documentation that named the dead
  # routes. #155 §8.1 puts the SDK's next breaking release after slice 8 as one
  # coordinated event and that is where this break is taken; nothing has ever
  # answered these calls, so no caller loses a working one.
  #
  # `tests/contracts/test_sdk_operations.py` holds the emptiness as a
  # declaration rather than a silence — `test_the_gate_owes_nothing_and_the_
  # family_is_declared_empty`, which replaced the ownership check at its own
  # address rather than being relaxed into passing over an empty set.

  # --- G8: a webhook event is named for the state entered -------------------
  #
  # THE THIRD SEEDING (#205), and the largest: twenty of the catalogue's
  # thirty-five events. That is not decay, it is the absence of a convention —
  # ADR-0006 §5 fixed one on 2026-08-03 and the catalogue predates it. Some
  # namespaces are resources, some are products (`billing` owns the wallet's
  # levels, the grant's lifecycle and the customer's suspension), some are
  # mechanisms (`stop`, `soft_floor`), one is a retired spend-control family
  # (`budget`) and one is a measure (`margin`). Two spellings of one concept
  # coexist across this catalogue and the audit registry: `auto_topup` here,
  # `auto_top_up` there.
  #
  # **#205 installs the gate and renames nothing.** A rename is a public
  # contract change — the event name is what a subscriber subscribes to — so it
  # belongs to the slice that rebuilds the event's subject and can carry the
  # spec, the SDK and the console with it in one vertical. Renaming twenty
  # events in a gate-installation ticket would be the largest surface break of
  # the programme performed by the ticket least able to test it.
  #
  # Conventions, both following from the subject:
  #
  # - `site` is the declaring payload class, because `events/catalog.py` DERIVES
  #   its tuple from those classes — the class is where the name actually lives.
  #   `found` is the published name, and the excuse is keyed on BOTH (#204's
  #   rule): an entry keyed on the class alone would stay green if that class
  #   kept its debt and changed which wrong name it published.
  # - `expected` is the end-state name from
  #   domain-vocabulary/concepts/webhooks.yaml, and the gate checks that it IS
  #   one. Two entries name two events, joined by `and`: #140 §4.3 splits a
  #   spend kill from a Task nobody ever closed, so one overloaded event becomes
  #   two distinct states and a subscriber classifies by subscribing.
  #
  # Owner slices are #194's slice table, applied as "the slice that owns the
  # event's subject". An owner slice may move earlier but never later, so any
  # slice that touches one of these surfaces first may take it.
  #
  # **Thirteen of the twenty are gone (#222), and seven remain.** The thirteen
  # were the ones whose correction depended on nothing: no payload, emitter or
  # state model changed, so the namespace was simply wrong and correcting it was
  # a string change plus the surfaces carrying the string. Seven of those had
  # been recorded against slice 8 on the reasoning "no slice rebuilds this
  # subject" — an owner that could pay them but whose ticket says "three resets,
  # the assertions, the end-to-end proof" and nothing about renaming seven public
  # events. That is rule 3's failure one level up: the entry had an owner, but the
  # owner's ticket did not know. #222 removed the condition rather than
  # documenting it, in one act rather than four, because ADR-0006's Consequences
  # say the v1 contract breaks deliberately ONCE and map #137 constraint 1 — no
  # live integrators — is the freedom that makes a clean break available.
  #
  # The seven below each have a real dependency, so none of them is a rename:
  # slice 5 SPLITS the two Task events into `killed` and `expired` (#140 §4.3),
  # and slice 6 rewrites the five control emitters under #150's four families.
  # Renaming either first would encode a target state nobody has agreed, or edit
  # the same code twice.

  # Slice 5 (Work) — the Task's terminal states are its subject.
  - id: g8-task-limit-exceeded-names-a-bound-not-a-state
    gate: G8
    site: ubb-platform/apps/platform/events/schemas.py::TaskLimitExceeded
    expected: task.killed and task.expired
    found: task.limit_exceeded
    owner_slice: slice_5
    reason: >-
      Named for a bound rather than for the state entered, and `limit_exceeded`
      is no `task_status` value — so the event announces a state a Task cannot
      be in. It becomes TWO events: a subscriber alerting on spend incidents
      must stop being paged when a worker dies, and "how often did work stop on
      a ceiling?" must be answerable without parsing a reason string
      (#140 §4.3). Slice 5 lands the six lifecycle states.

  - id: g8-subtask-limit-exceeded-names-a-bound-not-a-state
    gate: G8
    site: ubb-platform/apps/platform/events/schemas.py::SubtaskLimitExceeded
    expected: subtask.killed and subtask.expired
    found: subtask.limit_exceeded
    owner_slice: slice_5
    reason: >-
      The same defect on contained work. One model and one status set means one
      rule, so the Subtask's terminal events split exactly as the Task's do
      (#154 §3.1). Slice 5 lands both.

  # Slice 6 (Spend control) — the four families. The wallet's own three levels
  # were here too until #222 renamed them; what is left is the control events
  # slice 6 rewrites rather than renames.
  - id: g8-stop-fired-is-a-mechanism-namespace
    gate: G8
    site: ubb-platform/apps/platform/events/schemas.py::StopFired
    expected: customer.stopped
    found: stop.fired
    owner_slice: slice_6
    reason: >-
      `stop` is the mechanism, not a domain owner. A customer-wide stop is a
      state the CUSTOMER entered; which control fired travels as
      `control_family` and why as `reason_code`, which is exactly what
      ADR-0006 §5 moves out of the name. Slice 6 lands the four families.

  - id: g8-stop-cleared-is-a-mechanism-namespace
    gate: G8
    site: ubb-platform/apps/platform/events/schemas.py::StopCleared
    expected: customer.stop_cleared
    found: stop.cleared
    owner_slice: slice_6
    reason: >-
      The other half of the episode pair, under the same mechanism namespace.
      It moves with the event it closes, or the two stop pairing (#155 §3.1).

  - id: g8-soft-floor-crossed-is-a-mechanism-namespace
    gate: G8
    site: ubb-platform/apps/platform/events/schemas.py::SoftFloorCrossed
    expected: wallet_policy.soft_floor_crossed
    found: soft_floor.crossed
    owner_slice: slice_6
    reason: >-
      The soft floor is a wallet policy setting, and the policy is the declared
      control family that owns the namespace. One public concept, one public
      name, on the webhook and in `control_family` alike (ADR-0006 §2).

  - id: g8-soft-floor-cleared-is-a-mechanism-namespace
    gate: G8
    site: ubb-platform/apps/platform/events/schemas.py::SoftFloorCleared
    expected: wallet_policy.soft_floor_cleared
    found: soft_floor.cleared
    owner_slice: slice_6
    reason: >-
      The clear that pairs with the crossing above, and it moves with it.

  - id: g8-budget-threshold-reached-uses-a-retired-family
    gate: G8
    site: ubb-platform/apps/platform/events/schemas.py::BudgetThresholdReached
    expected: customer_spend_pool.threshold_reached
    found: budget.threshold_reached
    owner_slice: slice_6
    reason: >-
      `budget` named all four spend controls at once and left the vocabulary
      entirely (#154 §3.4); it survives here as the namespace of the event the
      pool fires. Slice 6 lands `customer_spend_pool` as the family.

  # --- G7: no retired word on any living surface -----------------------------
  #
  # THE SECOND LARGE SEEDING, and by far the biggest: 159 entries over 50 of the
  # registry's 70 retired terms. That is the sweep doing what #191's disposition
  # table predicted of it — "installed, heavily seeded" — and the number is the
  # whole re-model stated as arithmetic rather than as an intention.
  #
  # An entry's SITE is `<area>::<term>`, and its `found` is the number of files
  # that area currently has the word in. Two decisions are packed into that, and
  # both were arrived at by running the sweep rather than by reasoning about it:
  #
  #   * PER AREA, not per file. One entry per (area, term) is 159 rows; one per
  #     file would be 1,340, and every file move in eight slices of demolition
  #     would be a ledger edit. Per TERM alone would be 50 rows and would let a
  #     word cross from the backend to the SDK unnoticed, which is exactly the
  #     re-entry this gate exists to refuse.
  #   * A FILE COUNT, not a line count. A line count moves whenever anyone edits
  #     a line, so no ratchet could stand on it. The file count moves when a
  #     retired word reaches somewhere it was not — which is the thing worth
  #     refusing while the debt stands. #203's review found the shape this
  #     closes: an excuse keyed on the site alone stays green when the violation
  #     moves.
  #
  # `found` is checked in BOTH directions and must be exactly true. Too low and
  # the word has spread; too high and the entry is an excuse with no upper
  # bound, since the ledger's ratchet compares entry identities rather than
  # their contents and would never notice a `999` typed into one. So paying part
  # of a debt means editing its number, which is the change being recorded
  # rather than an inconvenience — and the ratchet lets a number fall for free.
  #
  # Every owner slice below is taken from what #194's slice issues say they
  # CARRY, not from the concept's neighbourhood. That is why `revenue_mode` is
  # slice 7 and not slice 1 — #189 deletes `Customer.revenue_mode` outright.
  # The rule's other worked example has since been PAID and is kept here as
  # method rather than as a live entry: `request_id`'s five entries were slice
  # 5's, not slice 2's, because slice 5 is where the key that replaced it got
  # its permanent claim (#410) and the deletion was only safe after that; #411
  # then cleared all five in one commit. The webhook events repeat G8's owners
  # exactly, because one event cannot be owed by two slices.
  #
  # ONE ENTRY HAS NO POSITIVE OWNER: `meter_only` is slice 8 by default, and its
  # reason says so. It is #205's residue in a new place — an owner slice that
  # nobody chose — and it is written down rather than smoothed over.

  - id: g7-backend-balance_floor_exceeded
    gate: G7
    site: backend::balance_floor_exceeded
    expected: reason_code
    found: 2 files
    owner_slice: slice_6
    reason: >-
      A refusal reason named for a wallet-policy floor. Slice 6 rebuilds
      wallet policy and the reason takes the family's vocabulary.

  - id: g7-backend-budget
    gate: G7
    site: backend::budget
    expected: control_family
    found: 36 files
    owner_slice: slice_6
    reason: >-
      A retired spend-control family name. #150's four families —
      Ceiling, Customer Spend Pool, Wallet policy, Admission control —
      replace one word that named all of them at once, and slice 6
      builds them.

  - id: g7-backend-budget.set
    gate: G7
    site: backend::budget.set
    expected: audit_action
    found: 2 files
    owner_slice: slice_6
    reason: >-
      The audit action for configuring the retired family. It is renamed
      with the family, in the slice that replaces it.

  - id: g7-backend-budget.threshold_reached
    gate: G7
    site: backend::budget.threshold_reached
    expected: webhook_event_type
    found: 6 files
    owner_slice: slice_6
    reason: >-
      An event owned by the retired family name.
      `customer_spend_pool.threshold_reached` replaces it when slice 6
      builds the Customer Spend Pool. Same owner as G8's entry.

  - id: g7-backend-budget_exceeded
    gate: G7
    site: backend::budget_exceeded
    expected: affordability_reason
    found: 10 files
    owner_slice: slice_6
    reason: >-
      An affordability verdict named after the retired family. Slice 6's
      four families give the refusal its own noun.

  - id: g7-backend-budget_unavailable
    gate: G7
    site: backend::budget_unavailable
    expected: affordability_reason
    found: 2 files
    owner_slice: slice_6
    reason: >-
      The same, for the case where the family's state could not be read.

  # ⚠ `backend::card_type` REACHED ZERO IN #374 AND ITS ENTRY IS DELETED. The
  # descent was 31 -> 28 (#367, the column off the RULE) -> 4 (#368, the split
  # itself) -> 0. ⚠ **#368's own reason line was never written and the entry
  # stood at "the remainder is owed on the container" while the container had
  # already gone** — the same defect #373 found on `sdk::pricing_model`, which
  # is why the standing instruction is to measure the descent with `git log -S`
  # rather than read the prose.
  #
  # NONE OF THE LAST FOUR FILES WAS CODE, WHICH IS WHY A DOCUMENTATION TICKET
  # PAID THEM.
  #
  #   * `pricing/services/pricing_service.py` — two sentences in its own
  #     docstrings, describing the parameter the split deleted. They say "the
  #     kind word" now, the phrase the rest of the tree already used.
  #   * `api/v1/tests/test_book_api.py` and
  #     `pricing/tests/test_a_book_of_costs_and_a_book_of_prices_are_two_shapes
  #     .py` — `not in` assertions whose whole subject is the column's absence.
  #     Both DERIVE the name from the `RemoveField` that deleted it, through
  #     `pricing/tests/_helpers.py:RETIRED_KIND_COLUMN`. That is technique 1 of
  #     the three now written into `docs/conventions/coding-standards.md`, and
  #     technique 2 was NOT available: putting the word once in that helper
  #     would have left a count of one where the entry needs none.
  #   * `ubb-platform/docs/CHANGELOG-pricing-api.md` — the 2026-07-03 entry,
  #     carried forward under that file's own header rule.

  - id: g7-backend-concurrency_limit
    gate: G7
    site: backend::concurrency_limit
    expected: affordability_reason
    found: 3 files
    owner_slice: slice_6
    reason: >-
      An affordability verdict for a control slice 6 DELETES outright —
      `max_concurrent_requests` goes with admission control's rebuild.

  - id: g7-backend-cost_limit_exceeded
    gate: G7
    site: backend::cost_limit_exceeded
    expected: reason_code
    found: 2 files
    owner_slice: slice_6
    reason: >-
      A refusal reason spelling the retired field word. Slice 6's
      ceiling family is what it becomes.

  - id: g7-backend-customer_wide_stop
    gate: G7
    site: backend::customer_wide_stop
    expected: reason_code
    found: 18 files
    owner_slice: slice_6
    reason: >-
      A refusal reason naming a mechanism rather than the customer whose
      spend was stopped. Slice 6 rebuilds the four families it spans.

  - id: g7-backend-dimensions
    gate: G7
    site: backend::dimensions
    expected: analytics_grouping_kind
    found: 16 files
    owner_slice: slice_7
    reason: >-
      The plural named an analytics grouping capability, not a value.
      Slice 7's one economic query replaces it with `field:`/`rollup:`
      grouping and its discovery contract.
      Ten of the original thirty were the kernel app's own modules and the
      import lines naming them, and #259 renamed that app. The OWNER does not
      move — slice 7 still owes what is left — but ten files stopped violating
      in slice 2, and a recorded extent that overstates is an excuse with no
      upper bound. So the number comes down now, in the commit that cleared
      them, rather than waiting for the slice that owes the rest.
      Two more went the same way in #278, which renamed the registry route
      family: both were comments in tests naming the old path, and the path
      was the plural's last use in either file.
      Two more in #283, and they are the last of the glossaries: the kernel
      and metering `CONTEXT.md` files each used the plural once, in prose
      about what the registry is, and both now name the declared field or
      the real published `required_dimensions` instead.
      WHERE THE BOUNDARY WITH THE SINGULAR RUNS, settled in #312 and recorded
      here because the singular's own entry was deleted in the commit that
      settled it — an entry cannot outlive its debt, so a ruling kept only in
      the entry it retired would be a ruling nobody could find. Two analytics
      rollups return `list[dict]` and write a row's grouped value into an
      undeclared key: `/analytics/usage`'s breakdowns and its timeseries
      sibling. `metering_endpoints.py`'s comment on the neighbouring open-bag
      block claims this whole surface for slice 7, and that comment is right
      about the block it is attached to and does not reach these two. The
      registry decides it: this term is retired to `analytics_grouping_kind`,
      an AXIS, while the singular is retired to `grouping_field_value`, a
      VALUE — and a row key holds a value. The declared third rollup had
      already published it as `grouping_field_value` with a comment saying
      exactly that, so slice 2 made the two open ones agree rather than
      inventing a word. WHAT REMAINS THIS ENTRY'S is unchanged and is the
      axis half: the request parameter, the `by_tag` block, and the discovery
      contract that replaces them.

  # ⚠ THE TWO MARKUP AUDIT ACTIONS REACHED ZERO ON EVERY SURFACE AND ALL FIVE
  # OF THEIR ENTRIES ARE DELETED (#369) — backend (3 files and 2 files), console
  # (2 files and 1 file) and sdk (1 file). The record whose acts they named is
  # deleted with its five routes and its two component schemas, and the names
  # left the registry in the same commit, which `record()`'s refusal of an
  # unregistered name makes compulsory rather than merely tidy. The sdk file was
  # a GENERATED module carrying a route docstring that named one of the actions
  # in passing; editing that docstring cleared it, which is the shape #349
  # recorded — a retired term can be paid by a commit whose subject is elsewhere.

  - id: g7-backend-meter_only
    gate: G7
    site: backend::meter_only
    expected: customer_billing_mode
    found: 16 files
