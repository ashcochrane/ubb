# Every act of seeding, kept as history. The ratchet permits additions for a
# gate only when an authorisation naming it is NEW in this pull request — so an
# old authorisation cannot license a later addition, and the list stays an audit
# trail rather than standing permission. The count must be exactly how many
# entries arrived: a reviewer approves a quantity, not an intention.

  # ---------------------------------------------------------------------------
  #
  # THE CONSUMER GATES: what every surface still restates (#227).
  #
  # G2 and G3 ask one question of every consumer the registry declares — does
  # it hold the concept's values BY REFERENCE to the generated artifact, or
  # keep its own copy? `domain-vocabulary/consumers.yaml` already promised these
  # entries: a declared consumer is an END-STATE consumer, and *"every
  # disagreement that survives is a migration-ledger entry naming the slice that
  # removes it"*. This is that sentence paid.
  #
  # Fifty-four entries, and the number is the whole re-model stated from the
  # consumers' side: 47 closed concepts (G2) and 7 open ones (G3), across the
  # backend's 29 declared consumers, the console's 20 and the SDK's 5. Only two
  # sites hold anything at all today, both from #200 — and both appear below
  # with what they have already paid.
  #
  # `site` is `<consumer path>::<concept>` and `found` is `<held> of <total>
  # values`. Per (file, concept) rather than per value, for the reason #206
  # chose (area, term): an entry per value would be 338 rows that churn whenever
  # a value moves, and an entry per file would let one concept's debt hide
  # behind a neighbour's. The value count rides the entry as its EXTENT and is
  # checked in BOTH directions, so paying part of a debt means editing a number
  # rather than nothing at all — the ratchet compares entry identities, not
  # their contents, and would never see a `9 of 9` typed into one.
  #
  # THE OWNER IS THE SLICE THAT REBUILDS THE CONCEPT'S SUBJECT, never the slice
  # that owns the file. `task_status` is slice 5's whether the consumer
  # restating it is a Django model, the console or the SDK — which is #205's
  # rule for event names, applied to consumers. Two consequences worth seeing
  # rather than discovering:
  #
  #   - THE CONSOLE'S TWENTY ARE NOT SLICE 0'S. #210 says so itself: *"Slice 0
  #     is complete when the mechanism is active and regressions are impossible
  #     — not when all fifty-two importing files have been rewritten"*, and
  #     asks for exactly this — an individually identified entry per map, with
  #     an owner and a removal slice.
  #   - `audit_action` HAS NO POSITIVE OWNER. Its fifty-eight actions name
  #     subjects across every slice, so no one slice rebuilds the catalogue. It
  #     is recorded against the cutover for want of an owner, which is #206's
  #     `meter_only` in a new place and wants an owner's eye. Any slice may take
  #     it earlier; none may take it later.
  #

