  - gate: G7
    issue: 210
    entries_added: 2
    reason: >-
      Not a seeding — a SPREAD, recorded as one. #210's importer ratchet pins
      the fifty-one console files that import the legacy label adapter, and two
      of them are named after retired concepts, so pinning the path spells the
      word on a surface that did not carry it. There is no version of that list
      that avoids this: the alternative was pinning a count, which would let one
      file be converted while another was added and read as "nothing happened".
      So the reach is written down rather than the check weakened, and both are
      paid by the act that pays their console siblings — rename the file, and
      the pinned path follows it. This is the first authorisation in this file
      that licenses a gate's ledger to grow for a reason other than the gate
      being installed, which is why it says so plainly.

  - gate: G6
    issue: 210
    entries_added: 42
    reason: >-
      This pull request installs the label-coverage gate — every required
      registry value has wording in every shipped locale, every wording names a
      live registry value, no retired token keeps one — and records what the
      console still does instead. Coverage itself seeds NOTHING: all 188
      required keys are authored in the same change, so that half of G6 is at
      zero on the day it is installed. The forty-two entries are the other
      half: thirty hand-written value maps, one hand-written renderer and
      eleven files importing the humaniser ADR-0008 §4.3 retires.
      It converts none of them. A map's wording moves when its vocabulary is
      rebuilt, which is why every entry naming a registry concept inherits that
      concept's existing owner slice rather than choosing a new one — the value
      list and the words for it are owed to one slice, not two. Converting one
      early would pay a later slice's G2 debt from here and leave that slice's
      entry unreachable.
      The two Stripe-vocabulary maps are NOT here. They are permanent
      exceptions in gates/permanent-exceptions.yaml: UBB owns neither those
      values nor their wording, map #137 constraint 5 forbids the registry
      enumerating a vendor's catalogue, so no label key will ever exist to move
      them to and no slice owes the work.
      The ledger IS the allowlist this gate enforces. There is no second list
      of permitted sites anywhere: one more map or one more humanising
      import is an addition the ratchet refuses without its own authorisation,
      which is what makes "reachable from allowlisted sites and nowhere else"
      mechanical rather than a review habit.

  - gate: G2
    issue: 258
    entries_added: 3
    reason: >-
      Neither a seeding nor a spread — a MOVE, recorded as one, and the second
      authorisation in this file to license growth for a reason other than a
      gate being installed. The Event Type catalogue's kernel app landed, and
      the concepts that declared the event-*delivery* app's models as their
      end-state backend consumer now declare its. The three debts are the same
      three debts: same gate, same owner slice, same extent, nothing taken on
      and nothing paid off. What moved is the place.
      The ratchet sees three arrivals anyway, and that is the mechanism working
      rather than misfiring — an entry's identity is deliberately the gate and
      the place so that moving one cannot hide behind a stable id. So the count
      goes past a reviewer, which is the whole design.
      Their stated reason moved with them, because at the new path the old one
      was false. All three said the consumer "holds its value sets as its own
      `choices=` lists"; this app declares no model yet, and the app the
      registry used to name holds exactly one such list and no Event Type at
      all. The `found: 0 of N values` half was always accurate — nothing is
      held either way — but a reader was being told the wrong thing about why.
      Splitting this from the app's arrival is not available: the registry
      compiler refuses a declared consumer path that does not exist, and the
      stale-entry check at the old path and the unowed-consumer check at the
      new one fail in opposite directions unless all of it lands together.
