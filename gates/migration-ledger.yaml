  # --- G6: the console's hand-written value maps (#210) ---------------------
  #
  # Thirty of the thirty-two maps in the legacy adapter. Each one keys English
  # off a raw token and falls back to `humanize`, which is what ADR-0008 §4.3
  # retires. `expected` names the registry concept whose generated label keys
  # replace the map; where the registry declares no concept for the value set,
  # it names `label_key` — the thing that must exist there — rather than a
  # concept name nobody has decided, which would be provisional vocabulary
  # recorded as fact.
  #
  # OWNERS ARE INHERITED, NOT CHOSEN. Where the concept exists, the owner is
  # the slice its G2/G3 entry already names, so the map and its value list are
  # owed to one slice rather than two. Where it does not, the owner is the
  # cutover: #210 says outright that the remainder reaches zero there, and the
  # ratchet permits pulling an entry earlier but never later — so the cutover
  # is the only default that cannot quietly defer a debt.

  - id: g6-map-actor-kind-label
    gate: G6
    site: apps/ui/src/lib/labels.ts::actorKindLabel
    expected: label_key
    owner_slice: slice_8
    reason: >-
      `actorKindLabel` hand-writes the wording for who performed an audited
      action, and falls back to `humanize`. The registry declares no concept
      for this value set, so there is no label key to move it to yet and no
      domain slice's subject contains it. Owned by the cutover, where the
      ledger reaches zero; pulling it earlier is the ratchet's one free move.

