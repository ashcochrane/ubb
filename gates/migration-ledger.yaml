seeding_authorisations:
  - gate: G9
    issue: 203
    entries_added: 3
    reason: >-
      This pull request installs `db_table == canonical(model_name)` over every
      first-party managed concrete model, and records the three tables that
      violate it today. The fourth mismatch, `ConnectOAuthState`, is a reasoned
      permanent exception rather than a debt and lives in
      gates/permanent-exceptions.yaml.

  - gate: G11
    issue: 203
    entries_added: 2
    reason: >-
      This pull request installs the rule that the money suffix names money and
      nothing else, and records the two columns where `_micros` currently means
      millionths of a percent.

  - gate: G12
    issue: 203
    entries_added: 1
    reason: >-
      This pull request installs the method/mode/structure naming rule over the
      declaring models, and records the one field standing a single character
      from a sanctioned name with an unrelated meaning.

  - gate: G17
    issue: 204
    entries_added: 3
    reason: >-
      This pull request installs the rule that every hand-written SDK call
      targets a published operation, matched on method AND normalised path, and
      records the three calls to routes that exist in no spec and no router.
      G18's unwrapped operations are deliberately NOT recorded here: ADR-0007 §4
      states that count need not reach zero, and a debt nobody owes would make
      "the ledger is at zero" unreachable by construction — the same reason the
      permanent exceptions are a separate file.

  - gate: G8
    issue: 205
    entries_added: 20
    reason: >-
      This pull request installs ADR-0006 §5's shape over the event catalogue —
      one domain owner, one state entered, cause and mechanism in payload fields
      — and records the twenty of thirty-five events that predate the
      convention. It renames none of them: an event name is a public contract,
      so each rename belongs to the slice that rebuilds the event's subject and
      can carry the spec, the SDK and the console with it. Every `expected`
      names an end-state value the registry declares, and the gate checks that
      it does. G13, installed in the same pull request, seeds nothing — no
      module in the tree binds the bare name `tasks` — which is why it carries
      no authorisation here.

  - gate: G7
    issue: 206
    entries_added: 159
    reason: >-
      This pull request installs the forbidden-term sweep over every tracked
      file — first-party code, the committed contract, the SDK, the console and
      the living docs — with declared, counted and totally-accounted exclusions,
      and records what it finds today: 50 of the registry's 70 retired terms,
      across 159 (area, term) sites. It renames nothing. The sweep goes green
      not by weakening the rule but by the ledger emptying over the following
      eight slices, which is the shape #206 asked for.
      Three words moved OUT of the sweep's input in the same change rather than
      into this list — `flat`, `hold` and `estimate` are now `retired_senses`,
      because each is retired in one sense while live in another and #202's own
      note says a word in that position would force exclusions broad enough to
      disarm the gate. They are not debts, so they are not here.

  - gate: G2
    issue: 227
    entries_added: 47
    reason: >-
      This pull request installs the closed-concept half of the consumer
      census — every value of a `closed` concept is held by reference by every
      consumer the registry declares, on all three generated surfaces — and
      records the 47 sites that restate one today. It converts none of them:
      a consumer's values move when its subject is rebuilt, so each entry names
      that slice. The count is 47 of the 54 (concept, surface) pairs the
      registry declares on a generated surface; the other 7 are G3's.

  - gate: G3
    issue: 227
    entries_added: 7
    reason: >-
      The open-concept half, installed in the same change and asymmetric by
      construction: a registry-known value a consumer does not hold is one of
      these seven entries, while a runtime value the registry has never seen is
      legal and cannot be reported at all — the census's verdicts partition the
      registry's declared values and have nowhere to put an unknown one.
      ADR-0003 is what that protects, and
      `tests/contracts/test_consumer_census.py` proves the silence with a
      control rather than asserting it.

  - gate: G4
    issue: 208
    entries_added: 29
    reason: >-
      This pull request installs the known-value metadata generated from the
      registry, and records the twenty-nine concepts the contract may not
      advertise because their backend consumers do not serve the registry's
      values. It advertises none of them and changes `openapi/v1.json` by zero
      bytes: the metadata for each appears in the slice that renames it, which
      is why the count here is the whole of the registry's contract surface
      rather than a residue. The concepts whose values the tenant owns, and
      those the registry gives no `openapi` consumer, are NOT recorded — they
      contribute nothing to the spec by construction, so no slice owes their
