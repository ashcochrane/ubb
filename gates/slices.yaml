# The build programme's slices (#194), as data.
#
# The gate manifest and the migration ledger both name a slice. This file is
# what makes "a real slice" checkable without a network call: a status of
# `owned_by_slice_4` or a ledger entry owned by `slice_4` resolves here or it
# does not resolve at all.
#
# `order` is the position in #194's dependency chain, NOT the slice's number.
# They differ in one place — #184 is blocked by slice 7 and blocks slice 8 — and
# the chain is what the ledger's "an owner slice may only move earlier" rule
# compares against.
#
# `landed` is DECLARED, because nothing in a checkout can observe that an issue
# closed. Flipping it is part of the landing slice's own work, and it is not a
# formality: the moment a slice is declared landed, every ledger entry owned by
# it fails CI, and every manifest row still claiming that slice owns it fails
# too. That is the mechanism closing #155 §17 — an entry cannot survive to slice
# 8 because everyone assumed somebody else owned it.
#
# Slices 0 and 1 were flipped together, after the fact, rather than by their own
# last ticket: neither slice's ticket chain named the flip, so both closed (#191,
# #192) with it still `false`. Nothing was owed to either — when #256 made those
# two declarations the ledger's earliest owner was `slice_2` and the manifest's
# was `slice_3`, so neither flag had anything to fail on and both were provable
# on the spot. Each of those two owners has since been discharged, and naming
# today's earliest is deliberately left out: it moves every time a slice lands,
# and the reasoning is the part that survives. Later slices should flip their own
# flag in their last ticket, which is what makes the declaration a check rather
# than a formality.
#
# Slice 2 is the first to flip its own flag, in its own last ticket (#285), and
# the declaration did cost something — which is the whole argument for doing it
# here. Flipping it turned five of `test_migration_ledger.py`'s controls red —
# four negative controls plus `test_a_legal_ledger_loads`, which is a positive
# one — and left a SIXTH green and VACUOUS. That suite kept a private copy of
# the "a slice that has not landed" idea, `entry(owner_slice="slice_2")`, and
# `test_an_entry_owned_by_a_landed_slice_is_rejected` mutated slice 2 by name,
# so on the day slice 2 landed that control went on passing with its mutation
# line deleted outright. #256 repaired the same defect in the manifest's half
# when slices 0 and 1 landed, and could not see this one, because slice 2 had
# not landed yet.
#
# Three of the ledger's controls now DERIVE their slice from this file rather
# than naming one, and `entry()`'s default moved to the shared `UNLANDED_SLICE`
# sentinel that `test_gate_manifest.py` already guards by name. A filter over
# `landed: false` cannot name a slice that has landed, so the next flip cannot
# repeat this.
#
# Slice 3's own last ticket (#331) is the next flip, and it turned NOTHING red.
# Nothing was owed: the last of its three ledger entries died in #330 and G19 read
# `installed` from #319, so the flag moved only `unlanded[0]`, from slice 3 to
# slice 4 — the derivation above doing exactly what it was built for, with no
# control re-pointed or re-typed to follow it. But a flip that turns nothing red
# has not thereby proved anything, so that ticket deleted the mutation of all
# twenty-two controls in `test_migration_ledger.py` that assert a refusal or a
# fault. TWENTY-ONE failed without it. ONE PASSED — the unreadable-baseline
# control, not because it was vacuous but because the fault it asserts has a
# SECOND cause its own fixture supplied — and it was repaired, after which
# deleting the mutation reddens it in one edit. A fault with two causes reads
# exactly like a vacuous control until you look, and the two are repaired
# differently. That method now lives in `gates/README.md`, under *Flipping a
# row*, because it belongs to every flip rather than to this one.
#
# Slice 4's flip (#375) is the third a slice makes in its own last ticket, and it
# is free for the same reason slice 3's was: all 56 of its ledger entries had
# already died in the commits that made them false, and no manifest row ever
# named it. `unlanded[0]` moved from slice 4 to slice 5 with no control
# re-pointed. So the twenty-two controls in `tests/contracts/test_migration_ledger.py`
# and `test_gate_manifest.py`'s twin were mutation-checked again — the repaired
# unreadable-baseline control among them, red in a single edit as its repair
# promised — and ALL TWENTY-THREE failed without their cause.
#
# What this flip added to the method is in `gates/README.md` beside the rest: a
# control can go red for a reason THE REMOVAL ITSELF INTRODUCED, and three of
# these did before the removals were corrected. That is as false a claim as a
# green one, and only reading the failure tells them apart.
#
# Slice 5's flip (#427) is the fourth a slice makes in its own last ticket, and
# the first where a manifest row that had named the slice left by RE-OWNERSHIP
# rather than by installation: G14 read `owned_by_slice_5` until #417 landed the
# discriminator column it was waiting on and re-owned the two pins that outlive
# slice 5 to slice 7, whose one economic query is their subject. So nothing was
# owed here either. All 30 of its ledger entries had died in the commits that
# made them false, and `unlanded[0]` moved from slice 5 to slice 6 with no
# control re-pointed.
#
# The census was walked by IDENTITY over `git rev-list`, twenty-one commits of
# which twelve moved the ledger, and it ended at 162 rather than the 164 the
# ticket forecast — or the 163 it allowed for if `g3-backend-trigger_source`
# died in #412 as ruled. It did die there, and it took its contract twin
# `g4-openapi-trigger_source` with it: the contract suite refuses a concept whose
# backend consumer holds every value while no schema node carries the marker, so
# paying the backend entry in full forces the contract entry in the same commit.
# Both were slice 6's, paid early, which the ratchet permits. Nothing was born
# and no owner moved; `g3-backend-reason_code` survives at 2 of 5, slice 6's
# still. The per-gate shape at 162: G2 22, G3 6, G4 14, G6 34, G7 80, G8 5, G9 1.
#
# The flip turned nothing red, so all twenty-three controls were mutation-checked
# again. Wherever the fault was an entry the removal RELABELLED it, as #375
# taught — every real-git control among them — and where it was a missing
# field, a bad type, an uninstalled gate or an unreadable ref the removal took
# out that cause and nothing else. ALL TWENTY-THREE failed without their cause,
# and every failure was read rather than counted: twelve `DID NOT RAISE
# GatesInvalid`, ten an empty fault set against the code they assert, one
# `assert not True` on a comparison holding nothing. None went red for a reason
# the removal introduced — the three real-git controls that did so in #375 each
# failed on `set() == {'ledger_grew'}` this time — and the twin, which mutates
# the `UNLANDED_SLICE` sentinel rather than any slice this flip names, is
# untouched by construction. This flip added nothing to the method; it is the
# first the method survived unchanged.
#
# Slice 6's flip (#471) is the fifth a slice makes in its own last ticket, and
# the first whose forecast was exactly right. Nothing was owed: all 89 of its
# ledger entries had died in the commits that made them false, no manifest row
# ever named it, and `unlanded[0]` moved from slice 6 to slice 7 with no control
# re-pointed.
#
# The census was walked by IDENTITY over `git rev-list`, nineteen commits of
# which thirteen moved the ledger, and it ended at 73 — the ticket's forecast to
# the entry AND to the gate. That is not the norm and it is not an improvement in
# forecasting: #427 was wrong by a twin because that twin was slice 6's, paid
# early inside slice 5's range, and a coupling reaching ACROSS the forecast is
# what makes a forecast wrong. None was available here. §19 counted both halves
# of every coupling as this slice's own — the seven G4 contract entries sit
# inside the 89 beside the backend entries that force them — so every coupling
# that fired, fired within the forecast. Nothing was born, no owner moved, and
# no entry this slice did not own died. The per-gate shape is the baseline less
# slice 6's share at every gate and nowhere else: G2 22→12, G3 6→0, G4 14→7,
# G6 34→28, G7 80→25, G8 5→0, G9 1→1.
#
# The flip turned nothing red, so all twenty-three controls were mutation-checked
# again, and the method needed no addition. Wherever the fault was an ENTRY the
# removal RELABELLED it rather than reverting it, as #375 taught — three of the
# four real-git controls among them. Where it was a missing field, a bad type, an
# uninstalled gate, a shared identifier or an unreadable ref, the removal took out
# that cause and nothing else; the fourth real-git control is the unreadable-ref
# one, whose base was swapped for the ref its own premise has just established as
# resolvable. ALL TWENTY-THREE failed without their cause, and every failure was
# read rather than counted: twelve `DID NOT RAISE GatesInvalid`, ten an empty
# fault set against the code they assert — `{'ledger_grew'}` SIX times, and one
# each of `{'authorisation_count_wrong'}`, `{'authorisation_inert'}`,
# `{'debt_deferred'}` and `{'base_unreadable'}` — and one `assert not True` on a
# comparison holding nothing. None went red for a reason the removal introduced:
# each real-git control failed on an EMPTY set, `{'ledger_grew'}` three times and
# `{'base_unreadable'}` once. No control was vacuous, none had a second cause,
# and none needed repair. The twin mutates the `UNLANDED_SLICE` sentinel,
# which is slice 8 and which this flip does not name, so it is untouched by
# construction for the second flip running.
#
# THE AUTHORING-DIRECTION BREAKS ARE NAMED HERE AND DELIBERATELY NOT FILED.
# `oasdiff --baseline e54259e1` reports 37 breaks, 19 of them already covered and
# EIGHTEEN with no committed entry. All eighteen sit on surfaces that post-date
# `api-v1-launch`, checked against the tag's own document rather than assumed:
# none of `/api/v1/tasks`, `/api/v1/tasks/{task_id}`,
# `/api/v1/tasks/{task_id}/subtasks`, `/api/v1/task-types` or
# `/api/v1/metering/analytics/tasks` is among the 98 paths it published, and the
# four terminal channels are not among its 35 webhooks — it carries the two the
# split replaced. So filing them would be eighteen inert lines, and an inert
# entry turns the cumulative gate red. They are: THIRTEEN from the ceiling
# rename (#453) — the ceiling field off the start's request and its response (2),
# off the unit read and the contained work inside it (2), off the list of work
# and the list of contained work (2), the kind registry's default rung off its
# read and both halves of its write (3), and the pinned ceiling off all four
# terminal payloads (4); FOUR from `control_family`
# arriving as a required property on those same four payloads (#458); and ONE
# from the reached count leaving the task analytics row (#465). The cumulative
# gate — the only gate a green local board says nothing about — was run locally
# with the pinned binary and is green at 101 breaks, 101 reviewed.

