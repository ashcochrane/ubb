# Permanent reasoned exceptions — a DIFFERENT list from the migration ledger,
# on purpose (#201, #191 decision 5).
#
# A deliberate exception with a stated reason is not a debt anybody owes. The
# case this exists for is `ConnectOAuthState → ubb_connect_oauth_state`: OAuth is
# a single acronym token, and mechanical snake-casing yields the worse
# `ubb_connect_o_auth_state`. Nobody is going to rename it, in slice 8 or ever.
#
# Mixing the two lists would make "the ledger is at zero" unachievable by
# construction, and G22 — slice 8's completion gate, before platform admission —
# depends on zero being reachable. So an entry here carries no `owner_slice` and
# no `expected`: there is no rename coming, and the shape of the row says so.
#
# The one thing an exception shares with a ledger entry is rule 2: it must name
# a gate that is INSTALLED. An exception to a gate that cannot fail anything
# suppresses nothing, and would sit here unfalsifiable.
#
# G9 was installed by #203, which is why the entry below could finally be
# written down. It is also still checked: the gate reports `ConnectOAuthState`
# as a mismatch on every run and this file is what excuses it, so if the model
# were ever renamed to something that canonicalises correctly, the exception
# would go stale and the platform suite would say so.

version: 1

exceptions:
  - id: g9-connect-oauth-state-is-one-acronym
    gate: G9
    site: ubb-platform/apps/platform/tenants/models.py::ConnectOAuthState
    reason: >-
      OAuth is a single acronym token. Mechanical snake-casing splits it and
      produces `ubb_connect_o_auth_state`, which is worse than the correct name
      already in place — so the exception is to the mechanism, not to the rule.
      Deliberately not solved by teaching `canonical_table` about acronyms: a
      canonicalisation with a judgement step in it is one nobody can predict,
      and one stated exception is cheaper than a rule that argues back
      (#154 §6.4, ADR-0006 §9).
