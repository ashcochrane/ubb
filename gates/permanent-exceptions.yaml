# Permanent reasoned exceptions — a DIFFERENT list from the migration ledger,
# on purpose (#201, #191 decision 5).
#
# A deliberate exception with a stated reason is not a debt anybody owes. The
# case this exists for is `ConnectOAuthState → ubb_connect_oauth_state`: OAuth is
# a single acronym token, and mechanical snake-casing yields the worse
# `ubb_connect_o_auth_state`. Nobody is going to rename it, in slice 8 or ever.
#
# Mixing the two lists would make "the ledger is at zero" unachievable by
# construction, and G22 — slice 8's completion gate, before platform admission —
# depends on zero being reachable. So an entry here carries no `owner_slice` and
# no `expected`: there is no rename coming, and the shape of the row says so.
#
# The one thing an exception shares with a ledger entry is rule 2: it must name
# a gate that is INSTALLED. An exception to a gate that cannot fail anything
# suppresses nothing, and would sit here unfalsifiable.
#
# G9 was installed by #203, which is why the entry below could finally be
# written down. It is also still checked: the gate reports `ConnectOAuthState`
# as a mismatch on every run and this file is what excuses it, so if the model
# were ever renamed to something that canonicalises correctly, the exception
# would go stale and the platform suite would say so.

version: 1

exceptions:
  - id: g9-connect-oauth-state-is-one-acronym
    gate: G9
    site: ubb-platform/apps/platform/tenants/models.py::ConnectOAuthState
    reason: >-
      OAuth is a single acronym token. Mechanical snake-casing splits it and
      produces `ubb_connect_o_auth_state`, which is worse than the correct name
      already in place — so the exception is to the mechanism, not to the rule.
      Deliberately not solved by teaching `canonical_table` about acronyms: a
      canonicalisation with a judgement step in it is one nobody can predict,
      and one stated exception is cheaper than a rule that argues back
      (#154 §6.4, ADR-0006 §9).

  # --- G6: vocabulary a foreign system owns (#210) ---------------------------
  #
  # Two of the legacy adapter's value maps word STRIPE's vocabulary,
  # and they are not debts for a reason the ledger cannot express. Every entry
  # there says "this becomes a registry label key in slice N". These never do:
  # map #137 constraint 5 forbids UBB shipping a vendor catalogue, so the
  # registry must never declare a concept for a value set Stripe owns, so no
  # label key can ever exist to move them to. A ledger entry for either would
  # be a debt nobody could pay, and G22's "the ledger is at zero" would be
  # unreachable by construction.
  #
  # The rule is not waived, only the mechanism. The wording here is still
  # chosen rather than derived, and a `humanize` fallback over a Stripe status
  # would still be the defect ADR-0008 §4.3 names — which is why these two
  # entries are what let the gate hold every OTHER map to the catalogue.

  - id: g6-plan-interval-label-is-stripes-vocabulary
    gate: G6
    site: apps/ui/src/lib/labels.ts::planIntervalLabel
    reason: >-
      The recurring interval of a Stripe Price — `month` and `year`, Stripe's
      values under Stripe's names. Same reasoning as `subscriptionStatusLabel`
      beside it: a foreign system's vocabulary has no registry concept to key
      against, by construction rather than by omission.

  - id: g6-subscription-status-label-is-stripes-vocabulary
    gate: G6
    site: apps/ui/src/lib/labels.ts::subscriptionStatusLabel
    reason: >-
      Stripe's subscription statuses, mirrored verbatim from the subscription
      object. UBB neither owns these values nor chose their wording —
      `past_due` and `incomplete_expired` are Stripe's, and its own dashboard
      says "Past due" and "Incomplete". Map #137 constraint 5 forbids UBB
      shipping a vendor catalogue, so the registry must never declare this
      concept, so no label key will ever exist to move this map to. It is an
      exception to the mechanism, not to the rule: the wording is still chosen
      rather than derived, and a `humanize` fallback here would still be a
      defect.
