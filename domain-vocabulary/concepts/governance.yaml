# Governance vocabulary: the actions the tenant audit log records.
#
# A SEPARATE FILE FROM THE WEBHOOKS, deliberately. `apps/platform/audit/
# actions.py` states the rule this file inherits: the ledger and the queue are
# independent contracts, so the action `api_key.created` and the event
# `tenant.api_key_created` are independent names. Carrying them in one domain
# file would invite exactly the merge that rule refuses.
#
# COMPLETE END-STATE (#202), from #154 §4.4.

audit_action:
  kind: closed
  summary: >-
    Every action the tenant governance ledger may record, as `noun.verb`. The
    ledger refuses an unregistered name, which is what stops the registered set
    from drifting from what is actually written. Closed for the same reason:
    UBB authors every one of them, and a name nothing may write is not an
    action.
  # `noun.verb`, the ledger's own shape — the same two-token form the webhook
  # catalogue uses, and for the same reason: both halves stay ordinary tokens.
  token_pattern: '^[a-z][a-z0-9_]*\.[a-z][a-z0-9_]*$'
  values:
    # Credentials and identity.
    - api_key.created
    - api_key.rotated
    - api_key.revoked
    - invitation.created
    - invitation.revoked
    - member.role_changed
    - member.removed
    # Tenant governance and configuration.
    - tenant.config_changed
    - sandbox.created
    - sandbox.reset
    - connect.started
    - billing_profile.set
    - auto_top_up.configured
    - postpaid_config.set
    # Spend controls, under the family that owns them.
    - customer_spend_pool.set
    - margin_threshold.set
    # Money moved by hand.
    - wallet.credited
    - wallet.debited
    - wallet.withdrawn
    - top_up.requested
    - usage.refunded
    - grant.created
    - grant.voided
    # The catalogue of what things cost and what they sell for. The single
    # entity that once held both is split across the COGS boundary, so the two
    # sides are recorded separately rather than under one word.
    - pricing_book.created
    - pricing_book.assigned
    - pricing_book.published
    - cost_rate.added
    - cost_rate.deleted
    - pricing_rule.added
    - pricing_rule.deleted
    - customer_pricing_override.set
    # The tenant's default markup rung — the last rung of the price ladder,
    # and what prices an event no rule matched. Declaring it and withdrawing
    # it are two acts under the same rule the satellites below follow: a
    # correction to a declared percentage is still a declaration, and a
    # governance reader asking when a tenant stopped having a markup at all
    # must not have to read metadata to find out.
    #
    # It is not the successor of the two retired names further down. Those
    # recorded acts on a record that ceases to exist; this rung is a new
    # record with its own routes, and the two sets are live at once until that
    # record is deleted.
    - tenant_default_markup.declared
    - tenant_default_markup.withdrawn
    # Changing a Pricing Book. Every change to a book is a publish — adding a
    # rule, repricing one and retiring one are one act recorded once — and the
    # three names below are three answers to three different questions, not
    # three spellings of one.
    #
    # A DRAFT CLOSES NOTHING, WHICH IS WHY DECLARING ONE IS ITS OWN ACT. It
    # holds the intended changes and writes no rule; publishing it is what
    # closes each superseded rule and opens its replacement, and discarding it
    # leaves the book exactly as it was. A governance reader asking "when did
    # this book's prices change" must not have to read metadata to separate the
    # publication from the intention, and one asking "what was proposed and
    # abandoned" must still find it.
    #
    # The noun is the publish record rather than the book, on the rule the
    # Event Type satellites state above: the ledger's `resource_type` already
    # says which record moved, and an action naming a different one would make
    # the two disagree.
    - pricing_book_publish.declared
    - pricing_book_publish.published
    - pricing_book_publish.discarded
    # Declaring a book and withdrawing one, PER KIND OF BOOK (#368). The
    # container that was one entity told apart by a discriminator is two:
    # a Pricing Book is a catalogue of what the tenant charges and names
    # neither a supplier nor a currency, a cost book records what one supplier
    # charges and names both. They have different columns, different products
    # gating them and different readers, so they are declared separately — and
    # under the rule the pairs above follow, declaring and withdrawing are two
    # acts rather than one with a flag.
    #
    # FOUR NAMES FOR TWO RECORDS AND TWO ACTS, which is what "one action per
    # record per kind of act" means applied to a split. A shared noun would be
    # the first place in this concept where one action spans two record types,
    # and it would put a governance reader asking when a tenant withdrew a
    # PRICING book back to reading `resource_type`.
    #
    # ⚠ NOT RENAMES OF `pricing_book.created` / `.assigned` / `.published`
    # ABOVE, which are the ratified spellings of three acts that CEASE with
    # the entity rather than carry forward: the container is replaced, the
    # record that assigned one to a customer is deleted, and what is published
    # is the publish record beside them. Those three stay declared until the
    # cutover reconciles this registry with the live set; these four are what
    # the routes actually write.
    - pricing_book.declared
    - pricing_book.withdrawn
    - cost_book.declared
    - cost_book.withdrawn
    # A customer's own pricing rule. A tenant honouring a negotiated deal
    # gives one customer a rule that replaces what they inherit — the whole
    # rule, method included — and takes it away again when the deal ends.
    #
    # Declared and withdrawn are two acts under the rule the pairs above
    # follow: a governance reader asking when a customer stopped having their
    # own price must not have to read metadata to find out.
    #
    # NEITHER IS A RENAME OF `customer_pricing_override.set` ABOVE, which is
    # the end-state spelling of a NUMBER written onto the per-customer row of
    # the markup record slice 4 deletes. An override is not a number inside a
    # rule; it is a whole rule, declared through a publish. Two acts on two
    # records, so two names, and the two sets are live at once until that
    # record is deleted.
    - customer_pricing_override.declared
    - customer_pricing_override.withdrawn
    # Executing a Resolution Run — the one recovery mechanism, and the only
    # act in this registry that writes a money-adjacent number into a period
    # whose reporting is already closed.
    #
    # ONE NAME, NOT A PAIR, and the asymmetry is the ruling rather than an
    # omission. The pairs above split declaring from withdrawing because both
    # acts exist; a run has no second act. Its write is the one-time
    # completion of a field recorded as unresolved, after which the receipt is
    # sealed — there is nothing to withdraw and no name to reserve for it.
    #
    # IT RECORDS THE ACTOR AND THE SELECTOR, which is what makes this
    # governance rather than telemetry: a run is authorised at the ADMIN floor
    # and cannot be undone, so who ran it and what they pointed it at is
    # exactly what a governance reader needs and cannot reconstruct from the
    # postings afterwards.
    - resolution_run.executed
    # What the tenant declares it meters.
    - event_type.declared
    - measurement.declared
    - grouping_field.declared
    - task_type.declared
    - tenant_supplied_revenue.recorded
    # Eight more of the same family, added by #267 when the catalogue reached
    # the contract and its twelve-mutation write surface needed names.
    # Additive, which is the only direction ADR-004 §2 leaves open, and taken
    # now rather than later because splitting a conflated action afterwards is
    # the rename that rule calls a breaking change. Doing it here costs
    # nothing; doing it in slice 8 costs a break.
    #
    # ONE ACTION PER RECORD PER KIND OF ACT — the shape `rate.added`/
    # `rate.deleted` and `webhook_config.created`/`.deleted` above already
    # run. Declaring and re-declaring are ONE act, because a correction to a
    # declaration is still a declaration; the three that are NOT are the
    # publication (what a tenant's generated integration is built against),
    # the withdrawal (a governance reader asking "when did this stop being
    # declared" must not have to read metadata to find out) and the
    # retirement (a commercial decision to stop offering a supplier, not a
    # correction to its name).
    #
    # Each satellite and each declaration part carries its own noun rather
    # than borrowing the Event Type's, because the ledger's `resource_type`
    # already says which record moved and an action naming a different one
    # would make the two disagree.
    - event_type.published
    - measurement.withdrawn
    - reported_cost_mapping.declared
    - reported_cost_mapping.withdrawn
    - provider.declared
    - provider.retired
    - event_category.declared
    - event_category.withdrawn
    # Customers, plans and subscriptions.
    - customer.created
    - plan.created
    - plan.updated
    - plan.archived
    - plan.assigned
    - subscription.created
    - subscription.canceled
    - subscription.paused
    - subscription.resumed
    - subscription.seats_changed
    # Referrals.
    - referral_program.created
    - referral_program.updated
    - referral_program.deactivated
    - referral_program.reactivated
    - referrer.registered
    - referral.attributed
    - referral.revoked
    # Webhook configuration.
    - webhook_config.created
    - webhook_config.updated
    - webhook_config.deleted
    - webhook_config.secret_rotated
    # The one entry that opens the production ledger, written at the cutover.
    # It is registered here rather than invented there because it is an action
    # like any other, and the ledger refuses names it does not know.
    - system.preproduction_model_cutover
  label_key_prefix: audit_action
  retired_aliases:
    # ADR-004 §2 makes these names additive-only and a rename a breaking change.
    # #154 §4.2 spends a one-time, scoped, pre-production exception on them:
    # the ledger is renamed, registrations for concepts that no longer exist are
    # removed, pre-cutover rows are deleted, and the production ledger opens
    # with the entry above. Keeping the old names registered-but-retired would
    # leave the live codebase carrying a second vocabulary for the sole purpose
    # of interpreting pre-launch history. AFTER the cutover the additive-only
    # rule applies unchanged, and this exception is spent.
    - budget.set
    - dimension.declared
    - rate_card.created
    - rate_card.assigned
    - rate_card.published
    - rate.added
    - rate.deleted
    - revenue_profile.set
    # Registrations for concepts that no longer exist at all. The configured
    # input they recorded is now a field of a pricing rule, recorded by the
    # pricing-rule actions above; the setting the second one recorded is gone
    # because posture derives.
    - markup.set
    - markup.deleted
    - revenue_mode.set
  consumers:
    - surface: backend
      path: ubb-platform/apps/platform/audit/actions.py
    - surface: openapi
      path: openapi/v1.json
