# Spend-control vocabulary: the four families, what a ceiling assessment
# concluded, why work was stopped, and why a start was refused.
#
# COMPLETE END-STATE (#202). One word left this vocabulary entirely: it named
# four different things — a bound on one unit of work, a bound on a customer's
# charges, a wallet floor, and a rate of new work — and each of those now has
# its own name (ADR-0006, #154 §3.4).

control_family:
  kind: closed
  summary: >-
    Which of the four spend controls a signal came from. The same four words
    are the webhook namespace, the analytics family and this field, because one
    public concept gets one public name (ADR-0006 §2). A Ceiling bounds one
    unit of work, a customer spend pool bounds one customer's charges over a
    period, a wallet policy holds the floors, and admission control bounds the
    rate of new work and says nothing about supplier cost at all.
  values:
    - ceiling
    - customer_spend_pool
    - wallet_policy
    - admission_control
  label_key_prefix: control_family
  retired_aliases:
    # A word for money set aside, used for a bound on charges that UBB enforces
    # by stopping work. `customer_spend_pool` says whose money and over what.
    - budget
  retired_senses:
    - term: limit
      retired_as: >-
        a field word naming a spend control. It named all four families at
        once, which is why #154 §3.4 removed it from the field vocabulary and
        gave each family its own noun.
      survives_as: >-
        the retry information on an admission-control rejection, which #154
        §3.4 keeps verbatim — `Retry-After`, `window_reset_at`, `limit` and
        `remaining` — beside the ordinary pagination parameter of the same name.
  consumers:
    - surface: backend
      path: ubb-platform/apps/billing/gating/models.py
    - surface: console
      path: apps/ui/src/lib/labels.ts
    - surface: openapi
      path: openapi/v1.json

ceiling_status:
  kind: closed
  summary: >-
    What a ceiling assessment concluded for one Task. `indeterminate` is kept
    distinct from an unresolved cost on purpose: an unresolved cost is a
    missing value, and `indeterminate` is the resulting inability to evaluate
    the ceiling (#158 §12.2).
  values:
    - within_ceiling
    - ceiling_reached
    - indeterminate
    - not_applicable
  label_key_prefix: ceiling_status
  value_semantics:
    summary: >-
      The assessment's rule, as #603 amended #158 §12.3 (ADR-0020; the owner's
      confirmation `6279966961`). It answers where a Task stands, and it is
      not the enforcement trigger: the stop fires when the RESOLVED COGS total
      reaches the ceiling, whatever remains unresolved, and stays terminal.
      What changed is the assessment's lower-bound reading — once a quantity
      may be negative, a cost still unresolved can move the total either way,
      so a resolved subtotal bounds nothing and `ceiling_reached` or
      `within_ceiling` is never inferred from one while a cost is unresolved.
      `>=` is the comparison, so a ceiling is reached rather than exceeded.
    inputs:
      - a_ceiling_applies
      - known_cogs_at_or_above_ceiling
      - unresolved_costs_remain
    cases:
      - when:
          a_ceiling_applies: false
          known_cogs_at_or_above_ceiling: any
          unresolved_costs_remain: any
        then: not_applicable
        because: >-
          Nothing was evaluated, so nothing was concluded. `indeterminate`
          means UBB tried and could not tell, never that there was nothing to
          try (#158 §12.4).
      - when:
          a_ceiling_applies: true
          known_cogs_at_or_above_ceiling: any
          unresolved_costs_remain: true
        then: indeterminate
        because: >-
          One or more applicable costs are unresolved, and each may be negative
          as well as positive, so the resolved total says nothing about the
          eventual one in either direction. This holds whatever the resolved
          total is — at or above the ceiling included, where the enforcement
          trigger may already have stopped the Task: that stop is a safety
          action on the resolved total, never proof of where the eventual
          total lands, and a later resolution moves this answer without
          reversing it.
      - when:
          a_ceiling_applies: true
          known_cogs_at_or_above_ceiling: true
          unresolved_costs_remain: false
        then: ceiling_reached
        because: >-
          Every applicable cost is resolved and the total is at or above the
          ceiling.
      - when:
          a_ceiling_applies: true
          known_cogs_at_or_above_ceiling: false
          unresolved_costs_remain: false
        then: within_ceiling
        because: >-
          Every applicable cost is resolved and the total is below the ceiling,
          which is the only state in which UBB can say so positively.
  retired_aliases:
    # Coined before ADR-0006 removed the word from field vocabulary, and never
    # revisited. They cost nothing to correct because they were never built:
    # #158 §12.1 found them in decision documents and one prototype only.
    - within_limit
    - limit_reached
  consumers:
    - surface: backend
      path: ubb-platform/apps/platform/work/models.py
    - surface: console
      path: apps/ui/src/lib/labels.ts
    - surface: openapi
      path: openapi/v1.json

ceiling_basis:
  kind: closed
  summary: >-
    What a Ceiling bounds. Cost and time genuinely are different columns in
    different units, so each ceiling field states its own basis and unit rather
    than one field switching unit, storage and comparison at once (#150 §2.3).
  values:
    - cost
    - time
  label_key_prefix: ceiling_basis
  consumers:
    - surface: backend
      path: ubb-platform/apps/platform/work/models.py
    - surface: openapi
      path: openapi/v1.json

spend_pool_enforce_mode:
  kind: closed
  summary: >-
    Whether a customer spend pool only announces a crossing or also stops work.
    A blocking pool enforces identically for `prepaid` and `postpaid` — mode
    decides who invoices, not whether the bound bites (#150 §7.1).
  values:
    - alert_only
    - blocking
  label_key_prefix: spend_pool_enforce_mode
  consumers:
    - surface: backend
      path: ubb-platform/apps/billing/gating/models.py
    - surface: console
      path: apps/ui/src/lib/labels.ts
    - surface: openapi
      path: openapi/v1.json

reason_code:
  kind: open
  summary: >-
    Why work was stopped, or why a bound was reported as reached. Open rather
    than closed because a stop can originate outside UBB — a provider refusal,
    a tenant's own control — and a value UBB has never seen must still travel
    rather than be rejected at the boundary. The asymmetry is the whole point:
    a value listed here and missing from a UBB-owned consumer is a defect; a
    value the registry has never seen is legal.
  known_values:
    - task_cogs_ceiling
    - customer_spend_pool
    - parent_killed
    - silence_window
    - hard_floor
    # Slice 6 §7's two coinages (#457). The unit that passed its OWN absolute
    # deadline, and contained work ended by its PARENT's expiry — so the three
    # cascades each name themselves (`parent_closed` is the caller's outcome
    # reason, a different concept; `parent_killed` and this are UBB's), and
    # the two rows of one expired tree no longer disagree.
    - absolute_deadline
    - parent_expired
  allow_unknown: true
  label_key_prefix: reason_code
  retired_aliases:
    # These named the mechanism's effect rather than the thing that was
    # exceeded. The end-state names say which bound — the Task's own COGS
    # ceiling, or the customer's shared pool.
    - task_limit
    - subtask_limit
    - customer_wide_stop
    # The 429-era refusal codes: retired when stops became signals on a 200
    # rather than rejections (`work/reasons.py` names them as deliberately
    # not reused).
    - cost_limit_exceeded
    - balance_floor_exceeded
    - task_limit_exceeded
  consumers:
    - surface: backend
      path: ubb-platform/apps/platform/work/reasons.py
    - surface: console
      path: apps/ui/src/lib/labels.ts
    - surface: sdk
      path: ubb-sdk/ubb/metering.py
    - surface: openapi
      path: openapi/v1.json

affordability_reason:
  kind: open
  summary: >-
    Why an affordability question was answered no. The question names what is
    being asked rather than the object inspected, so it stays true if a credit
    line or a grant later becomes an input. Open for the same reason as the
    stop vocabulary beside it: a refusal can arise from a control UBB gains
    later, and a caller must render one it has not seen rather than fail.
  known_values:
    - insufficient_funds
    - account_closed
    - customer_stopped
    - soft_floor_reached
    - rate_limit_exceeded
    - customer_spend_pool_exceeded
    - customer_spend_pool_unavailable
    - parent_task_not_active
    - subtask_depth_exceeded
  allow_unknown: true
  label_key_prefix: affordability_reason
  retired_aliases:
    # The endpoint's old name described a moment in a sequence rather than the
    # question it answers, and #141 retired it outright rather than deprecating
    # it — map #137 constraint 1 spent once.
    - pre_check
    # Two reasons named after the word that left the field vocabulary.
    - budget_exceeded
    - budget_unavailable
    # The bound behind it is deleted: #150 §12.5 removes the concurrent-request
    # cap, leaving admission control to bound the rate of new work only.
    - concurrency_limit
  consumers:
    - surface: backend
      path: ubb-platform/apps/billing/gating/models.py
    - surface: console
      path: apps/ui/src/lib/labels.ts
    - surface: openapi
      path: openapi/v1.json

enforcement_mode:
  kind: closed
  # DECLARED IN R10-W4 (slice 8) from `apps/platform/tenants/models.py`'s own
  # set. The console worded it through a hand-written legacy map with a
  # humanising fallback (`g6-map-enforcement-mode-label`).
  summary: >-
    The tenant's one switch for real-time spend control: off, where no
    signal is raised and no counter is kept, or enforcing, where the whole
    signal suite and its state changes run. A mode in ADR-0006 §3's sense —
    which operating regime applies — and a different concept from a
    customer spend pool's own enforce mode.
  # Quoted because YAML 1.1 reads a bare off as the boolean false.
  values:
    - "off"
    - enforcing
  label_key_prefix: enforcement_mode
  consumers:
    - surface: backend
      path: ubb-platform/apps/platform/tenants/models.py
    - surface: openapi
      path: openapi/v1.json
    - surface: console
      path: apps/ui/src/lib/enforcement-mode.ts

stop_scope:
  kind: closed
  # DECLARED IN R10-W4 (slice 8). The three were literals at every writer
  # (the stop-context tagging, the live counter, the unit read) with no
  # constant behind them; the kernel's `work/reasons.py` now holds the set
  # and every writer names a scope by reference to the generated constants.
  summary: >-
    What a stop applies to: the Task the work runs under, the Subtask itself,
    or the whole customer. Read off the stopped row's altitude, never off
    which control fired (slice 6 §7), so a parent's ceiling crossing is the
    Task's scope and a contained unit's own crossing is the Subtask's.
  values:
    - task
    - subtask
    - customer
  label_key_prefix: stop_scope
  consumers:
    - surface: backend
      path: ubb-platform/apps/platform/work/reasons.py
    - surface: openapi
      path: openapi/v1.json
    - surface: console
      path: apps/ui/src/lib/stop-scope.ts
