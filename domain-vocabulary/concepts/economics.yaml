# Economics vocabulary: UBB's role in a tenant's customer billing, how an amount
# is derived, what a resolved amount is worth, and what analytics may measure.
#
# COMPLETE END-STATE (#202). Every value here is the one ADR-0006 and the
# decision records fixed, NOT the one the code carries today. On the day this
# landed most of these disagreed with the tree; that disagreement is the
# migration each later slice is measured by, not a defect in this file.

customer_billing_mode:
  kind: closed
  summary: >-
    What UBB does about money for a tenant's customers. `external` means the
    tenant bills their customers somewhere else and UBB only meters; `prepaid`
    and `postpaid` mean UBB drives the money, and neither may be activated
    before its payment rail has been (ADR-0008 §6).
  values:
    - external
    - prepaid
    - postpaid
  label_key_prefix: customer_billing_mode
  retired_aliases:
    # `meter_only` said what UBB does NOT do. `external` says where the billing
    # actually happens, which is the fact a tenant is choosing between. The
    # rename is owned by a later slice; the registry states the destination now.
    - meter_only
  consumers:
    - surface: backend
      path: ubb-platform/apps/platform/tenants/models.py
    - surface: console
      path: apps/ui/src/lib/labels.ts
    - surface: openapi
      path: openapi/v1.json

tenant_posture:
  kind: closed
  summary: >-
    Whether UBB creates this tenant's customer charges at all. DERIVED from
    `customer_billing_mode` and never stored (ADR-0006 §4) — a second writable
    copy could disagree with the first, and the wrong one is always the one
    nobody is looking at. It is served read-only so callers need not
    reconstruct the mapping.
  values:
    - metering_only
    - full_billing
  label_key_prefix: tenant_posture
  # No `value_semantics` here, deliberately. The derivation is over
  # `customer_billing_mode`'s VALUES — `external` maps to `metering_only`,
  # `prepaid` and `postpaid` to `full_billing` — and a rule over boolean inputs
  # could only restate that in terms it cannot check against the field it
  # derives from. What enforces ADR-0006 §4 here is the absence test G10:
  # no writable `tenant_posture` column exists.
  retired_aliases:
    # `Customer.revenue_mode` stored a second, writable answer to this same
    # question. It is deleted rather than renamed (#153 §3): posture derives.
    - revenue_mode
  consumers:
    - surface: backend
      path: ubb-platform/apps/platform/tenants/models.py
    - surface: console
      path: apps/ui/src/lib/labels.ts
    - surface: openapi
      path: openapi/v1.json

costing_method:
  kind: closed
  summary: >-
    How an Event Type's supplier COGS is derived — `calculated` from declared
    Measurements against CostRates, or `reported` from a value the provider or
    the caller supplies. "Method" means how an amount is derived, and never
    which operating regime applies (ADR-0006 §3).
  values:
    - calculated
    - reported
  label_key_prefix: costing_method
  # THE CONTRACT CONSUMER ARRIVES WITH THE FIELD IT MARKS (#267), not before.
  # Declaring it while the backend restated its values was legal, because the
  # migration ledger's G4 entry excused precisely that pair. The moment the
  # backend held them by reference (#262) the pair stopped being expressible:
  # `known_values.document.decide` reads "advertised" from the CENSUS alone, so
  # a declared contract consumer plus a serving backend means the committed
  # contract must carry a marked field NOW — and no route exposes an Event Type
  # until #267 builds one. The two halves are one act, and the ledger has no
  # entry shape for "the backend serves and the contract lags".
  #
  # So this follows the rule the rest of this slice already follows: a consumer
  # is declared by the ticket that builds it. `unit` and `source_shape_id`
  # declare no contract consumer for the same reason and gain one in #268.
  consumers:
    - surface: backend
      path: ubb-platform/apps/platform/event_types/models.py
    - surface: console
      path: apps/ui/src/lib/labels.ts

pricing_method:
  kind: closed
  summary: >-
    How a resolved pricing rule derives customer price — as a margin applied
    over supplier cost, or as a price attached directly to the event. One
    method per rule; a rule that wanted both would be two rules.
  values:
    - margin_over_cost
    - direct_event_price
  label_key_prefix: pricing_method
  consumers:
    - surface: backend
      path: ubb-platform/apps/metering/pricing/models.py
    - surface: console
      path: apps/ui/src/lib/labels.ts
    - surface: openapi
      path: openapi/v1.json

pricing_mode:
  kind: closed
  summary: >-
    Which pricing regime governs a whole Task — every event priced as it
    arrives, or one agreed price for the delivered Task. Declared on the Task
    kind and snapshotted onto the Task; both carry the same word deliberately,
    because they are one concept at two scopes and the model name already
    supplies the scope.
  values:
    - event_priced
    - fixed
  label_key_prefix: pricing_mode
  retired_aliases:
    # "charging mode" named this regime, the costing method and the pricing
    # method interchangeably — one phrase for three declarations (#151 §13.3).
    - charging_mode
  consumers:
    - surface: backend
      path: ubb-platform/apps/platform/work/models.py
    - surface: console
      path: apps/ui/src/lib/labels.ts
    - surface: openapi
      path: openapi/v1.json

rate_structure:
  kind: closed
  summary: >-
    The arithmetic shape of a rate — an amount per unit of quantity, or a
    component that applies once regardless of quantity. "Structure" means the
    mathematical shape and nothing else (ADR-0006 §3).
  values:
    - per_unit
    - fixed_component
  label_key_prefix: rate_structure
  retired_aliases:
    # `pricing_model` sat one character from `pricing_mode` and meant something
    # unrelated, which ADR-0006 §3 calls a defect rather than a coincidence.
    - pricing_model
  retired_senses:
    # `flat` was a `retired_aliases` entry until the sweep it feeds was actually
    # built (#206). It cannot be one: `values_list("id", flat=True)` is Django's
    # own keyword argument and appears about a hundred times in first-party
    # code, so sweeping the bare token would condemn the ORM — and that debt is
    # unpayable, which would put "the ledger reaches zero" (G22) out of reach by
    # construction. The rule `retired_aliases` states about itself — retired
    # WHEREVER IT APPEARS, as a whole token — is simply false of this word, and
    # #202's own note says a word in that position "would force the sweep into
    # exclusions broad enough to disarm it".
    #
    # WHAT THE MOVE COSTS, stated rather than glossed. Most occurrences of the
    # retired VALUE sit beside the field `pricing_model`, which IS swept and is
    # owed by slice 4 — so they are caught by the field even though the value is
    # not. One does not: `ProductFeeConfig.fee_type == "flat"`
    # (apps/billing/tenant_billing/services.py). That field is a bare
    # `CharField(max_length=100)` carrying `flat` / `percentage` /
    # `flat_monthly`, and the registry declares NO concept for it — so after
    # this move no gate sees that value. G7 cannot (the word is not input) and
    # G2 cannot (there is no concept to compare against).
    #
    # That is a real gap and it is not G7's to close. An undeclared public value
    # set is #191 story 15's subject — "a new public value must declare its kind
    # before it ships" — and the fix is to give `fee_type` a concept here, which
    # belongs with #207's consumer gates rather than with the sweep.
    - term: flat
      retired_as: >-
        a `rate_structure` value. The value it carried said how the amount
        looked, not what it did, and `fixed_component` replaces it.
      survives_as: >-
        Django's `values_list(..., flat=True)`, and the ordinary English
        adjective for an un-nested route — "the flat create endpoint" that #86
        re-nested.
  consumers:
    - surface: backend
      path: ubb-platform/apps/metering/pricing/models.py
    - surface: console
      path: apps/ui/src/lib/labels.ts
    - surface: openapi
      path: openapi/v1.json

costing_status:
  kind: closed
  summary: >-
    Whether supplier COGS for a subject is settled. `unresolved` and a NULL
    amount are one fact and travel together; zero is a resolved amount and
    means something else entirely (ADR-0007 §2).
  values:
    - known
    - unresolved
    - not_applicable
  label_key_prefix: costing_status
  consumers:
    - surface: backend
      path: ubb-platform/apps/metering/usage/models.py
    - surface: console
      path: apps/ui/src/lib/labels.ts
    - surface: openapi
      path: openapi/v1.json

pricing_status:
  kind: closed
  summary: >-
    Whether customer price for a subject is settled, and if not, why not.
    `waived` is a decision somebody made; `unknown` is information UBB does not
    have; `not_applicable` is a subject that generates no customer revenue at
    this level, such as an event inside a Task sold for one agreed price.
  values:
    - known
    - waived
    - unknown
    - not_applicable
  label_key_prefix: pricing_status
  retired_senses:
    # Two words for a provisional price. Under #148 §8 and #149 the resolved
    # price is the price, so neither names a PRICING STATUS that still exists.
    #
    # Both were `retired_aliases` until #206 built the sweep and ran it. Neither
    # can be one, and the evidence is unusually clean: `pricing_status` is a new
    # concept whose values have never shipped, so there is not one occurrence of
    # either word as a status value anywhere in the tree, while both words are
    # common English carrying an unrelated sense on every living surface.
    #
    # THE EVIDENCE WAS RE-TAKEN IN #239, and it had to be. #206 justified the
    # exclusion on a hit count — `hold` 419, `estimate` 271 — against a tree
    # that still contained the arrival-time reservation lane, and #239 deleted
    # exactly the two mechanisms the `survives_as` clauses below used to name.
    # Nothing pins a `survives_as` clause against real code and this directory
    # is a permanent sweep exclusion, so an inherited count would have gone on
    # excusing two false sentences with CI green — ADR-0008 §9's failure mode
    # landing on the registry itself.
    #
    # Re-taken against the tree #239 produces, over the sweep's OWN swept set
    # (`sweep.partition` under `gates/forbidden-term-sweep.yaml`: 1,460 of
    # 1,798 tracked files) and its own token matcher (`sweep.pattern` — the
    # token with a non-identifier character required on each side). That is
    # the measure which answers the question being re-opened: what the gate
    # would see if these words were input. It also excludes this directory, so
    # the file can record its own number without changing it — a whole-tree
    # count could not. (#206 did not record the method behind 419/271, which
    # is why this entry records one; its numbers are closest to a whole-tree
    # occurrence count, which is not comparable to what follows.)
    #
    #     hold      49 files,  78 occurrences
    #     estimate  15 files,  21 occurrences
    #
    # OUTCOME: THE RETIRED-SENSE CLASSIFICATION STANDS, on re-taken evidence.
    # Every residual occurrence was read. `hold` is the ordinary English verb
    # throughout — a lock held, a column that may hold rows, an invariant that
    # holds, "customers hold prepaid credit" in the console's own labels —
    # plus prose recording that the reservation was deleted. `estimate` is a
    # row-count estimate in the export UI, a query-planner estimate in two
    # analytics tests, and the same historical prose. Not one occurrence of
    # either word is a `pricing_status` value, so neither becomes a retired
    # alias and this slice adds no ledger entry.
    - term: estimate
      retired_as: >-
        a `pricing_status` value naming a provisional price. `known` is the
        only thing a settled price is, and an unsettled one is `unknown`.
      survives_as: >-
        the ordinary English noun for an approximate quantity, used on living
        surfaces UBB does not price with — the export page's live row-count
        estimate, and the query planner's own estimates in the analytics
        tests. It named a mechanism until #239: `PricingService.estimate`,
        the accept-time price the deleted recording lane reserved against.
    - term: hold
      retired_as: >-
        a `pricing_status` value naming money set aside against a price not yet
        known. Under #148 §8 the resolved price is the price.
      survives_as: >-
        the ordinary English verb, on nearly every module in the tree — a lock
        held, a column that may hold rows, an invariant that holds, a customer
        who holds prepaid credit. It named a mechanism until #239:
        `LiveCounter.hold`, the atomic Redis reservation the deleted recording
        lane took at accept time. No reservation is taken anywhere now.
  consumers:
    - surface: backend
      path: ubb-platform/apps/metering/usage/models.py
    - surface: console
      path: apps/ui/src/lib/labels.ts
    - surface: openapi
      path: openapi/v1.json

usage_event_kind:
  kind: closed
  summary: >-
    The nature of one usage row, and NOTHING else — not the tenant, not how
    COGS was derived, not how customer price was calculated (ADR-0006 §3.8).
    `metered_usage` is a real event for work that occurred; `task_charge` is
    the synthetic posting projected from the canonical Charge when a Task sold
    for one agreed price is delivered.
  values:
    - metered_usage
    - task_charge
  label_key_prefix: usage_event_kind
  retired_aliases:
    # "work" would be the only place that word appeared as a noun now that Task
    # is the ratified unit of work (#154 §3.8).
    - work_charge
  consumers:
    - surface: backend
      path: ubb-platform/apps/metering/usage/models.py
    - surface: console
      path: apps/ui/src/lib/labels.ts
    - surface: openapi
      path: openapi/v1.json

pricing_receipt_subject_type:
  kind: closed
  summary: >-
    What a Pricing Receipt explains — one usage row, or one canonical Charge.
    The receipt is the authoritative record of ECONOMIC RESOLUTION, not a
    guarantee that customer revenue exists: a metering-only tenant has receipts
    (ADR-0006). Its `provenance` section survives as a section name.
  values:
    - usage_event
    - charge
  label_key_prefix: pricing_receipt_subject_type
  retired_aliases:
    # The record carried three names. `pricing_provenance` understated it — it
    # now holds authoritative amounts and statuses, not only references to where
    # they came from — and "audit trail" already names the governance ledger,
    # which keeps the name "audit log" (#154 §3.3).
    - pricing_provenance
    - audit_trail
  consumers:
    - surface: backend
      path: ubb-platform/apps/metering/usage/models.py
    - surface: openapi
      path: openapi/v1.json

analytics_measure:
  kind: closed
  summary: >-
    The four things the economic query can measure. Each name says which side
    of the trade it sits on, and `recorded_events` says plainly that it counts
    records at the tenant's declared granularity rather than units of work.
  values:
    - supplier_cogs
    - customer_revenue
    - gross_margin
    - recorded_events
  label_key_prefix: analytics_measure
  retired_aliases:
    # #153's provisional name for the count. #149 §2 had already ruled that one
    # event is one provider call, so a second noun for it would create a second
    # public name for one concept (ADR-0006 §2).
    - recorded_operations
  retired_senses:
    - term: operation
      retired_as: >-
        a count noun for a unit of metered work. #154 §8 retires it; the event
        is the declared unit and `recorded_events` is the measure.
      survives_as: >-
        an OpenAPI operation. ADR-0007 §4 uses the word for every published
        route, requires each hand-written SDK call to target a real one, and
        names the disposition manifest over all of them.
  consumers:
    - surface: backend
      path: ubb-platform/apps/metering/queries.py
    - surface: console
      path: apps/ui/src/lib/labels.ts
    - surface: openapi
      path: openapi/v1.json

measure_status:
  kind: closed
  summary: >-
    What one requested measure's amount is worth in a response. Four facts that
    used to be one integer: `incomplete` says some input is still unresolved,
    `unavailable_at_requested_grain` says the number exists but cannot be
    attributed this finely, and `not_applicable` says the measure does not
    apply here. No query may coerce any of them to zero (#153 §8.5).
  values:
    - known
    - incomplete
    - unavailable_at_requested_grain
    - not_applicable
  label_key_prefix: measure_status
  consumers:
    - surface: backend
      path: ubb-platform/apps/metering/queries.py
    - surface: console
      path: apps/ui/src/lib/labels.ts
    - surface: openapi
      path: openapi/v1.json

analytics_grouping_kind:
  kind: closed
  summary: >-
    Whether a grouping axis is a column on the event or a join to a declared
    rollup. The namespace is deliberate: a field and a rollup have materially
    different cardinality and query cost, and hiding that behind identical
    looking strings is how a chart times out in production (#153 §5.3).
  values:
    - field
    - rollup
  label_key_prefix: analytics_grouping_kind
  retired_aliases:
    # Four bespoke grouping parameters, one per surface, each with its own
    # answer to the same question. `group_by` replaces all of them (#153 §5.3).
    - dimensions
    - tag_key
    - usage_line_item_group_by
  consumers:
    - surface: backend
      path: ubb-platform/apps/metering/queries.py
    - surface: openapi
      path: openapi/v1.json

analytics_rollup:
  kind: closed
  summary: >-
    The aggregation axes UBB itself owns, one level above what the tenant
    declares. The tenant assigns members to them; the axes themselves are
    UBB's. Rollup membership is analytical taxonomy and may reclassify history,
    which is safe precisely because it touches no money (#153 §5.5).
  values:
    - event_category
    - measurement_concept
  label_key_prefix: analytics_rollup
  consumers:
    - surface: backend
      path: ubb-platform/apps/metering/queries.py
    - surface: openapi
      path: openapi/v1.json

unit:
  kind: open
  # OPEN, NOT CLOSED, and the ruling is the concept's whole content (#193 §C5).
  # A closed set would cap what a tenant is permitted to measure — map #137
  # constraint 5 and ADR-0008 §2 both forbid UBB to ship that catalogue — and
  # UBB cannot know what the next supplier will charge for. The five below are
  # what UBB has seen, never what it will accept: a value the registry has
  # never met is legal (ADR-0003), so this set decides no rejection anywhere.
  #
  # The PLURAL of this word is retired in this slice, as a SENSE rather than as
  # an alias — see `measurement_key` in `retired.yaml`, where the evidence is.
  # The singular survives untouched: the sweep matches whole tokens with a
  # non-identifier character required on each side, and `_` IS an identifier
  # character, which is the same singular/plural split the ledger already runs.
  #
  # AND THE COLLISION WITH "MINOR UNITS" IS ACCEPTED RATHER THAN OVERLOOKED.
  # ADR-0006 §3 forbids two DECLARED NAMES that differ by little and mean
  # something unrelated — which is why `publication_status` was refused for the
  # lifecycle above. This is not that: `amount_representation` is the declared
  # name for how an amount is represented, and it owns "minor units" as its own
  # English rather than as a competing concept. One noun for what a quantity is
  # counted in is the plainest name available, and refusing it because an
  # unrelated sentence elsewhere uses the plural would be letting prose veto
  # vocabulary.
  summary: >-
    What one declared quantity is counted in — the noun beside the number, so
    an amount of 1,500 means something without the reader knowing which
    supplier produced it. UBB owns the field and records the spellings it has
    met; it never bounds the set, because the quantity a tenant sells is the
    tenant's to choose.
  known_values:
    - token
    - search
    - call
    - second
    - byte
  allow_unknown: true
  label_key_prefix: unit
  # The backend consumer arrives with the field (#263). It holds the five by
  # reference in order to notice a NEAR MISS — `Tokens` where UBB spells
  # `token` — and to say so and change nothing: one noun spelled two ways
  # across two declarations reads as two different things on one invoice. It
  # never refuses a spelling, because the set does not bound what a tenant may
  # measure. The contract consumer arrives with the field it marks (#268).
  consumers:
    - surface: backend
      path: ubb-platform/apps/platform/event_types/models.py

declaration_status:
  kind: closed
  # A COINAGE THIS SLICE OWED: two merged decisions require the lifecycle and
  # neither names the token. ADR-0006 §3 rules out `method`, `mode` and
  # `structure`, and this is none of them.
  #
  # NOT `publication_status`. Slice 4 introduces immutable pricing-book publish
  # records, and a field sitting one word away from a model named for a publish
  # record is the defect shape ADR-0006 §3 names by name — two names that
  # differ by little and mean something unrelated. "Declaration" is already
  # this slice's own noun.
  summary: >-
    Whether a tenant's declaration is still being drafted or has been published
    for integrations to be generated against. Publication is what pins the
    response shape, the structured paths and the reported-cost mapping, because
    an incorrect mapping produces an incorrect supplier cost — so a later
    change is a revised publication, never a silent reinterpretation of
    integrations already generated and deployed (#193 §B7).
  values:
    - draft
    - published
  label_key_prefix: declaration_status
  consumers:
    - surface: backend
      path: ubb-platform/apps/platform/event_types/models.py

source_kind:
  kind: closed
  summary: >-
    Where a declared quantity comes from, and how the Code Builder is to obtain
    it. An Event Type's reported-cost mapping shares this source vocabulary but
    NARROWS it: a fixed per-call supplier cost is a configured cost rule, not a
    number that arrives per event, so `constant` is refused there (#156 §4,
    #179 §3.3). Sharing the source declaration is the reuse worth having;
    sharing the whole set would let one costing method mean two things.
  values:
    - provider_response
    - caller_supplied
    - derived
    - constant
  label_key_prefix: source_kind
  # THE CONTRACT CONSUMER ARRIVES WITH THE FIELD IT MARKS (#268), not before —
  # the same move `costing_method` above made, and for the same mechanical
  # reason. `known_values.document.decide` reads "advertised" from the CENSUS
  # alone, so the moment the backend held these values by reference (#263) a
  # declared contract consumer would have required the committed contract to
  # carry a marked field NOW, and no route exposes a declared measurement until
  # #268 builds one. The two halves are one act and the ledger has no entry
  # shape for "the backend serves and the contract lags", so the consumer is
  # declared by the ticket that builds it.
  consumers:
    - surface: backend
      path: ubb-platform/apps/platform/event_types/models.py

source_shape_id:
  kind: open
  # THE KIND IS THE DECISION (#193 §C7). Free text was rejected upstream:
  # `google-python`, `Google Python SDK`, `gemini_py` and `google_genai` would
  # be four distinct values for one shape, and the advisory checker would have
  # nothing stable to match. A closed database enumeration was rejected too:
  # every new supplier SDK, and every materially changed response shape, would
  # then need a schema migration. "A stable, namespaced identifier validated
  # against an extensible registry, additive rather than a closed enum" IS
  # ADR-0008 §2's `open` kind, exactly — so it is registered as one.
  #
  # The per-concept override is what makes the values expressible at all: the
  # registry-wide pattern admits no dots. The mechanism is not new — it arrived
  # with the webhook catalogue (ADR-0006 §5) — and it widens the shape without
  # abolishing it, because every segment still obeys the ordinary token rule.
  # `custom` carries no namespace on purpose: it names no shape UBB knows, and
  # is the value `source_shape_label` below exists to accompany.
  token_pattern: '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)*$'
  summary: >-
    Which provider response shape a tenant's declared paths are written
    against, declared once at the Event Type so two quantities beneath it can
    never disagree about which client they are mapped to. UBB uses it to WARN
    that a path looks inconsistent with a shape it knows, and never to
    substitute one: rendering a supplier's own field name would make UBB's
    catalogue commercially load-bearing by the back door.
  known_values:
    - google.gemini.rest.v1
    - google.genai.python.v1
    - openai.responses.python.v1
    - custom
  allow_unknown: true
  label_key_prefix: source_shape_id
  consumers:
    - surface: backend
      path: ubb-platform/apps/platform/event_types/models.py

source_shape_label:
  kind: free_text
  summary: >-
    The name a tenant gives a response shape UBB does not recognise — their own
    wrapper around a supplier's client. Prose a human typed, and deliberately
    unvalidated: UBB generates from the declared path and performs no shape
    checking at all in this case, so there is nothing to check the name
    against and nothing for UBB to enumerate. Declaring a wrapper of one's own
    is a supported case rather than a blocked one (#193 §C7).
  consumers:
    - surface: backend
      path: ubb-platform/apps/platform/event_types/models.py

amount_representation:
  kind: closed
  summary: >-
    What an extracted supplier-cost number actually represents, so the
    conversion to currency micros is generated once and exactly rather than
    written by hand in a repository UBB never sees. Declaring it is what keeps
    "no float enters money arithmetic" true across the boundary (#179 §3.4).
  values:
    - micros
    - minor_units
    - major_units_decimal
  label_key_prefix: amount_representation
  # THE CONTRACT CONSUMER ARRIVES WITH THE FIELD IT MARKS (#267), not before —
  # the third and last of the three closed sets to make this move, after
  # `costing_method` (#262) and `source_kind` (#263), and for the same
  # mechanical reason. `known_values.document.decide` reads "advertised" from
  # the CENSUS alone, so the moment the backend held these values by reference
  # (#266) a declared contract consumer would have required the committed
  # contract to carry a marked field NOW, and no route exposes a reported-cost
  # mapping until #267 builds one. The two halves are one act and the ledger
  # has no entry shape for "the backend serves and the contract lags", so the
  # consumer is declared by the ticket that builds it.
  consumers:
    - surface: backend
      path: ubb-platform/apps/platform/event_types/models.py

tenant_product:
  kind: closed
  summary: >-
    The products a tenant has enabled. Three, not four: the second recording
    lane was deleted along with the flag that switched it on, because there is
    one recording core and a tenant should not be choosing between two of them
    (#149 §6). Subscription lifecycle gates on `billing` rather than on a flag
    of its own.
  values:
    - metering
    - billing
    - referrals
  label_key_prefix: tenant_product
  retired_aliases:
    # The flag, the lane it switched on, and the console's name for the choice.
    - metering_async
    - async_ingest
    - fast_lane
    - ingest_mode
  retired_senses:
    - term: ingest
      retired_as: >-
        a named recording lane or mode a tenant could select between. #149 §6
        deleted the lane; there is one recording core.
      survives_as: >-
        `usage_ingest`, the trigger source naming where a spend stop was
        applied — the recording path itself, not a choice about it (#154 §5.3).
  consumers:
    - surface: backend
      path: ubb-platform/apps/platform/tenants/models.py
    - surface: console
      path: apps/ui/src/lib/labels.ts
    - surface: openapi
      path: openapi/v1.json

event_type_key:
  kind: tenant_defined
  summary: >-
    The key a tenant gives one of its own registered Event Types. UBB owns the
    entity, its costing declaration and its validation contract, and never
    enumerates the keys: doing so would make the registry a catalogue of the
    tenant's providers and calls, which map #137 constraint 5 forbids UBB to
    ship.
  consumers:
    - surface: backend
      path: ubb-platform/apps/platform/event_types/models.py
    - surface: openapi
      path: openapi/v1.json

grouping_field_value:
  kind: tenant_defined
  summary: >-
    A value a tenant reports on one of its own declared grouping fields — a
    model name, a region, a customer tier. UBB bounds the keyspace (ADR-0005's
    cardinality cap) and never enumerates the values: doing so would make the
    registry a catalogue of the tenant's suppliers and models, which map #137
    constraint 5 forbids UBB to ship.
  retired_aliases:
    # The old name meant *price selection* at a competing product — the one job
    # a grouping axis in UBB will never do (#145 §10).
    - dimension
    - dimension_def
  consumers:
    - surface: backend
      path: ubb-platform/apps/platform/grouping_fields/models.py
    - surface: openapi
      path: openapi/v1.json

plan_name:
  kind: free_text
  summary: >-
    The display name a tenant gives a plan. Prose a human typed, not a token —
    it is recorded here so that "should plan names be an enum?" is answered
    once, in data, and never re-opened. A `free_text` concept declares no
    values by construction; that absence IS its content.
  consumers:
    - surface: backend
      path: ubb-platform/apps/platform/plans/models.py
    - surface: openapi
      path: openapi/v1.json
