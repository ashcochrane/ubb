    # nothing here goes near `compute(units)`.
    #
    # #318 MOVED THE DENOMINATOR ONLY, UPWARD (1,538 → 1,542 swept, 1,911 →
    # 1,916 tracked, 50/126 unchanged) — the "needs no story" direction, with
    # the same non-widening signature #312 and #317 record: `historical-
    # migrations` went 206 → 207 because this commit ADDS a migration to a
