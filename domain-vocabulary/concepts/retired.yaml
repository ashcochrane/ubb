    # is in the commit — the numerator says so — and #275's RATE ARITHMETIC
    # caution holds once more: a route rename went nowhere near `compute(units)`.
    #
    # #281 MOVED THE DENOMINATOR ONLY, UPWARD AGAIN (1,542 → 1,546 swept, 1,900
    # → 1,904 tracked, 51/127 unchanged) — FOUR new files, and both counts move
    # by the same four because none of them is a migration. Four files but TWO
    # modules, each with its test: the console's canonical economic scenario
