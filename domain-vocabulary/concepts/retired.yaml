    # worth carrying forward is that the third case's signature is an exclusion
    # count rising WHILE THE SWEPT TOTAL FALLS; here both rose, which no
    # widening can produce, since widening moves a file from one set to the
    # other rather than adding one to each.
    #
    # THE NEW MODULE CREATES RATES AND NAMES NONE OF THE THREE WORDS THAT
    # WOULD HAVE COST IT, all three slice 4's and all three ceilings on SPREAD.
    # The discriminator between a cost rule and a price rule
    # (`backend::card_type`, 31 files) is reached through the two helpers that
    # already carry it in a file already counted — the answer
    # `cost_rate_in_default_book` was minted for, used here for both halves
    # because the price helper's own default is the price half. The
    # shape-of-charge column (`backend::pricing_model`, 21 files) is simply not
    # passed: the model's default already is the value every case here wants.
    # The book pointer (`backend::rate_card`, 23 files) is the third, and the
    # one assertion needing a book fetches it by tenant rather than reading it
    # off a rate — the property that points at it is the retired spelling,
    # while the class name is not, because the sweep matches case-sensitively.
    # NOT a numerator move on `units`: none of the three is this entry's word,
    # and this entry's word did not move.
    #
    # Nothing about THIS concept is in the commit. What changes is WHEN a
    # pricing rule takes effect and whether that moment may be edited
    # afterwards; a posting's measured quantity lives on its child record keyed
    # by `measurement_key` and is not read here at all. #275's RATE ARITHMETIC
    # caution holds again — the rules this commit dates are the ones
    # `compute(units)` reads, and it does not touch that method.
    #
    # #326 MOVED THE DENOMINATOR ONLY, UPWARD AGAIN (1,553 → 1,555 swept,
    # 1,929 → 1,933 tracked, 50/126 unchanged — this entry's own `units`
    # evidence, and still not the sweep's closing line, which the paragraph
    # above disarms). FOUR new files across BOTH sets: two swept — a kernel
    # read module and a test module — and TWO migrations, excluded, so
    # `historical-migrations` goes 209 → 211. Both totals rose, which is the
    # signature #325's paragraph above records as ruling out a widened
    # exclusion.
    #
    # THE SECOND MIGRATION ARRIVED IN THE REVIEW PASS, WHICH IS WHY THIS
    # PARAGRAPH WAS RE-TAKEN RATHER THAN WRITTEN ONCE. Review found the check
    # this slice installed could not refuse the write it was written to refuse,
    # and the trigger that does is another excluded file. Re-taking both numbers
    # after the review pass — not only after the build — is the rule that made
    # the difference visible.
    #
    # THE COMMIT MADE THIS CONCEPT'S NAME A REFERENCE AND STILL DID NOT MOVE
    # THIS ENTRY'S NUMBER, which is worth stating because it is the one commit
    # so far where a reader would expect otherwise. `measurement_key` is the
    # CANONICAL name and this entry is about the retired senses of `units`; the
    # rate's column stopped holding a name and started holding the declared
    # record, and the name it answers with is the declaration's. Two of the
    # three words #325's paragraph above lists were paid the same way again —
    # the cost/price discriminator through the helpers (one of which is new,
    # in the same already-counted file, because a test needed an empty book and
    # the create body names the word), and the shape-of-charge column by not
    # passing an argument. The third, `rate.added`, is not on that list and was
    # found the same way: an assertion naming the audit action a refused write
    # must not have written. It was replaced by a STRONGER one — that the
    # refusal wrote no audit entry of ANY kind — which names nothing and would
    # also catch a second entry riding along beside the one being checked.
    #
    # OUTCOME: SENSE, NOT ALIAS. Every residual occurrence was read and every
    # one falls in a surviving sense above; there is no fifth. The column and
    # every reader of it died in this slice — that half of the ruling was never
    # in doubt — but the deletion is proved by a targeted test rather than by
    # the sweep, because the sweep can never reach zero on this word.
    #
    # #327 MOVED THE DENOMINATOR ONLY, UPWARD AGAIN (1,555 → 1,558 swept,
    # 1,933 → 1,936 tracked, 50/126 unchanged — this entry's own `units`
    # evidence, still not the sweep's closing line). THREE new files, all three
    # swept and none excluded: a kernel module that builds a supplier-cost total
    # together with the count of what it excluded, a test module asserting that
    # every total says so, and a tree-walking gate that fails on the next bare
    # aggregate over the column. No migration this time, so
    # `historical-migrations` holds at 211 — the discriminator #326's paragraph
    # above names, working the other way round.
    #
    # A FOURTH RETIRED WORD ALMOST LANDED ON THE NEW MODULE, AND IT IS NEITHER
    # OF THE THREE #323 AND #324 NAME. `tag_key` (`backend`, EIGHT files) is the
    # request parameter naming a key out of the open bag, and the module needed
    # it twice: once for the keyed margin rollup and once for the route's keyed
    # breakdown. The sweep failed with `term_spread` at nine. Both assertions
    # moved to `apps/metering/tests/test_analytics_scale.py`, which already
    # carries the word AND already owns both of those rollups with a fixture
    # that spans them — so the pins landed beside the behaviour rather than in a
    # file that had to import it. The completeness pin for the OTHER keyed
    # rollup went to `test_analytics_dimensions.py` for the same reason and
    # against slice 7's other word. The lesson #323 wrote is now three tickets
    # old and still the answer: spell a retired word only in a file already
    # counted, and prefer the file that owns the behaviour to the file that owns
    # the test.
    #
    # Nothing about THIS concept is in the commit. What changes is that a total
    # over the supplier's cost now travels with the count of postings it could
    # not include; a posting's measured quantity lives on its child record keyed
    # by `measurement_key` and no total here reads it. #275's RATE ARITHMETIC
    # caution holds again — `compute(units)` is not on this path, and the counts
    # this commit adds are counts of ROWS rather than of anything measured.
    #
    # #328 MOVED BOTH DENOMINATORS, AND ONE OF THEM FOR THE THIRD CASE ABOVE
    # (1,558 → 1,559 swept, 1,936 → 1,940 tracked, 50/126 unchanged). ONE new
    # swept file — the test module asserting that four products carry the
    # completeness through instead of dropping it — and THREE new migrations,
    # which is why `historical-migrations` goes 211 → 214 and the tracked total
    # rises by four while the swept total rises by one. That is an exclusion
    # count moving in the same commit, the discriminator the three-case rule
    # names; it is the benign reading, because the count for this word did not
    # fall.
    #
    # THE WORD ALMOST ROSE, IN A SENTENCE ABOUT WORK RATHER THAN ABOUT MONEY.
    # A docstring in platform's work read contract described a rollup as summing
    # a count "over the units in the group" — the plural, in its ordinary
    # English sense, in a file the sweep reads. It is now "over every unit in
    # the group", which says the same thing in the singular this slice's own
    # concept survives as. Worth recording because it is the first time the
    # near-miss came from PROSE about a different subject entirely rather than
    # from an identifier: none of the three surviving senses was in play, and no
    # amount of care about currency or rate arithmetic would have caught it.
    #
    # A FOURTH RETIRED WORD ALSO ALMOST LANDED ON THAT MODULE, AND IT IS A
    # CATALOG EVENT NAME. `task.limit_exceeded` (`backend`, FIFTEEN files) is
    # the kill announcement's type, and the module read the outbox for it by
    # name; the sweep failed with `term_spread` at sixteen. Answered without
    # moving the assertion anywhere: the query addresses the schema's own
    # `EVENT_TYPE` constant instead of the string, which is stricter than the
    # literal was — a renamed catalog entry now moves the test with it. The
    # #323 lesson generalises: where a retired word has a symbol, name the
    # symbol.
    #
    # #329 MOVED THE DENOMINATOR ONLY, BY ONE, WITH NO EXCLUSION MOVING
    # (1,559 → 1,560 swept, 1,940 → 1,941 tracked, 50/126 unchanged). ONE new
    # swept file — the test module holding that a period holding money nobody
    # has accounted for does not close — and no migration, so the exclusion
    # counts are untouched and the tracked total rises by exactly the swept
    # total. That is the simplest of the three cases: the count for this word
    # did not fall, and nothing was excluded to keep it where it is.
    #
    # THE NEAR-MISS WAS A RETIRED WORD ON A COLUMN THE NEW TEST WANTED TO READ.
    # The obvious assertion for "an event whose quantity names a declaration
    # nobody made is marked not fully costed" is to read the recorded receipt
    # off the posting and check which name went uncosted — and that column's own
    # spelling is `pricing_provenance`, retired and capped at NINE files, in a
    # module that was not one of them. Answered the #327 way rather than by
    # moving the assertion: the posting is asked for the MARK it carries — the
    # status, the absent amount and the reason — which is what the acceptance
    # criterion actually says, and a positive control in the same fixture proves
    # the undeclared name is the cause. The receipt's contents stay asserted at
    # the pricing spine, where the answered value has a live spelling.
    #
    # #330 MOVED THE DENOMINATOR ONLY, BY SIX, WITH NO EXCLUSION MOVING
    # (1,560 → 1,566 swept, 1,941 → 1,947 tracked, 50/126 unchanged). SIX new
    # swept files — the console module that decides what a supplier-cost total
    # may say when some of the costs under it were never learned, the shared
    # components that draw it, and four test modules — and no migration, so the
    # exclusion counts are untouched and the tracked total rises by exactly the
    # swept total. #329's case again, six times over.
    #
    # ⚠ AND THE SWEEP CAUGHT ONE, AS A VERB. `tags` is retired (`metadata_key`
    # replaced it) and a review-pass comment read "a marker episode tags no
    # events" — ordinary English about MARKING something, nowhere near the open
    # bag the noun names, and matched all the same because the sweep reads
    # tokens rather than senses. It is the counterpart of #328's `units` lesson
    # and generalises it: a retired NOUN can be tripped by its own live VERB,
    # and no amount of care about the retired sense helps. Re-running the sweep
    # after the review pass is what found it; running it only after the build
    # would not have.
    #
    # A CONSOLE-ONLY COMMIT PASSES NEAR A DIFFERENT SET OF WORDS, and the one it
    # passed nearest is this entry's own. The plural is the console's live
    # spelling for rate arithmetic ("per 1K units") and for currency minor
    # units, both of which appear on money surfaces this commit edits — and
    # neither was written, because nothing here computes a rate or converts a
    # currency: it renders a total that is already in micros. The near-miss
    # worth recording is prose rather than code: "summed over the units in the
    # group" is the sentence #328 wrote and paid for, and the same sentence was
    # available at every call site this commit touched. Say "every event".
    #
    # THE OTHER THREE WERE AVOIDED BY WHAT THE COMMIT IS ABOUT rather than by
    # care. `dimension(s)` (slice 7, the analytics grouping vocabulary) is
    # spelled by `dimensionLabel` and `BREAKDOWN_DIMENSIONS` in three files this
    # commit touches — all three already counted, and none gained an occurrence,
    # because the breakdown card renders BILLED cost and is out of this rule's
    # extent by construction. `metric` and `budget` sit on surfaces this commit
    # does not reach at all.
    #
    # #348 MOVED THE DENOMINATOR ONLY, BY TWO, WITH NO EXCLUSION MOVING
    # (1,566 → 1,568 swept, 1,947 → 1,949 tracked, 50/126 unchanged). TWO new
    # swept files — the module stating which tables carry a nullable amount and
    # the status column beside it, and the test module proving the shared total
    # answers for two different such pairs — and no migration, so the exclusion
    # counts are untouched and the tracked total rises by exactly the swept
    # total. #329's and #330's case, twice over.
    #
    # A PREFACTOR CANNOT MOVE THE NUMERATOR BY DOING ITS JOB, and this one did
    # not. No behaviour changes, no column is added or renamed, and the two
    # column names that move out of the shared seam — the posting's supplier
    # cost and its costing status — are neither retired nor near a retired
    # spelling. What the commit is about is MONEY, and a posting's measured
    # quantity lives on its child record keyed by `measurement_key`. #275's
    # RATE ARITHMETIC caution holds: nothing here goes near `compute(units)`.
    #
    # ⚠ THE HAZARD HERE IS THE ONE THE SWEEP CANNOT SEE, and it is the mirror
    # of #330's. This commit's whole subject is the second pair arriving in
    # slice 4 — a customer price and the status beside it — so its docstrings
    # are written about pricing, and the English two-word form of
    # `backend::pricing_model` (21 files) is a phrase such prose reaches for
    # without ever meaning the column. A SPACE IS NOT AN IDENTIFIER CHARACTER,
    # so the matcher never sees that form: the sweep would have stayed green
    # while the retired term went back into the tree in English. #330 records a
    # retired noun caught BY the sweep through its own live verb; this records
    # the other direction, where reading is the only instrument. The avoidance
    # is to write about a PAIR and a COLUMN rather than about a model — and to
    # read the diff for spaces and hyphens AFTER running the sweep, not instead
    # of it.
    #
    # #349 MOVED THE DENOMINATOR ONLY, UPWARD, BY THREE (1,568 → 1,571 swept,
    # 1,949 → 1,952 tracked, 50/126 unchanged). THREE new swept files — the
    # module that holds the Pricing Receipt's shape and the one function
    # permitted to build it, and the two test modules over it — and no
    # migration, so the exclusion counts are untouched and the tracked total
    # rises by exactly the swept total. #329's, #330's and #348's case again.
    #
    # ⚠ THE NEAR MISS WAS THE PLURAL AS A RECEIPT KEY, AND IT SURVIVED ON
    # PURPOSE. The receipt's per-quantity components carry `"units"` as the key
    # for how much was measured, written in the compute spine — and that spine
    # is the ONLY backend file where the token appears for rate arithmetic in
    # this area. Restructuring the record was the obvious moment to re-spell
    # it, and re-spelling it would have taken the file out of the counted set
    # and the numerator to 49, which this entry's own denominator arithmetic
    # would have reported as a word leaving the tree in a commit that is not
    # about the word. The key stays; the component shape is the ticket that
    # owns it. **A retired term can be tripped by REMOVING it**, which is the
    # direction neither #328's lesson nor #330's records.
    #
    # THE TWO NEW TEST MODULES WERE WRITTEN AGAINST THIS RULE RATHER THAN
    # AROUND IT. Neither says `units` at all — a receipt's component is asserted
    # by its `measurement_key` and its `micros`, which is the stronger claim
    # anyway — and neither spells the receipt column, addressing it through
    # `Posting.RECEIPT_COLUMN` because its extent is capped at nine backend
    # files. ⚠ Two masking edits in EXISTING parity tests did spell it and put
    # the count at eleven; the sweep caught both, and the fix was the same
    # constant. The lesson is #328's shape one layer out: the file that trips a
    # ceiling is not the new module you were careful about, it is the old one
    # you edited two lines of.
    #
    # ⚠ #350 MOVED THE NUMERATOR UPWARD, WHICH THIS ENTRY HAS NEVER RECORDED
    # BEFORE (1,571 → 1,572 swept, 1,952 → 1,953 tracked, 50/126 → 52/128). It
    # has fallen twice — #272 paying the sense, and #284's widened exclusion,
    # both recorded above — and until now it had never risen. That is the
    # entry's FIRST case: somebody wrote the word. So it is read here before it
    # is rewritten, which is what the rule above asks for.
    #
    # THE SENSE IS RATE ARITHMETIC, WHICH IS THE ONE #275 SAID TO WATCH, AND
    # THE COMMIT IS SQUARELY INSIDE IT. #350 makes the Pricing Receipt outlive
    # the measurements it explains: each per-quantity component now carries the
    # quantity, the rule's per-unit rate, the denominator and the flat addend by
    # value, so an amount can be recomputed six years later with the measurement
    # detail pruned. The quantity's key in that component is the plural, and it
    # is the plural because #349 ruled it stays — re-spelling it would report a
    # word leaving the tree in a commit that is not about the word.
    #
    # THE THREE PLACES, AND THEY NET TO TWO FILES AND TWO OCCURRENCES:
    #
    #   receipts.py            +1 file, +1 — the record's own declaration of
    #                          what a component must carry, which is the
    #                          minimum that makes it reproducible
    #   the new test module    +1 file, +2 — reading the quantity back out of a
    #                          component to redo the arithmetic, which is the
    #                          claim the ticket exists to make
    #   pricing_service.py      0 files, -1 — the two component literals became
    #                          one shared builder, so the spine spells it once
    #                          instead of twice and stays in the counted set
    #
    # NO SENSE MIGRATED AND NOTHING RETIRED CAME BACK. All three additions are
    # the rate-arithmetic sense the entry already lists as surviving; the
    # posting's own dropped field is not among them, and the numerator would
    # have had to move for this commit to be honest about what it wrote.
    #
    # ⚠ AND THE OBVIOUS TIDY-UP IS THE ONE THAT TURNED A CONTROL RED. The
    # spine's loop variable `units_val` was renamed to `quantity` in the first
    # draft — a strict improvement in isolation — and
    # `test_the_control_the_near_misses_are_spellings_the_tree_really_has` went
    # red. That control asserts the matcher walks past seven near misses, and it
    # reads a NAMED LIST OF SIX FILES rather than the tree: of those six, the
    # compute spine is the only one carrying `units_val`, so renaming it there
    # emptied the near miss the control requires to be a spelling real code has.
    # (The token also sits in a frozen 2026-07-03 plan document, which is
    # excluded from the sweep and is not one of the six the control reads — so
    # "still in the tree" would not have saved it.) The name is kept and the
    # reason is now written where it sits. The generalisation is #349's, in the
    # other direction: a retired word can be tripped by REMOVING it, and a near
    # miss can be tripped by IMPROVING it.
    #
    # #351 MOVED THE DENOMINATOR ONLY, UPWARD (1,572 → 1,582 swept, 1,953 →
    # 1,967 tracked, 52/128 unchanged) — the "needs no story" direction, back
    # after #350's first-ever numerator rise. TEN new modules in the swept set
    # and FOURTEEN in the tracked one, and the gap is exactly the four
    # migrations, which are tracked and excluded.
    #
    # The ten: the price-applicability rule and its test, the two test modules
    # for the nullable price column and its 39 readers, and six generated SDK
    # model files for the two value sets the contract now advertises.
    #
    # NOTHING HERE IS ABOUT THE QUANTITY. #351 is the customer-price half of the
    # money model — a nullable amount, its status, and the readers that must
    # stop reading its absence as zero — and it touches no per-quantity
    # arithmetic at all. A numerator that had moved would have meant the word
    # arrived in a commit with no business writing it, which is exactly the
    # reading #350's paragraph above establishes.
    #
    # ⚠ AND THE COMMIT DID TRIP THE SWEEP, ON A DIFFERENT TERM: a docstring
    # explaining what the billing handler's branch does wrote `budget`, which is
    # slice 6's retired spend-control family name, into one file that did not
    # have it. `term_spread` caught it — 36 files declared, 37 found. The word
    # was reworded to "the live spend counters", not admitted to the ledger:
    # a ledger entry is a finite migration plan, and prose is never the thing
    # that has to widen it.
    #
    # #352 MOVED THE DENOMINATOR ONLY, UPWARD (1,582 → 1,583 swept, 1,967 →
    # 1,969 tracked, 52/128 unchanged) — the "needs no story" direction, with
    # the non-widening signature #312, #317 and #318 all record:
    # `historical-migrations` went 218 → 219 because this commit ADDS a
    # migration to a directory the rule already covers. TWO new files, ONE OF
    # THEM SWEPT — the migration installing the price pair's transition trigger
    # (excluded), and the module that proves the database holds it. No
    # generated artifact of any kind: this commit publishes nothing, so the
    # #277/#317 hazard of taking the count before a regeneration does not arise.
    #
    # NOTHING HERE IS ABOUT THE QUANTITY, and #275's RATE ARITHMETIC caution
    # holds. #352 is the enforcement half of #351's customer-price columns — a
    # trigger over an amount and its status, and the tests that drive it through
    # three doors. It goes nowhere near `compute()`, which is where the
    # surviving rate-arithmetic sense lives.
    - term: units
      retired_as: >-
        the posting's own field for the metered quantity — dropped, with every
        reader, in #272. One nameless integer per posting could only ever
        describe one thing, which is what made an event carrying both input and
        output amounts inexpressible; a declared Measurement replaces it, keyed
        by this concept and carrying its own `unit`.
      survives_as: >-
        three live senses UBB depends on. Currency MINOR units, which is
        `amount_representation`'s own English in the money module, the billing
        services and every console money input. Rate arithmetic — `Rate.compute`
        and the console's "per 1K units" — which slice 4 renames to a quantity
        word. And ordinary English inside three GENERATED vocabulary modules,
        whose text is rendered from concept summaries in this directory: that
        one is unremovable by any commit, since the registry may spell the word
        freely and its generated output may not be hand-edited.
  consumers:
    - surface: backend
      path: ubb-platform/apps/metering/usage/models.py
    - surface: openapi
      path: openapi/v1.json

metadata_key:
  kind: tenant_defined
  summary: >-
    A key in the one open bag a tenant may attach to a record. Filterable,
    never groupable — grouping is what declared Grouping Fields are for, and
    the bag exists precisely because not everything a caller wants to keep
    should become an analytics axis with a cardinality bound.
  retired_aliases:
    # A second open bag whose name implied the grouping capability the first one
    # deliberately does not have. It retires with that capability (#145 §8).
    - tags
  consumers:
    - surface: backend
      path: ubb-platform/apps/metering/usage/models.py
    - surface: openapi
      path: openapi/v1.json

pricing_book_name:
  kind: free_text
  summary: >-
    The display name a tenant gives a book of pricing rules. Prose a human
    typed. The record it names replaced an entity that carried supplier cost
    and customer price in one table discriminated by a column, which is the
    conflation the cost/price split exists to end (#138, #148 §5.4).
  retired_aliases:
    - card_type
    - cost_card
    - price_card
    - rate_card
  consumers:
    - surface: backend
      path: ubb-platform/apps/metering/pricing/models.py
    - surface: openapi
      path: openapi/v1.json

live_counter_maintenance_enabled:
  kind: free_text
  summary: >-
    The per-tenant switch selecting WHEN the live spend counters are
    maintained: ON debits them synchronously on the recording path and checks
    the crossing there, so the ack itself carries the stop verdict; OFF does no
    counter work at record time and the durable drawdown detects instead, at
    its own latency. It was named for the arrival-time ingest lane. Slice 1
    (#192) deleted that lane and kept the switch, because it never was the
    lane's switch — it also gates both reconciles' counter legs and the upward
    repair, none of which is arrival-shaped, and the conflation cost a whole
    ticket (#233) to unpick when `repair.py` was read under the wrong meaning.
    Renamed by #246 while the pre-live contract window was still open
    (ADR-0007 §5), because after platform admission the same word costs a
    90-day deprecation cycle.
  # `kind: free_text` is a DELIBERATE STRETCH and the first boolean in the
  # registry — no other boolean field is registered here (not
  # `automatic_tax_enabled`, not `is_active`). None of
  # schema.yaml's four kinds is built for one: `closed` and `open` both demand
  # a value set plus a `label_key_prefix`, and `tenant_defined` is for values
  # the tenant owns. `free_text`'s own summary — "Not vocabulary. Recorded here
  # so that 'is this a value set?' is answered once, in data" — describes a
  # boolean exactly; only its NAME misfits. A fifth kind was the alternative,
  # and it was not taken for one entry. If a second boolean ever needs
  # registering, mint the kind then and move this with it.
  retired_aliases:
    # Three spellings, not one. The sweep matches the token as spelled with a
    # non-identifier character required on each side, and `_` IS an identifier
    # character — so `arrival_signals` does not match inside
    # `arrival_signals_enabled`, and each live spelling needs its own entry.
    - arrival_signals
    - arrival_signals_enabled
    - arrival_signals_on
  retired_senses:
    - term: arrival
      retired_as: >-
        a name for real-time spend detection or for the switch that governs
        it. The arrival-time ingest lane it referred to was deleted in slice 1
        (#192) and there is now exactly one recording path.
      survives_as: >-
        the analytics time basis — `basis="arrival"` windows on `created_at`
        (when UBB received the event) as against `effective` (when it
        happened). `apps/metering/CONTEXT.md` keeps that distinction, and the
        drawdown repair and platform-fee windows both depend on it.
  consumers:
    - surface: backend
      path: ubb-platform/apps/platform/tenants/models.py
    - surface: openapi
      path: openapi/v1.json
    - surface: sdk
      path: ubb-sdk/ubb/_core/models/tenant_config_out.py
    - surface: console
      path: apps/ui/src/features/settings/components/spend-control-card.tsx

idempotency_key:
  kind: free_text
  summary: >-
    The caller's key for making a retried write safe. Opaque to UBB beyond its
    length bound, and the only caller-supplied correlation value on the
    recording path — which is what made the second one removable: it had no
    uniqueness constraint, no lookup, no filter and no read that changed any
    behaviour, while carrying an index write on the hottest path in the system
    (#179 §4).
  retired_aliases:
    - request_id
  consumers:
    - surface: backend
      path: ubb-platform/apps/metering/usage/models.py
    - surface: sdk
      path: ubb-sdk/ubb/metering.py
    - surface: openapi
      path: openapi/v1.json
