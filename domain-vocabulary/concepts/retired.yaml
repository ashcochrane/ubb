    # 200. All three are quotation, not a fifth sense. A test that proves a word
    # is gone must be allowed to say the word; the alternative is sourcing the
    # token from this registry at runtime, which reads as cleverness and hides
    # what the test is about.
    #
    # #312 MOVED THE DENOMINATOR ONLY, UPWARD (1,533 → 1,534 swept, 1,904 →
    # 1,906 tracked, 50/126 unchanged) — the "needs no story" direction, and it
    # is recorded chiefly because it comes straight after #284, the one commit
    # that ever moved the numerator without a word leaving the tree. NO
    # EXCLUSION COUNT ROSE FOR A NEW REASON HERE: `historical-migrations` went
    # 204 → 205 because this commit ADDS a migration to a directory the rule
    # already covers, which is the bookkeeping every migration does and not a
    # widening. That is the discriminator #284 wrote down, applied to the very
    # next commit. Two new files, one of them that migration and the other the
    # test module pinning it — so the tracked total moves by two and the swept
    # by one. THREE FILES WERE ALSO RENAMED and none of them moves either count:
    # a rename is a delete plus an add to `git ls-files`, and the sweep reads
    # content rather than paths. Nothing about this concept is in the commit —
    # it retires the SINGULAR GROUPING-FIELD VALUE word, a different registry
    # entry entirely — and #275's RATE ARITHMETIC caution holds again: it went
    # nowhere near `compute(units)`.
    #
    # #317 MOVED THE DENOMINATOR ONLY, UPWARD (1,534 → 1,538 swept, 1,906 →
    # 1,911 tracked, 50/126 unchanged) — the "needs no story" direction again,
    # and the same non-widening signature #312 records: `historical-migrations`
    # went 205 → 206 because this commit ADDS a migration to a directory the
    # rule already covers. FIVE NEW FILES, FOUR OF THEM SWEPT — the migration
    # (excluded), the test module pinning the new columns, and THREE GENERATED
    # SDK enum modules, one per response schema that now publishes the costing
    # status. Those three are the reason this number was re-taken AFTER
    # `generate_core.py` ran and its output was staged: #277 already paid for
    # taking it before the regeneration, and a published property whose type is
    # an enum mints a module per schema carrying it in exactly the same way.
    #
    # THE NUMERATOR HOLDING IS THE READING WORTH HAVING HERE, for the reason
    # #281's entry gives about itself. This commit works inside the retired
    # sense's own territory — it adds three columns to the posting that #272
    # took the nameless integer off, and publishes one of them — and it still
