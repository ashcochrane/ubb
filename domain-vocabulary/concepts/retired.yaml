# The canonical terms that replaced retired vocabulary and carry no UBB-owned
# value set of their own.
#
# READ THE NAME CAREFULLY: nothing in this file is retired. These are the
# SURVIVING names — the answer to "what replaced this word?" for the terms whose
# replacement is a tenant-owned set or a caller's own prose, and which therefore
# have no closed value set to hang beside. Every other retirement lives on the
# concept whose value set replaced it, in that concept's own domain file.
#
# #246 added the first BOOLEAN to this file, which stretches the category above:
# a switch's replacement is neither a tenant's set nor a caller's prose, it is
# two positions UBB owns outright. It is here because the alternative was worse
# — see `live_counter_maintenance_enabled` below, where the choice is argued in
# the open rather than settled by where the entry was filed.
#
# It exists as one file because the forbidden-term sweep (#206) reads the whole
# registry anyway, and a reviewer asking "is #154 §8's table accounted for?"
# should not have to reconstruct the answer from five domain files. The rest of
# §8's table is on `customer_billing_mode`, `tenant_posture`, `pricing_mode`,
# `rate_structure`, `pricing_status`, `usage_event_kind`,
# `pricing_receipt_subject_type`, `analytics_measure`, `analytics_grouping_kind`,
# `tenant_product`, `grouping_field_value`, `control_family`, `ceiling_status`,
# `reason_code`, `affordability_reason` and `webhook_event_type`.

measurement_key:
  kind: tenant_defined
  summary: >-
    The key a tenant gives one of its own declared measurable quantities. UBB
    owns the entity, its unit and its value type, and never enumerates the
    keys. The industry uses the retired word for the metered ENTITY rather than
    for the quantity inside it, so keeping it here would have guaranteed
    mis-translation at every integration boundary (#145 §10).
  retired_aliases:
    - metric
    - metric_name
    - usage_metrics
  retired_senses:
    # THE PLURAL OF `unit`, AND IT CANNOT BE A RETIRED ALIAS. Slice 2's own
    # ruling (#193 §F1) said to register it as one and "remove every occurrence
    # in the same commit, so the sweep finds zero and no ledger entry is
    # needed". That is not achievable, and the evidence is unusually clean.
    #
    # `retired_aliases` states something about itself — retired WHEREVER IT
    # APPEARS, as a whole token — which is simply false of this word. Four
    # unrelated senses carry it, and one of them cannot be removed by any
    # commit at all:
    #
    #   * THE RETIRED FIELD — the posting's own column for the metered
    #     quantity, its request and response fields, the summary query's sums,
    #     and the SDK and console code that read them. **DEAD as of #272**,
    #     which is what the count below just moved for. It died whatever this
    #     entry said; the entry only ever decided how the death was PROVED.
    #   * CURRENCY MINOR UNITS — `core/money.py`, the billing services, and the
    #     console's money inputs. That is `amount_representation`'s own
    #     English, and its values `minor_units` / `major_units_decimal` are not
    #     even sweep-visible, because `_` is an identifier character.
    #   * RATE ARITHMETIC — `Rate.compute`, and the console's "per 1K units".
    #     Slice 4 renames that to a quantity word; it is not this slice's.
    #   * ORDINARY ENGLISH INSIDE THREE GENERATED MODULES, and this row is
    #     fatal on its own. `core/vocabulary.py`, `ubb-sdk/ubb/vocabulary.py`
    #     and `apps/ui/src/lib/vocabulary.ts` are `@generated ... do not edit
    #     by hand`, and their text is rendered from concept SUMMARIES in this
    #     directory — `analytics_measure` ("rather than units of work") and
    #     `ceiling_basis` ("different units, so each ceiling field states its
    #     own basis"). The registry may spell the word freely while its own
    #     generated output may not, and the only commit that could remove it
    #     would reword the registry to dodge a gate.
    #
    # This is exactly the precedent case the schema records: a word retired in
    # one sense while alive in others "would force the sweep into exclusions
    # broad enough to disarm it", putting G22's zero out of reach by
    # construction. `retired_senses` is NOT sweep input, so there is no "sweep
    # finds zero" to reach here and no seeding authorisation to take.
    #
    # THE EVIDENCE WAS TAKEN FOR THIS ENTRY, following the `pricing_status`
    # precedent, which records its method because #206's did not. Measured over
    # the sweep's OWN swept set (`sweep.partition` under
    # `gates/forbidden-term-sweep.yaml`: 1,536 of 1,894 tracked files) with its
    # OWN token matcher (`sweep.pattern` — the token with a non-identifier
    # character required on each side). That is the measure which answers the
    # question actually being decided: what the gate would see if this word
    # were input. It also excludes this directory, so the file can record its
    # own number without changing it.
    #
    #     units    51 files, 127 occurrences
    #
    # THE COUNT HAS NOW MOVED, AND DOWNWARD IS THE ONE DIRECTION THAT NEEDS NO
    # INVESTIGATION. Four consecutive re-takes (#267, #269, #270, #271) moved
    # only the denominator and left `75 files, 325 occurrences` untouched, which
    # is what those re-takes existed to demonstrate. #272 executed the other
    # half of this ruling — the column and every named reader — and 24 files and
    # 198 occurrences left the tree with it (1,532/1,882 → 1,534/1,885 swept,
    # 75/325 → 51/127 counted). That is the retired sense being paid, not the
    # claim eroding, and it is the only reason this number may fall.
    #
    # THE RULE FOR THE NEXT READER IS UNCHANGED AND NOW HAS TWO HALVES. If the
    # count RISES, somebody WROTE the word — find it and read it before
    # rewriting the number, because rewriting it is how the sentence this entry
    # defends quietly stops being true. If it FALLS, a commit removed occurrences
    # of one of the surviving senses; say which sense and why, here. The
    # denominator moves on any commit that adds a tracked file and needs no
    # story at all.
    #
    # #273 MOVED THE DENOMINATOR ONLY (1,534 → 1,533 swept, 51/127 unchanged),
    # and it is worth recording that the denominator can fall as well as rise:
    # that commit added a migration (excluded from the swept set) and two test
    # modules, deleted one, and REGENERATED THE SDK — where two generated model
    # files existed only to type the bag it folded away. A denominator that
    # falls because generated files stopped being generated is still the "needs
    # no story" case; this note exists so the next reader does not go looking
    # for a deletion nobody made.
    #
    # #274 MOVED THE DENOMINATOR ONLY, UPWARD (1,533 → 1,534 swept, 1,885 →
    # 1,887 tracked, 51/127 unchanged) — the "needs no story" direction. It
    # renamed a DIFFERENT bag, the measured-quantity one, which is a retired
    # ALIAS of this concept and so left this sense untouched: the alias reached
    # zero and its four ledger entries went with it, while every occurrence
    # counted here is still one of the three surviving senses above. Recorded
    # because two adjacent numbers moving for unrelated reasons is exactly how a
    # reader talks themselves out of investigating the one that matters.
    #
    # #275 MOVED THE DENOMINATOR ONLY, UPWARD AGAIN (1,534 → 1,535 swept, 1,887
    # → 1,889 tracked, 51/127 unchanged) — one new test module in the swept set,
    # and that module plus one new migration in the tracked set. It renamed the
    # RATE's quantity name, another retired ALIAS of this concept, and the same
    # reasoning as #274 applies unchanged: the alias reached zero across the
    # backend bar one living document, four more ledger entries went with it, and
    # every occurrence counted here is still one of the three surviving senses
    # above. Worth one extra line, because #275 touched `Rate.compute(units)`'s
    # own module — the RATE ARITHMETIC sense, which slice 4 renames — and did NOT
    # touch that method or its parameter. An unchanged numerator is what says so.
    #
    # #276 MOVED THE DENOMINATOR ONLY, UPWARD AGAIN (1,535 → 1,536 swept, 1,889
    # → 1,894 tracked, 51/127 unchanged) — one new test module in the swept set,
    # and that module plus FOUR new migrations in the tracked set, which is the
    # largest single-commit denominator move this entry has recorded. Nothing
    # about this concept is in that commit at all: #276 widened the GROUPING
    # FIELD slots from six to ten and renamed their columns, a different concept
    # with a different registry entry. Recorded because the size of the jump is
    # the kind of thing a reader notices and misreads as erosion — four
    # migrations move the tracked count without moving the swept one, since the
    # migrations tree is a declared exclusion. The numerator is untouched, and
    # the RATE ARITHMETIC caution #275 raised applies here too: #276 changed
    # `Rate`'s selector columns and did not go near `compute(units)`.
    #
    # AND #272 ITSELF SPELLS THE WORD IN THREE PLACES, DELIBERATELY, WHICH IS
    # WHY THE FALL IS 24 FILES AND NOT 25. Two are the targeted proof named
    # below — a contract module and a migration test — and they name the retired
    # sense as the subject of its own absence. The third is the endpoint test
    # that pins what the retirement COSTS: a stale client still posting the
    # field is accepted rather than refused, because the request schema ignores
    # unknown fields, and under strict cost coverage that turns a 422 into a
    # 200. All three are quotation, not a fifth sense. A test that proves a word
    # is gone must be allowed to say the word; the alternative is sourcing the
    # token from this registry at runtime, which reads as cleverness and hides
    # what the test is about.
    #
    # OUTCOME: SENSE, NOT ALIAS. Every residual occurrence was read and every
    # one falls in a surviving sense above; there is no fifth. The column and
    # every reader of it died in this slice — that half of the ruling was never
    # in doubt — but the deletion is proved by a targeted test rather than by
    # the sweep, because the sweep can never reach zero on this word.
    - term: units
      retired_as: >-
        the posting's own field for the metered quantity — dropped, with every
        reader, in #272. One nameless integer per posting could only ever
        describe one thing, which is what made an event carrying both input and
        output amounts inexpressible; a declared Measurement replaces it, keyed
        by this concept and carrying its own `unit`.
      survives_as: >-
        three live senses UBB depends on. Currency MINOR units, which is
        `amount_representation`'s own English in the money module, the billing
        services and every console money input. Rate arithmetic — `Rate.compute`
        and the console's "per 1K units" — which slice 4 renames to a quantity
        word. And ordinary English inside three GENERATED vocabulary modules,
        whose text is rendered from concept summaries in this directory: that
        one is unremovable by any commit, since the registry may spell the word
        freely and its generated output may not be hand-edited.
  consumers:
    - surface: backend
      path: ubb-platform/apps/metering/usage/models.py
    - surface: openapi
      path: openapi/v1.json

metadata_key:
  kind: tenant_defined
  summary: >-
    A key in the one open bag a tenant may attach to a record. Filterable,
    never groupable — grouping is what declared Grouping Fields are for, and
    the bag exists precisely because not everything a caller wants to keep
    should become an analytics axis with a cardinality bound.
  retired_aliases:
    # A second open bag whose name implied the grouping capability the first one
    # deliberately does not have. It retires with that capability (#145 §8).
    - tags
  consumers:
    - surface: backend
      path: ubb-platform/apps/metering/usage/models.py
    - surface: openapi
      path: openapi/v1.json

pricing_book_name:
  kind: free_text
  summary: >-
    The display name a tenant gives a book of pricing rules. Prose a human
    typed. The record it names replaced an entity that carried supplier cost
    and customer price in one table discriminated by a column, which is the
    conflation the cost/price split exists to end (#138, #148 §5.4).
  retired_aliases:
    - card_type
    - cost_card
    - price_card
    - rate_card
  consumers:
    - surface: backend
      path: ubb-platform/apps/metering/pricing/models.py
    - surface: openapi
      path: openapi/v1.json

live_counter_maintenance_enabled:
  kind: free_text
  summary: >-
    The per-tenant switch selecting WHEN the live spend counters are
    maintained: ON debits them synchronously on the recording path and checks
    the crossing there, so the ack itself carries the stop verdict; OFF does no
    counter work at record time and the durable drawdown detects instead, at
    its own latency. It was named for the arrival-time ingest lane. Slice 1
    (#192) deleted that lane and kept the switch, because it never was the
    lane's switch — it also gates both reconciles' counter legs and the upward
    repair, none of which is arrival-shaped, and the conflation cost a whole
    ticket (#233) to unpick when `repair.py` was read under the wrong meaning.
    Renamed by #246 while the pre-live contract window was still open
    (ADR-0007 §5), because after platform admission the same word costs a
    90-day deprecation cycle.
  # `kind: free_text` is a DELIBERATE STRETCH and the first boolean in the
  # registry — no other boolean field is registered here (not
  # `automatic_tax_enabled`, not `require_cost_card_coverage`). None of
  # schema.yaml's four kinds is built for one: `closed` and `open` both demand
  # a value set plus a `label_key_prefix`, and `tenant_defined` is for values
  # the tenant owns. `free_text`'s own summary — "Not vocabulary. Recorded here
  # so that 'is this a value set?' is answered once, in data" — describes a
  # boolean exactly; only its NAME misfits. A fifth kind was the alternative,
  # and it was not taken for one entry. If a second boolean ever needs
  # registering, mint the kind then and move this with it.
  retired_aliases:
    # Three spellings, not one. The sweep matches the token as spelled with a
    # non-identifier character required on each side, and `_` IS an identifier
    # character — so `arrival_signals` does not match inside
    # `arrival_signals_enabled`, and each live spelling needs its own entry.
    - arrival_signals
    - arrival_signals_enabled
    - arrival_signals_on
  retired_senses:
    - term: arrival
      retired_as: >-
        a name for real-time spend detection or for the switch that governs
        it. The arrival-time ingest lane it referred to was deleted in slice 1
        (#192) and there is now exactly one recording path.
      survives_as: >-
        the analytics time basis — `basis="arrival"` windows on `created_at`
        (when UBB received the event) as against `effective` (when it
        happened). `apps/metering/CONTEXT.md` keeps that distinction, and the
        drawdown repair and platform-fee windows both depend on it.
  consumers:
    - surface: backend
      path: ubb-platform/apps/platform/tenants/models.py
    - surface: openapi
      path: openapi/v1.json
    - surface: sdk
      path: ubb-sdk/ubb/_core/models/tenant_config_out.py
    - surface: console
      path: apps/ui/src/features/settings/components/spend-control-card.tsx

idempotency_key:
  kind: free_text
  summary: >-
    The caller's key for making a retried write safe. Opaque to UBB beyond its
    length bound, and the only caller-supplied correlation value on the
    recording path — which is what made the second one removable: it had no
    uniqueness constraint, no lookup, no filter and no read that changed any
    behaviour, while carrying an index write on the hottest path in the system
    (#179 §4).
  retired_aliases:
    - request_id
  consumers:
    - surface: backend
      path: ubb-platform/apps/metering/usage/models.py
    - surface: sdk
      path: ubb-sdk/ubb/metering.py
    - surface: openapi
      path: openapi/v1.json
