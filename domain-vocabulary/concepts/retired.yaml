    # both were console-only edits that added no file at all.
    #
    # AND #275'S RATE ARITHMETIC CAUTION IS THE ONE THAT EARNED ITS KEEP HERE.
    # This commit renders a per-posting measurement panel, so it works squarely
    # inside the sense #272 retired — and it still writes the word nowhere,
    # because a Measurement is keyed by `measurement_key` and carries its own
    # `unit`. The numerator staying flat across a commit that touches this
    # subject is the strongest reading the entry has had since #272 paid it.
    #
    # #284 IS THE THIRD CASE, AND THE FIRST TIME THE NUMERATOR HAS FALLEN
    # WITHOUT A WORD LEAVING THE TREE (1,546 → 1,533 swept, 1,904 tracked
    # unchanged, 51/127 → 50/126 counted). Nothing was deleted and nothing was
    # rewritten. That ticket widened the frozen-documents exclusion over
    # `docs/prototypes/`, and one of the twelve files it took out of the swept
    # set — the 2026-08-04 code-builder output notes — spells the word once.
    # THE SIGNATURE IS THE MOVED EXCLUSION COUNT, in that commit's diff:
    # `frozen-dated-documents` went 121 -> 133. The tracked total holding still
