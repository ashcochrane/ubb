    # that deleted twelve files would move both.
    #
    # THE OCCURRENCE WAS READ BEFORE THE NUMBER WAS REWRITTEN, which is the
    # whole discipline of this block. It is one line of an inventory of what the
    # 2026-08-04 SDK carried — "`record_usage` … carries `tags`, `dimensions`,
