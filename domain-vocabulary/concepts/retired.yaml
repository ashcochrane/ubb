    # #275's RATE ARITHMETIC caution holds — nothing goes near `compute(units)`.
    #
    # #320 MOVED THE DENOMINATOR ONLY, UPWARD (1,542 → 1,544 swept, 1,916 →
    # 1,918 tracked, 50/126 unchanged) — the "needs no story" direction, and the
    # simplest shape it takes: TWO NEW FILES, BOTH SWEPT, NO MIGRATION and no
