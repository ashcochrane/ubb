    # tenant-level markup record is deleted with its five routes, its two
    # component schemas and both of its audit action names, and the plan
    # catalog's two markup columns go with it.
    #
    # THE ARITHMETIC, COUNTED OFF `git diff --name-status` RATHER THAN FROM
    # MEMORY. FOUR files arrive: two migrations, both EXCLUDED — so they lift
    # tracked without lifting swept — and two swept test modules, the two halves
    # of the claim that the deleted acts really ceased (the refusal, which
    # DERIVES the retired noun from the deleting migration's own from-state, and
    # the router walk, which spells nothing because it asks what is not served).
    # ELEVEN leave, all swept: seven generated (five endpoint modules for the
    # five deleted routes, and the two model modules for the two deleted
    # component schemas), and four hand-written — the pricing app's admin
    # module, which registered the deleted record and nothing else; that
    # record's own model test module; the plans app's markup-cache invalidation
    # module, whose subject was hooks this commit deletes because no plan fact
    # reaches a resolved markup any more; and the console's customer pricing
    # tab, whose last card was the markup override. Swept 1,659 + 2 - 11 =
    # 1,650; excluded 397 + 2 = 399; tracked 1,650 + 399 = 2,049.
    #
    # ⚠ **NEITHER NEW MODULE GREW AN ALLOWLIST OR MOVED A LEDGER ENTRY**, which
    # is the whole point of the derivation: admitting a file to the sweep's
    # *checks-whose-subject-is-a-retired-word* rule would have grown a PERMANENT
    # exclusion (still 14), on the very commit that takes those words to zero.
    #
    # ⚠ THE NUMERATOR HELD THROUGH A COMMIT THAT REWROTE PROSE IN THIRTY-ODD
    # FILES, INCLUDING THE CONSOLE HALF — which is where #367 lost a file it had
    # recorded as unchanged, because the numbers were taken after the backend.
    # They were taken here after the console, after the SDK regeneration and
    # after `git add`, which is the other half of the same discipline: the
    # denominator counts GIT-TRACKED files, so an untracked new file makes a
    # local green precede a red CI.
    #
    # #370 MOVED THE DENOMINATORS UP BY THREE AND FOUR AND LEFT THE NUMERATOR
    # EXACTLY WHERE IT WAS (1,650 -> 1,653 swept, 2,049 -> 2,053 tracked,
    # `units` unchanged at 50 files / 125 occurrences), WITH THE EXCLUSION UP BY
    # ONE (`historical-migrations` 232 -> 233). The receipt's stored column and
    # its wire key take the ratified name of the record they hold, and the
    # retired spelling reaches zero on all four surfaces at once.
    #
    # THE ARITHMETIC, COUNTED OFF `git diff --name-status` RATHER THAN FROM
    # MEMORY. SIX files arrive: one migration, EXCLUDED — so it lifts tracked
    # without lifting swept — one swept test module over the rename itself, and
    # four swept GENERATED SDK core modules. Two of those four are the receipt
    # containers under the new property name and are the other half of two
    # RENAMES (the modules under the old name leave, so those two net to
    # nothing); the other two are the enum modules the generator mints when a
    # closed concept is newly advertised, ONE PER SCHEMA CARRYING IT, and two
    # schemas carry the subject type. TWO files leave, both those renamed
    # generated containers. One further file is renamed with no net effect
    # at all (`api/v1/tests/test_record_usage_provenance.py` ->
    # `test_record_usage_receipt.py`, because a module named for the record's
    # retired spelling would have been the second public name ADR-0006 §2
    # refuses). Swept 1,650 + 5 - 2 = 1,653; excluded 399 + 1 = 400; tracked
    # 1,653 + 400 = 2,053.
    #
    # ⚠ **THE NEW TEST MODULE NAMES THE RETIRED WORD NOWHERE AND TOOK NO
    # ALLOWLIST SEAT.** It DERIVES the retired spelling from the rename
    # operation's own `old_name`, which is #369's technique and slice 2's before
    # it. Admitting it to the sweep's *checks-whose-subject-is-a-retired-word*
    # rule would have grown a PERMANENT exclusion (still 14) on the very commit
    # that takes the word to zero.
    #
    # ⚠ THE NUMERATOR HELD THROUGH THE COMMIT THAT WAS MOST LIKELY TO MOVE IT,
    # and the reason is a ruling rather than luck. This slice's own tripwire
    # schedule predicted that the receipt's per-quantity key — spelled with the
    # retired plural — would be renamed here. #366 ruled otherwise and wrote the
    # argument at `pricing_service._component`: that word is a retired SENSE
    # rather than a retired term, it is not sweep input, it holds no ledger seat
    # and no slice-4 entry counts it, so re-spelling it would be a change to the
    # shape of a stored record with no ticket behind it — and it would move this
    # very block for a word this slice does not own. The prediction was wrong
    # about the commit, not about the mechanism, and the key still stands.
    #
    # Taken after the console half, after the SDK core regeneration and after
    # `git add`, for the reason #369's paragraph gives.
    #
    # #371 MOVED BOTH DENOMINATORS UP BY SIX AND LEFT THE NUMERATOR EXACTLY
    # WHERE IT WAS (1,653 -> 1,659 swept, 2,053 -> 2,059 tracked, `units`
    # unchanged at 50 files / 125 occurrences), WITH THE EXCLUSION UNCHANGED AT
    # 400. The cleanest arithmetic this block has recorded: SIX files arrive,
    # all six swept, none excluded, and none leave. No migration, so the two
    # denominators move by the same six. The commit is console-only —
    # `lib/customer-price.ts` and its test, the fixture-reachability test,
    # `features/pricing/lib/rates.ts`, and two rendering tests that assemble
    # their own payloads — and it touches no backend module at all, which is
    # why a numerator counted over rate arithmetic and currency minor units
    # could not have moved.
    #
    # ⚠ THE PROCEDURAL LESSON THIS ENTRY EXISTS TO CARRY, AND IT COST A REAL
    # REVIEW CYCLE. The sweep reads `git ls-files`, so an UNTRACKED file is
    # INVISIBLE to it — and to this test. #371's first commit ran both gates
    # green while five of its six new modules were still untracked, and one of
    # them spelled `request_id`, whose console ledger entry counts six files and
    # is a ceiling on SPREAD. Staging the commit turned both gates red at once:
    # the sweep on the seventh file, this test on the denominator. **Run
    # `git add` BEFORE the sweep and before this suite, not after** — #369's and
    # #370's paragraphs both say so and both were read as bookkeeping advice
    # rather than as the load-bearing instruction they are.
    #
    # ⚠ NO NEW TEST MODULE NAMES A RETIRED WORD AND NONE TOOK AN ALLOWLIST SEAT
    # (still 14). The `request_id` occurrence was removed by Phase B's SECOND
    # technique — the word stays once in `features/events/api/mock-data.ts`,
    # which already carried it, behind a `correlationIds` helper the rendering
    # test calls instead of spelling the key. Deriving it from a rename
    # operation was not available here: nothing in this commit renames it, and
    # it is slice 5's word rather than this slice's.
    #
    # #372 MOVED BOTH DENOMINATORS UP BY FIFTEEN AND THE NUMERATOR UP BY TWO
    # FILES AND EIGHT OCCURRENCES (1,659 -> 1,674 swept, 2,059 -> 2,074
    # tracked, 50/125 -> 52/133 counted), WITH THE EXCLUSION UNCHANGED AT 400.
    # Sixteen files arrive and one leaves, all console: the pricing feature is
    # rebuilt around books, rules, publishes, drafts and diffs.
    #
    # ⚠ THE NUMERATOR MOVED FOR THE FIRST TIME IN FIVE RE-TAKES, AND UPWARD, SO
    # IT IS ACCOUNTED FOR FILE BY FILE RATHER THAN ASSERTED TO BE FINE. Exactly
    # two files gained the word and both are new:
    #
    #     features/pricing/components/rule-editor.tsx    6
    #     features/events/lib/receipt.ts                 2
    #
    # BOTH ARE THE RATE-ARITHMETIC SENSE `survives_as` ALREADY NAMES, and
    # neither is a reader of the retired column. The editor's six are the
    # console's "per 1K units" wording one screen over from where
    # `pricing-math.ts` already carries ten of them — a denominator picker, a
    # worked example and a validation message. The receipt module's two are the
    # per-quantity component key, which #366 ruled stays.
    #
    # ⚠ AND THE SECOND FILE EXISTS BECAUSE OF A GATE, WHICH IS WORTH RECORDING
    # RATHER THAN LEAVING TO BE REDISCOVERED. `features/events/api/mock-data.ts`
    # is a NAMED READER in `test_the_inline_unit_total_is_gone.py`, which
    # forbids the word there outright — comments included — and says in its own
    # docstring that every other file is free to say it. This commit rebuilds
    # that fixture's Pricing Receipt into the record's real sectioned shape,
    # components and all, so the component's key had to land SOMEWHERE. It
    # landed in a module of its own, once, with the fixture calling a builder
    # that takes `quantity` — the name the engine's own `_component` takes. That
    # is Phase B's second technique, and the same trade `correlationIds` in that
    # file already makes for `request_id`.
    #
    # ⚠ ONE MORE COUNT MOVED IN THIS COMMIT AND IT IS NOT THIS ONE. `dimensions`
    # is a retired TERM with a console ledger entry, and reading the tenant's
    # grouping-field registry off the wire would have put it in four more files.
    # It is unwrapped once in `features/pricing/api/api.ts` and the entry stays
    # at four files, one of them moved. Recorded here because the two questions
    # look identical from a distance and are answered differently: a retired
    # SENSE has no ledger seat and is measured by this block, a retired TERM has
    # one and is measured by the sweep.
    #
    # #374 MOVED BOTH DENOMINATORS UP BY THREE AND LEFT `52 files, 133
    # occurrences` EXACTLY WHERE #372 PUT THEM (1,674 -> 1,677 swept, 2,074 ->
    # 2,077 tracked), WITH THE EXCLUSION UNCHANGED AT 400. Three files arrive
    # and none leaves: two ADRs and the check that holds their proof tables
    # honest. Denominator-only and upward is the direction the four re-takes
    # above already established as needing no investigation — the ratchet
    # commit adds documents and a test, and a document about a retired word is
    # not a reader of one.
    #
    # ⚠ WORTH RECORDING BECAUSE IT NEARLY WENT THE OTHER WAY. This commit's own
    # prose describes the rate's arithmetic shape and the per-unit rung
    # repeatedly, which is the sense `survives_as` names — so an ADR arguing
    # about pricing was the obvious place for the numerator to creep. It says
    # "an amount for each unit of quantity" nowhere: ADR-0009 is about WHEN a
    # price takes effect and ADR-0010 about what a recovery is worth, and
    # neither had to reach for the arithmetic. That is the count behaving as a
    # ceiling on SPREAD rather than only on what is left to fix, which is the
    # rule now written into `docs/conventions/coding-standards.md`.
    #
    # #407 MOVED BOTH DENOMINATORS UP AND THE NUMERATOR DOWN BY A WHOLE FILE
    # (1,677 -> 1,679 swept, 2,077 -> 2,080 tracked, `units` 52 -> 51 files and
    # 133 -> 132 occurrences), WITH THE EXCLUSION UP BY ONE
    # (`historical-migrations` 233 -> 234). Three files
    # arrive and none leaves: the migration that collapses a unit of work's two
    # type columns into one, which is EXCLUDED and so lifts tracked without
    # lifting swept, and the two generated SDK enum modules minted by the kind
    # discriminator becoming an advertised closed concept — one per schema
    # carrying it, which is the per-node arithmetic #355 recorded.
    #
    # ⚠ THE NUMERATOR ROSE TO 54 FILES / 135 OCCURRENCES AND WAS PUT BACK, AND
    # THE RISE WAS THIS COMMIT'S OWN PROSE. The three-case rule above asks for
    # an account of a rise, and the honest account is that the writer wrote the
    # word: two test docstrings and a migration docstring reached for "units of
    # work" and "contained units" while describing exactly the subject this
    # slice is about. That is #328's lesson verbatim — ordinary English about
    # work, nowhere near money or rate arithmetic, so no amount of care about
    # the three surviving senses would have caught it. The repair was to say
    # "each whole unit of work" and "contained work" and re-measure; the number
    # recorded here is the one the tree gave AFTER that, not the one it gave
    # first. The migration's occurrence would not have counted in any case —
    # migrations are excluded — and it was rewritten anyway, because a rule
    # kept only where a gate can see it is not a rule.
    #
    # ⚠ AND THEN THE REVIEW PASS TOOK ONE OUT, WHICH IS THE SECOND CASE OF THE
    # THREE AND OWES AN ACCOUNT OF WHICH SENSE LEFT. The file is
    # `apps/platform/work/queries.py` and the occurrence was its rollup
    # docstring's *"Top-level units only, so run_count counts JOBS not steps"*.
    # ⚠ THAT WAS NOT ONE OF THE THREE SURVIVING SENSES — not currency minor
    # units, not rate arithmetic, not generated registry text. It was the same
    # ordinary-English-about-work use this commit had just had to repair in its
    # own new prose, sitting one paragraph above it in a docstring the commit
    # was editing anyway; review found the sentence because the commit
    # falsified its other half (it describes one altitude and the function
    # answers about two). So the word left as a side effect of correcting a
    # claim, not as a payment of the sense — the sense is exactly as alive as
    # it was, and a later reader should not read this fall as progress toward
    # zero. #372's console fall is the precedent for a whole file leaving; this
    # one is smaller and needs the distinction stated, because a numerator that
    # falls for two unrelated reasons looks from the number alone like one.
    #
    # #408 MOVED BOTH DENOMINATORS UP AND THE NUMERATOR DOWN BY A WHOLE FILE
    # AGAIN (1,679 -> 1,683 swept, 2,080 -> 2,085 tracked, `units` 51 -> 50
    # files and 132 -> 131 occurrences), WITH THE EXCLUSION UP BY ONE
    # (`historical-migrations` 234 -> 235). Five files arrive and none leaves:
    # the migration that widens a unit of work's declared state set, which is
    # EXCLUDED and so lifts tracked without lifting swept; the test module that
    # holds the two invariants; and three generated SDK enum modules minted by
    # the state set becoming an advertised closed concept — one per schema
    # carrying it, which is #355's per-node arithmetic and #407's own reading
    # of it, one schema larger because a unit's state appears on the close
    # answer as well as on the listing row and the detail view.
    #
    # ⚠ THE FALL IS THE SAME SHAPE AS #407's AND FOR THE SAME REASON, WHICH IS
    # WORTH SAYING RATHER THAN LETTING TWO IN A ROW LOOK LIKE A TREND. The file
    # is `apps/platform/work/models.py` and the occurrence was the announcement
    # column's *"and on completed/failed units (nothing to announce)"*. That
    # was not one of the three surviving senses either — it is the same
    # ordinary-English-about-work use — and it left because this commit
    # FALSIFIED the sentence carrying it: there are five terminal states now,
    # not two, and the set that announces is `killed` and `expired` rather than
    # the set that does not. Rewriting a claim the ticket had made untrue is
    # what removed the word; nobody went looking for it. The sense is exactly
    # as alive as it was, and two consecutive falls arriving this way are two
    # accidents rather than progress.
    #
    # #409 MOVED BOTH DENOMINATORS UP AND THE NUMERATOR DOWN BY FIVE FILES
    # (1,683 -> 1,691 swept, 2,085 -> 2,094 tracked, `units` 50 -> 45 files and
    # 131 -> 123 occurrences), WITH THE EXCLUSION UP BY ONE
    # (`historical-migrations` 235 -> 236). It is the largest numerator fall
    # since #272, and it is the SMALLEST cause this entry has recorded.
    #
    # ⚠ ALL EIGHT OCCURRENCES ARE ONE SENTENCE, PROPAGATED. The `list_tasks`
    # docstring read *"Top-level units of work with their materialized cost
    # rollups"*, and this commit moved that route to the root prefix and
    # rewrote the line as *"Top-level work"*. That one edit reached five files
    # because four of them are downstream of it by machine: the source
    # docstring in the composition layer, its exported `description` in
    # `openapi/v1.json`, the console's committed copy of that document, the
    # test module quoting it — and the generated SDK operation module, which
    # held it FOUR times, once per sync/async variant. The replacement modules
    # generated beside them carry the new wording and so gained nothing back.
    #
    # ⚠ THIS IS THE SECOND CASE OF THE THREE ABOVE, NOT THE THIRD, AND THE
    # MOVED EXCLUSION COUNT IS WHY THAT NEEDS SAYING. The rule says the two are
    # told apart by whether an exclusion count moved — and one did. It moved
    # for the migration this commit adds, which contains the word nowhere: a
    # file ARRIVING in an excluded directory lifts tracked without lifting
    # swept and takes no occurrence out of the swept set with it. No
    # units-bearing file left the swept set, and no exclusion rule widened over
    # one. The occurrences left the tree.
    #
    # ⚠ AND IT IS THE THIRD CONSECUTIVE FALL OF THE SAME KIND, which by now is
    # worth naming as a pattern rather than as three accidents. The sense
    # removed was the ordinary-English-about-work one again — never one of the
    # three surviving senses — and it left because the commit was rewriting the
    # sentence carrying it for an unrelated reason. #407's fall came from a
    # docstring the commit had falsified, #408's from a column comment the
    # commit had falsified, and this one from a route description the commit
    # was moving. THE PATTERN IS THAT THIS SLICE'S SUBJECT IS UNITS OF WORK, so
    # every prose it touches is prose that reaches for the word. None of the
    # three is progress toward zero, the sense is exactly as alive as it was,
    # and a reader watching only the number would conclude the opposite three
    # times running.
    #
    # ⚠ AND THE NUMERATOR ROSE TO 52 FILES / 134 OCCURRENCES FIRST, WHICH IS
    # #407's WARNING LANDING ON THE VERY NEXT TICKET. Three occurrences across
    # two files, all of them this commit's own new prose: two sweeper
    # docstrings reaching for "EXPIRE units that…" / "stale active units", and
    # the patrol's re-mint reaching for "stopped units". Every one is ordinary
    # English about work, nowhere near money or rate arithmetic, so care about
    # the three surviving senses would not have caught any of them — the only
    # thing that did was measuring. The repair was "anything still active",
    # "stale active work" and "a stopped unit", and the figures recorded above
    # are the ones the tree gave after it.
    #
    # #410 MOVED BOTH DENOMINATORS UP AND LEFT THE NUMERATOR EXACTLY WHERE IT
    # WAS (1,691 -> 1,696 swept, 2,094 -> 2,100 tracked, `units` UNMOVED at 45
    # files and 123 occurrences), WITH THE EXCLUSION UP BY ONE
    # (`historical-migrations` 236 -> 237). Five swept files arrived — a test
    # module, a renamed one, two generated SDK models and a generated SDK
    # operation — and the sixth tracked file is the migration, which is
    # excluded and so lifts tracked alone.
    #
    # ⚠ IT ROSE BY A WHOLE FILE FIRST, AND THE FILE WAS NOT ONE THIS ENTRY HAS
    # SEEN BEFORE. `risk_service.py` gained *"the number of ACTIVE units for
    # the billing owner"* — a sentence this commit MOVED rather than wrote,
    # lifted verbatim out of an inline comment in the call it was splitting and
    # into the new method's docstring. That is a fourth way for the numerator
    # to move and the only one the three cases above do not name: the word
    # travelled with a paragraph that was being relocated, so nobody reached
    # for it and nobody had a reason to re-read it. The repair was *"how much
    # work is ACTIVE"*, and the figures recorded above are the ones the tree
    # gave after it. **Re-measure after moving prose, not only after writing
    # it.**
    #
    # ⚠ AND THE FOUR-IN-A-ROW PATTERN #409 NAMED HAS BROKEN, WHICH IS WORTH
    # SAYING BECAUSE THE BREAK IS THE EVIDENCE THE PATTERN WAS REAL. #407, #408
    # and #409 each fell because the commit was rewriting a sentence that
    # happened to carry the word; this commit rewrote a whole route surface,
    # deleted a creation path and added a test module about registering work,
    # and the count did not move at all. The sense is exactly as alive as it
    # was, and that is what an unmoved numerator across a large slice-5 commit
    # means.

    - term: units
      retired_as: >-
        the posting's own field for the metered quantity — dropped, with every
        reader, in #272. One nameless integer per posting could only ever
        describe one thing, which is what made an event carrying both input and
        output amounts inexpressible; a declared Measurement replaces it, keyed
        by this concept and carrying its own `unit`.
      survives_as: >-
        three live senses UBB depends on. Currency MINOR units, which is
        `amount_representation`'s own English in the money module, the billing
        services and every console money input. Rate arithmetic — `Rate.compute`,
        the receipt's per-quantity component key, and the console's "per 1K
        units" — which slice 4 was expected to rename to a quantity word and
        does NOT: #366 ruled the key stays and #370 confirmed it, because this
        is a retired SENSE with no ledger seat and no slice-4 entry counting it,
        so re-spelling it would move this block for a word no ticket owns. The
        rename belongs to whichever slice takes the sense itself.
        And ordinary English inside three GENERATED vocabulary modules,
        whose text is rendered from concept summaries in this directory: that
        one is unremovable by any commit, since the registry may spell the word
        freely and its generated output may not be hand-edited.
  consumers:
    - surface: backend
      path: ubb-platform/apps/metering/usage/models.py
    - surface: openapi
      path: openapi/v1.json

metadata_key:
  kind: tenant_defined
  summary: >-
    A key in the one open bag a tenant may attach to a record. Filterable,
    never groupable — grouping is what declared Grouping Fields are for, and
    the bag exists precisely because not everything a caller wants to keep
    should become an analytics axis with a cardinality bound.
  retired_aliases:
    # A second open bag whose name implied the grouping capability the first one
    # deliberately does not have. It retires with that capability (#145 §8).
    - tags
  consumers:
    - surface: backend
      path: ubb-platform/apps/metering/usage/models.py
    - surface: openapi
      path: openapi/v1.json

pricing_book_name:
  kind: free_text
  summary: >-
    The display name a tenant gives a book of pricing rules. Prose a human
    typed. The record it names replaced an entity that carried supplier cost
    and customer price in one table discriminated by a column, which is the
    conflation the cost/price split exists to end (#138, #148 §5.4).
  retired_aliases:
    - card_type
    - cost_card
    - price_card
    - rate_card
  consumers:
    - surface: backend
      path: ubb-platform/apps/metering/pricing/models.py
    - surface: openapi
      path: openapi/v1.json

live_counter_maintenance_enabled:
  kind: free_text
  summary: >-
    The per-tenant switch selecting WHEN the live spend counters are
    maintained: ON debits them synchronously on the recording path and checks
    the crossing there, so the ack itself carries the stop verdict; OFF does no
    counter work at record time and the durable drawdown detects instead, at
    its own latency. It was named for the arrival-time ingest lane. Slice 1
    (#192) deleted that lane and kept the switch, because it never was the
    lane's switch — it also gates both reconciles' counter legs and the upward
    repair, none of which is arrival-shaped, and the conflation cost a whole
    ticket (#233) to unpick when `repair.py` was read under the wrong meaning.
    Renamed by #246 while the pre-live contract window was still open
    (ADR-0007 §5), because after platform admission the same word costs a
    90-day deprecation cycle.
  # `kind: free_text` is a DELIBERATE STRETCH and the first boolean in the
  # registry — no other boolean field is registered here (not
  # `automatic_tax_enabled`, not `is_active`). None of
  # schema.yaml's four kinds is built for one: `closed` and `open` both demand
  # a value set plus a `label_key_prefix`, and `tenant_defined` is for values
  # the tenant owns. `free_text`'s own summary — "Not vocabulary. Recorded here
  # so that 'is this a value set?' is answered once, in data" — describes a
  # boolean exactly; only its NAME misfits. A fifth kind was the alternative,
  # and it was not taken for one entry. If a second boolean ever needs
  # registering, mint the kind then and move this with it.
  retired_aliases:
    # Three spellings, not one. The sweep matches the token as spelled with a
    # non-identifier character required on each side, and `_` IS an identifier
    # character — so `arrival_signals` does not match inside
    # `arrival_signals_enabled`, and each live spelling needs its own entry.
    - arrival_signals
    - arrival_signals_enabled
    - arrival_signals_on
  retired_senses:
    - term: arrival
      retired_as: >-
        a name for real-time spend detection or for the switch that governs
        it. The arrival-time ingest lane it referred to was deleted in slice 1
        (#192) and there is now exactly one recording path.
      survives_as: >-
        the analytics time basis — `basis="arrival"` windows on `created_at`
        (when UBB received the event) as against `effective` (when it
        happened). `apps/metering/CONTEXT.md` keeps that distinction, and the
        drawdown repair and platform-fee windows both depend on it.
  consumers:
    - surface: backend
      path: ubb-platform/apps/platform/tenants/models.py
    - surface: openapi
      path: openapi/v1.json
    - surface: sdk
      path: ubb-sdk/ubb/_core/models/tenant_config_out.py
    - surface: console
      path: apps/ui/src/features/settings/components/spend-control-card.tsx

idempotency_key:
  kind: free_text
  summary: >-
    The caller's key for making a retried write safe. Opaque to UBB beyond its
    length bound, and the only caller-supplied correlation value on the
    recording path — which is what made the second one removable: it had no
    uniqueness constraint, no lookup, no filter and no read that changed any
    behaviour, while carrying an index write on the hottest path in the system
    (#179 §4).
  retired_aliases:
    - request_id
  consumers:
    - surface: backend
      path: ubb-platform/apps/metering/usage/models.py
    - surface: sdk
      path: ubb-sdk/ubb/metering.py
    - surface: openapi
      path: openapi/v1.json
