# Task vocabulary: the unit of work, what state it ended in, who said so, and
# what the generated integration code does when UBB says stop.
#
# COMPLETE END-STATE (#202). A Task is the top-level unit of work and a Subtask
# is the same record with a parent, so there is one model and one status set
# here rather than two of each (ADR-0006, #154 §3.1).

task_status:
  kind: closed
  summary: >-
    The durable state a Task or Subtask is in. `active` is the only
    non-terminal one. The three the tenant declares are reachable only by an
    explicit close; the two UBB writes are reachable only by UBB — `killed`
    means UBB stopped it on a spend signal and nothing else, and `expired`
    means nobody ever told UBB how it ended.
  values:
    - active
    - completed
    - failed
    - cancelled
    - killed
    - expired
  label_key_prefix: task_status
  consumers:
    - surface: backend
      path: ubb-platform/apps/platform/work/models.py
    - surface: console
      path: apps/ui/src/lib/labels.ts
    - surface: sdk
      path: ubb-sdk/ubb/metering.py
    - surface: openapi
      path: openapi/v1.json

task_outcome:
  kind: closed
  summary: >-
    What the tenant declares when it closes a Task, and the only thing that
    decides whether a Charge fires. It is a separate concept from the resulting
    status because the caller declares an outcome and UBB records a state: a
    Task UBB already stopped does not become `delivered` because a worker said
    so late.
  values:
    - delivered
    - failed
    - cancelled
  label_key_prefix: task_outcome
  consumers:
    - surface: backend
      path: ubb-platform/apps/platform/work/services.py
    - surface: sdk
      path: ubb-sdk/ubb/metering.py
    - surface: openapi
      path: openapi/v1.json

task_type_kind:
  kind: closed
  summary: >-
    Which level a declared Task kind may be used at. It survives the collapse
    of the two type columns into one because it is what lets a declaration be
    refused at declaration time rather than at use — a kind meant for contained
    work cannot be declared with a whole-Task pricing regime.
  values:
    - task
    - subtask
  label_key_prefix: task_type_kind
  retired_senses:
    - term: job
      retired_as: >-
        a prose synonym for a Task. Put and declined in #154 §3.1: it reads as a
        queue execution or a worker attempt, which is the infrastructure sense,
        not the tenant's unit of work.
      survives_as: >-
        a CI job. The gate manifest's `enforced_by` names one, and every
        workflow step runs inside one.
    - term: step
      retired_as: >-
        a prose synonym for a Subtask. Declined with `job` in #154 §3.1: it
        implies a strictly sequential workflow stage, which contained work is
        not.
      survives_as: >-
        a CI step, which is what an `installed` gate names beside its job.
  consumers:
    - surface: backend
      path: ubb-platform/apps/platform/work/models.py
    - surface: openapi
      path: openapi/v1.json

trigger_source:
  kind: open
  summary: >-
    The mechanism that applied a transition — which is a different question
    from the business cause, and both travel as structured fields so a webhook
    never has to carry either in its name (ADR-0006 §5). Open because the set
    grows whenever UBB adds an enforcement path, and a consumer must accept one
    it has not seen rather than reject the event carrying it.
  known_values:
    - usage_ingest
    - enforcement_patrol
    - parent_cascade
    - pool_crossing
    - stale_reaper
  allow_unknown: true
  label_key_prefix: trigger_source
  consumers:
    - surface: backend
      path: ubb-platform/apps/platform/work/reasons.py
    - surface: console
      path: apps/ui/src/lib/labels.ts
    - surface: openapi
      path: openapi/v1.json

stop_behavior:
  kind: closed
  summary: >-
    What the generated integration wrapper does when UBB signals a spend stop.
    The default raises, and the signal derives from `BaseException` so a
    tenant's own broad handler cannot swallow it; `return` is available for
    callers who deliberately want to inspect the signal in line, and the
    generated code says which one it selected (#179 §1).
  values:
    - raise
    - return
  label_key_prefix: stop_behavior
  consumers:
    - surface: sdk
      path: ubb-sdk/ubb/metering.py

task_type_key:
  kind: tenant_defined
  summary: >-
    The key a tenant gives one of its own declared Task kinds. UBB owns the
    entity and its declaration rules and never enumerates the keys — map #137
    constraint 5, which is why the registry cannot become a catalogue of what
    the tenant sells.
  consumers:
    - surface: backend
      path: ubb-platform/apps/platform/work/models.py
    - surface: openapi
      path: openapi/v1.json

external_task_id:
  kind: free_text
  summary: >-
    The caller's own identifier for a Task, carried so an engineer can find
    their side of the record from UBB's. Opaque to UBB, which neither parses it
    nor groups on it.
  consumers:
    - surface: backend
      path: ubb-platform/apps/platform/work/models.py
    - surface: sdk
      path: ubb-sdk/ubb/metering.py
    - surface: openapi
      path: openapi/v1.json

# THE ONE COINAGE THIS SLICE MAKES (#406, slice 5 spec §6).
#
# #140 §3.3 required a reason code on close and called it `reason_code`. The
# registry's `reason_code` (concepts/spend-controls.yaml) is a DIFFERENT
# CONCEPT WEARING THE SAME WORD, and ADR-0006 R2 — one canonical public term
# per concept — forbids two public concepts both being it. Three dispositions
# were available and §6 rules the first: coin a distinct concept; extend the
# slice-6-owned `reason_code`, which would mean editing four entries this slice
# does not own and merging a caller-supplied closed set into a UBB-produced
# open one; or rule the close reason free text, which contradicts #140 §3.3's
# own cardinality argument for having a code beside `reason_detail` at all.
#
# The name follows the house pattern rather than inventing one: the registry
# already carries three siblings in exactly this shape — `unresolved_reason`
# explains an unresolved costing status, `not_applicable_reason` explains a
# not-applicable pricing status, `affordability_reason` explains an
# affordability answer. This one explains the declared `outcome`.
#
# TWO OF THE THREE SURFACES HAVE ARRIVED (#409), AND THE THIRD IS STILL OWED.
# #406 coined this concept with NO consumers at all, which was the honest
# declaration at the time: naming a surface before it holds the values produces
# an unexcused gate finding, and a slice may not add a ledger entry to excuse a
# debt it created. It waited exactly as `unresolved_reason` waited between #316
# and #317.
#
# WHICH TICKET BRINGS EACH SURFACE, so that "waiting" can be told apart from
# "quietly forgotten":
#
#   backend   ARRIVED in #409. `work/models.py` builds `OUTCOME_REASON_CHOICES`
#             from the nine generated constants, and `Task.outcome_reason` is
#             the column a close writes them into.
#   openapi   ARRIVED in #409 too, and it could not have arrived separately: G4
#             lets the contract advertise a value set only once the backend
#             serves it, and the same ticket kills `g4-openapi-task_outcome`
#             beside its backend twin. The marked fields are the close
#             request's `outcome_reason` and `TaskOut.outcome_reason` — the
#             declaration going in, and the same declaration read back.
#   console   STILL OWED, by #424, the runs surface — where a unit of work's
#             terminal state is rendered and therefore where a reader asks why
#             it did not deliver. §25 does not pin the reason's home more
#             precisely than that, so a ticket that moves it should correct
#             this line rather than assume it was ruled.
outcome_reason:
  kind: closed
  summary: >-
    Why a Task or Subtask did not deliver, declared by the caller at the moment
    it closes one. It explains the declared `outcome` and pairs with the
    free-text `reason_detail` beside it, which is the cardinality guard that
    lets this stay a small closed set. `unspecified` is what makes the field
    cheap to REQUIRE: the caller always has a valid answer and a dashboard
    always has a bucket. It is NOT the `reason_code` in spend-controls.yaml —
    that is a different concept wearing the same word, answering why work was
    STOPPED rather than why it did not deliver, open rather than closed, and
    consumed by the stop-reason module #140 §3.3 required this to be kept
    strictly separate from. `parent_closed` here and `parent_killed` there are
    TWO CONCEPTS, not a near-miss to tidy together: `parent_closed` is what the
    tenant declares for a Subtask it withdrew because it closed the parent
    Task, `parent_killed` is what UBB records when it cascaded a spend stop —
    different actor, different set, different kind. And the producer/consumer
    reconciliation that lets a closed stop-reason module sit under an open
    concept DOES NOT TRANSFER: that holds because a stop reason is UBB-produced,
    whereas this value is caller-supplied, so an unrecognised one is refused at
    the boundary rather than carried through it.
  values:
    # A provider the tenant called failed.
    - upstream_provider_error
    # The work ran for longer than the tenant itself allows.
    - timeout
    # The request could not be worked on.
    - invalid_input
    # The tenant's own system failed.
    - internal_error
    # The generated wrapper's work block raised (#179 §2). The ONE value the
    # wrapper may declare on its own, because an exception escaping the block
    # is evidence for it — #157's rule that generated code may infer the
    # outcome that costs nothing and never the one that charges. Settles #179
    # §10 residue 2, which left its membership here open.
    - execution_failed
    # The tenant's end customer withdrew the work.
    - customer_cancelled
    # Replaced by another unit of work.
    - superseded
    # The containing Task was closed by the tenant. See the summary: this is
    # not `reason_code`'s `parent_killed`.
    - parent_closed
    # Declared with no stated cause.
    - unspecified
  label_key_prefix: outcome_reason
  consumers:
    - surface: backend
      path: ubb-platform/apps/platform/work/models.py
    - surface: openapi
      path: openapi/v1.json

reason_detail:
  kind: free_text
  summary: >-
    The sentence a caller may attach beside a reason code when a Task did not
    deliver. Display only, and never grouped on — it is the cardinality guard
    that lets the code beside it stay a small closed vocabulary (#140 §3.3).
  consumers:
    - surface: backend
      path: ubb-platform/apps/platform/work/models.py
    - surface: openapi
      path: openapi/v1.json
