# The vocabulary registry's own schema (ADR-0008 §2, issue #198).
#
# This file is DATA, not documentation: `tools/vocabulary` reads it and enforces
# it. The four kinds and the fields each one requires or forbids are declared
# here exactly once, so "what may a `closed` concept carry?" is answered by a
# file rather than by reading the compiler.
#
# A schema change is therefore a reviewable diff in its own right, and cannot
# drift away from the checker the way a prose description would.

version: 1

# The canonical form of a concept name and of every value it declares:
# lower snake_case, starting with a letter. Concepts whose values legitimately
# carry more structure override this per concept with `token_pattern` — the
# webhook catalogue's `<owner>.<past-tense state entered>` names (ADR-0006 §5)
# are the case this exists for, and they arrive with #202.
token_pattern: '^[a-z][a-z0-9_]*$'

# Fields every concept carries, whatever its kind.
#
# `consumers` is REQUIRED and may be empty. That is the point: a concept nobody
# consumes yet is legal, but it is legal *visibly* — the author had to write
# `consumers: []` and the compiler reports it by name. A concept that simply
# omitted the key would be silently unchecked, which is the failure mode the
# declared-consumer list exists to prevent.
concept_fields:
  required:
    - kind
    - summary
    - consumers
  optional:
    # Values retired in favour of this concept's canonical ones. Registry data,
    # not a list somebody maintains by memory — the forbidden-term sweep (#206)
    # consumes it directly.
    #
    # Every term here is retired WHEREVER IT APPEARS, as a whole token. That is
    # what makes the list directly sweepable, and it is why a word that is
    # retired in one sense while staying live in another belongs in
    # `retired_senses` below instead.
    - retired_aliases
    # Words retired in ONE SENSE while remaining live in another.
    #
    # #154 §8 retires `limit` "as a field word" — and #154 §3.4 keeps `limit`
    # and `remaining` in the admission-control rejection. It retires "operation"
    # "as a count noun" — and ADR-0007 §4 uses the word for every OpenAPI
    # operation. Putting those into `retired_aliases` would state something
    # false and force the sweep into exclusions broad enough to disarm it, which
    # #154 §14 warns about by name.
    #
    # So they are carried here instead: visible, owned, and NOT sweep input.
    # ADR-0008 §1 is the authority — a question that needs judgement about
    # meaning rather than comparison against an oracle stays human-judged, and
    # an obligation that is not a gate is recorded rather than dropped.
    - retired_senses
    # A decision rule over the concept's own values, as data rather than prose.
    #
    # The case that forced it is `ceiling_status`: #158 §12.3 calls its
    # lower-bound rule "a spend-control safety invariant, not a naming detail",
    # and says it belongs in the registry BESIDE the values. A sentence in a
    # summary is not beside the values, it is above them.
    #
    # The compiler proves the table is total and unambiguous over its declared
    # boolean inputs, so a rule that answers only three of four cases fails here
    # rather than in whatever consumer meets the fourth first.
    - value_semantics
    # Per-concept override of the registry-wide `token_pattern` above.
    - token_pattern
    # Values a `closed` concept still DECLARES but which can never occur: no
    # producer may write one and the published contract does not advertise it.
    #
    # The case that forced it was `audit_action`'s cutover entry (R10-W4, #190
    # ruling 6354381879): the ruling kept the registration until the cutover
    # retired it, and a closed public concept advertises only values that can
    # occur. The cutover deleted that registration and its exclusion together
    # (#190, ADR-0026); the mechanism is general (ADR-0024 §2) and stays for the
    # values still withheld. The exclusion has to live HERE rather than in the backend, because
    # the Django-free contracts suite and the spec export must learn it from the
    # same place the backend does. Every value listed must be one of `values`,
    # and at least one value must remain.
    #
    # WHAT WITHHOLDING MEANS, AND WHAT IT IS NOT (the owner's review of #620),
    # each held by `tests/contracts/test_end_state_vocabulary.py`:
    #   * a withheld value is excluded from every enum the contract advertises;
    #   * no ordinary writer can emit it — production code names its generated
    #     constant only where a consumer filters it OUT;
    #   * a value with a current legal production writer must not be withheld
    #     — the first writer un-withholds it, in the same commit;
    #   * it is never a compatibility alias — a retired spelling is a
    #     `retired_aliases` entry, refused rather than kept answering;
    #   * it is never a parking place for a planned value: each one is a
    #     legitimate state with a recorded reachability proof beside it, and
    #     the exact set is pinned with its reasons. The cutover audit action was
    #     the temporary case; the cutover removed it with its registration.
    - withheld_values

# One entry per kind in ADR-0008 §2's table. `requires` and `forbids` are the
# whole of the per-kind shape rule; anything not listed in `concept_fields` or
# in some kind's `requires`/`forbids` is an unknown field and fails.
kinds:
  closed:
    summary: UBB owns the whole value set — exactly these values, no more.
    requires:
      - values
      - label_key_prefix
    forbids:
      - known_values
      - allow_unknown

  open:
    summary: >-
      UBB records the values it knows; consumers accept future and external ones.
      Checking is asymmetric — a registry-known value missing from a UBB-owned
      consumer is a defect, a runtime value the registry has never seen is legal.
    requires:
      - known_values
      - allow_unknown
      - label_key_prefix
    forbids:
      - values
      # Nothing is published as an enum for an open concept, so there is no
      # advertised set for a withheld value to leave.
      - withheld_values

  tenant_defined:
    summary: >-
      The tenant owns the values. UBB defines the field and its validation
      contract and never enumerates the set — map #137 constraint 5 as a schema
      rule, so the registry cannot become the vendor catalogue that constraint
      forbids UBB to ship.
    forbids:
      - values
      - known_values
      - allow_unknown
      # No label key: the tenant authored the value, so UBB has no wording to
      # supply for it.
      - label_key_prefix
      # A decision rule resolves to one of the concept's own values. A kind that
      # declares none has nothing for a rule to answer with, and a rule here
      # would be enumerating the tenant's set by the back door.
      - value_semantics
      - withheld_values

  free_text:
    summary: >-
      Not vocabulary. Recorded here so that "is this a value set?" is answered
      once, in data, rather than re-litigated by whoever next wants to add an
      enum to it.
    forbids:
      - values
      - known_values
      - allow_unknown
      - label_key_prefix
      - value_semantics
      - withheld_values
