[pytest]
# The Code Builder's execution suite (#582; ADR-0008 §5, Seam C of #184's
# spec): a complete Blueprint, resolved through the API, rendered by
# `ubb-codegen`, written to disk unpatched and run as a customer runs it
# against the real application, its records asserted.
#
# Its own configuration and its own CI job (`code-builder-execution`), and
# deliberately NOT under ubb-platform/: the suite runs Node to render, and
# Docker for the shells and the minimal-image fixtures, and none of that
# belongs in the platform suite's default run. It still loads Django, because
# the application it runs against is the platform itself, served by
# pytest-django's `live_server`.
#
# Run it from the git root:
#
#     python -m pytest tests/code_builder_execution
#
# ADR-0008 §7 — test location predicts enforcement: everything under this
# directory gates. Nothing here is skipped, `continue-on-error`, excluded
# from this default run or conditional on a path filter, and
# `tests/contracts/test_the_execution_suite_is_enforced.py` proves it against
# the workflow file.
DJANGO_SETTINGS_MODULE = config.settings
django_find_project = false
pythonpath = ../../ubb-platform
testpaths = .
