[pytest]
# The repository-wide contract suite (#198, ADR-0008 §7).
#
# Its own configuration, deliberately NOT ubb-platform/pytest.ini: nothing here
# loads Django, touches Postgres or reads application settings, so this suite
# runs against a bare checkout. That is what lets it verify the registry, the
# spec, the SDK and the console as ONE set of artifacts rather than from inside
# whichever of them happens to host the test.
#
# Run it from the git root:
#
#     python -m pytest tests/contracts
#
# ADR-0008 §7 — test location predicts enforcement: everything under this
# directory gates. Nothing here is `continue-on-error`, excluded from the
# default run, or conditional on a path filter, and
# `test_contract_suite_is_enforced.py` proves it against the workflow file.
testpaths = .
