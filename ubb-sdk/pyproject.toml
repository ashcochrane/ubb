[build-system]
# PINNED EXACTLY, beside the release recipe's whole build environment
# (release/build-requirements.txt, hashed; #190): a wheel built from the same
# tag by the same backend version is the same bytes.
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ubb-sdk"
# v4.0.0 — the release cut at the cutover (#190, ADR-0026): the first SDK
# release ever tagged (`sdk-v4.0.0`). 3.0.0 was this tree's pre-release number
# and was never released or tagged. Kept in lockstep with ubb.__version__
# (pinned by tests/test_release.py).
version = "4.0.0"
description = "Python SDK for the Usage-Based Billing platform"
requires-python = ">=3.10"
# attrs backs the generated transport+DTO core (ubb/_core); the pinned generator
# emits attrs models. httpx is the transport for both the core and the shell.
dependencies = ["httpx>=0.28", "PyJWT>=2.8", "attrs>=23.2.0"]

[project.optional-dependencies]
# The pinned code generator for the committed core. Not a runtime dependency —
# needed only to run ubb-sdk/codegen/generate_core.py (and CI's ratchet gate).
# Exact pin: it is 0.x with breaking minors, so a bump is a deliberate PR.
codegen = ["openapi-python-client==0.29.0"]

[tool.setuptools.packages.find]
include = ["ubb*"]

[tool.setuptools.package-data]
ubb = ["py.typed"]
