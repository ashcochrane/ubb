# Every reviewed rise in the SDK's unwrapped-operation count, kept as history
# (#204, ADR-0007 §4).
#
# ADR-0007 §4 is deliberate about what it does and does not demand of
# `ubb-sdk/operation-coverage.yaml`: the number of published operations with no
# ergonomic wrapper **need not reach zero** — the SDK is allowed deliberate gaps
# — but it "must stay visible and mechanically accurate, and any increase must
# be an explicit reviewed change rather than an accidental omission".
#
# This file is that explicitness. It is NOT the migration ledger and nothing
# here is a debt: no slice owns an entry, nothing has to reach zero, and an
# unwrapped operation is a legitimate end state. Recording them as debts would
# make `gates/migration-ledger.yaml` unreachable at zero by construction, which
# is the same reason `gates/permanent-exceptions.yaml` is a separate list.
#
# `python -m tools.sdk_operations ratchet` compares the SET of unwrapped
# operations in the committed manifest against the base branch's, and:
#
#   1. an operation that newly became unwrapped, with no authorisation NEW in
#      this change, fails — so an old entry cannot license a later gap, and this
#      list is an audit trail rather than standing permission;
#   2. an authorisation whose `operations_added` is not exactly the number of
#      new gaps fails — a reviewer approves a quantity, not an intention;
#   3. an authorisation that licenses nothing fails — an override that overrides
#      nothing is the shape of a check that cannot fail.
#
# The comparison is over the set and not over `summary.unwrapped`, because the
# total has a hole the identities do not: **wrap three operations and publish
# two unwrapped ones, and the net is minus one.** No rise, no signature, two new
# gaps merged unreviewed — and an author who wrote an authorisation anyway would
# have had it refused as inert. This is also the shape the migration ledger's
# ratchet already uses, which compares entry identities and never a total.
#
# `id` is what makes an entry new, not `issue`: one issue landing across two
# pull requests would otherwise find its second gap licensed by the first's
# entry.

version: 1

authorisations:
  - id: slice-0-204-seeds-the-coverage-manifest
    issue: 204
    operations_added: 56
    reason: >-
      This pull request generates the coverage manifest for the first time, so
      every one of the 56 published operations with no ergonomic wrapper arrives
      at once and the count rises from nothing. They are not new gaps and none
      is a regression — the SDK has never wrapped them — but the ratchet cannot
      tell a first seeding from an accidental omission, and being asked to sign
      for the starting position is the point rather than a formality: 56 is now
      the number a later change has to justify moving.

      Two of them are worth a reader's attention because they are the shape a
      wrapper would most plausibly be expected for, and both are deliberate.
      The eight `/api/v1/me/*` operations are the end-customer widget surface,
      authenticated by a widget token rather than by a tenant API key, so an
      ergonomic method on a tenant-keyed client would be reachable only with
      credentials that client does not hold. And `GET /api/v1/health` and
      `GET /api/v1/ready` are probes for an orchestrator, not for a caller
      metering usage.

  - id: slice-2-267-the-catalogue-reaches-the-contract
    issue: 267
    operations_added: 17
    reason: >-
      The Event Type catalogue arrives on the published contract as seventeen
      operations — the Event Type and its declaration lifecycle, the declared
      quantities, the reported-cost mapping, and the two satellites — and every
      one of them is reachable through the generated core and through none of
      the hand-written clients. They are gaps by the manifest's own definition,
      not by intent: the SDK's hand-written surface for this slice is #282's,
      deliberately a ticket of its own so that what a human types is designed
      against the whole published catalogue rather than accreted one route at a
      time.

      Signing for seventeen now is what makes that sequencing visible rather
      than merely intended. The alternative — wrapping them here — would put
      the contract's first three concept-marked enumerations and a new
      hand-written client surface into one change, and a red run would not say
      which of the two produced it.

  - id: slice-2-278-the-grouping-field-routes-are-renamed
    issue: 278
    operations_added: 3
    reason: >-
      No gap opens here and the SDK reaches exactly what it reached before. The
      three are the same three registry operations, renamed: the collection
      route in both directions and its value-listing route now spell the
      canonical noun in their paths and identifiers, and the ratchet compares
      operation IDENTITIES, so a renamed operation reads to it as one leaving
      the unwrapped set and a different one joining. Three left and three
      joined; the total is unmoved at 72.

      That the ratchet cannot tell a rename from a new gap is not a flaw worth
      routing around. Its whole argument is that the total has a hole the
      identities do not, and the same property that catches wrap-three-publish-
      two is what makes a rename visible here. Signing for three is the cheap
      half of that trade, and this entry is the record that the three were
      inspected and found to be the same operations under new names.

      The fourth route this change renames — the margin breakdown — is
      `wrapped`, was never in the unwrapped set, and so does not appear in this
      count. Its hand-written method follows the renamed constant in the same
      commit, because the operation registry is the only place in `ubb-sdk/ubb/`
      a versioned path is spelled and a stale reference stops resolving.

  - id: slice-4-357-the-tenant-default-markup-rung-is-declarable
    issue: 357
    operations_added: 3
    reason: >-
      Three new operations on the tenant's default markup rung — read it,
      declare it, withdraw it — reachable through the generated core and
      through none of the hand-written clients. Gaps by the manifest's
      definition, and deliberate ones.

      The rung is the last step of the price ladder and its whole subject in
      this change is the RECORD: a percentage a tenant declares, which the
      resolver reads and the Pricing Receipt then names by value. Nothing an
      integrator writes against the SDK depends on it — a caller records usage
      and reads a price back, and the rung is configuration they set once, from
      the console or by hand, not on the metering hot path.

      Deferring the ergonomic methods also keeps this change from wrapping a
      surface that is still moving. The record these three replace is deleted
      later in the same slice, along with its own routes and two component
      schemas, and the hand-written client's markup surface goes with it. A
      wrapper written here would be written twice: once against this rung and
      again when its neighbour's methods are removed. Signing for three now is
      what makes that sequencing visible rather than merely intended.

  - id: slice-4-358-a-books-changes-are-declared-and-published
    issue: 358
    operations_added: 5
    reason: >-
      Five new operations on a Pricing Book's publish record — declare a change,
      read one back, list a book's pending changes, publish one, discard one.
      Reachable through the generated core and through none of the hand-written
      clients. Gaps by the manifest's definition, and deliberate ones.

      The reason is the one the whole pricing-configuration surface already
      runs on rather than a new one: every route that CHANGES a book is
      unwrapped today — adding a rule, repricing a set of them, retiring one,
      declaring the markup rung — while the two that READ the catalogue are
      wrapped. That split is the SDK's actual subject. An integrator's code
      records usage and reads a price back; deciding what a customer is charged
      is a governance act performed from the console or by hand, once, by a
      person who is entitled to. These five replace three of those unwrapped
      routes, so wrapping them would put the SDK's ergonomic surface on the
      configuration side of that line for the first time — a decision about what
      this client is for, which is larger than the ticket that happens to add
      the routes and is not one to take by omission.

      There is no sequencing argument here and the difference is worth saying:
      the publish record is an end-state entity, not a placeholder. A wrapper
      written for it would not be written twice. What defers it is the split
      above, and the console feature that reads these routes, which is the
      surface a tenant will actually use and is a later ticket in this slice.

  - id: slice-4-361-a-customer-override-is-declared-and-withdrawn
    issue: 361
    operations_added: 3
    reason: >-
      Three new operations for a customer's own pricing rule — declaring an
      override, withdrawing one, and reading the rule it replaces. Reachable
      through the generated core and through none of the hand-written clients.
      Gaps by the manifest's definition, and deliberate ones.

      The reason is #358's, unchanged, because these are the same surface one
      scope narrower: every route that DECIDES what a customer is charged is
      unwrapped, and the two that read the catalogue are wrapped. An
      integrator's code records usage and reads a price back; agreeing a
      negotiated deal with one named customer is a governance act performed
      from the console or by hand, by a person entitled to. Two of these three
      are that act, and wrapping them would move the SDK's ergonomic surface
      onto the configuration side of that line.

      The third is a READ, which makes it the closer call — and it goes the
      same way for a different reason: it exists to answer what this customer
      would be charged without the deal, a question only the surface that
      writes the deal has any use for. Wrapping the read without the writes
      would hand an integrator half a workflow. It belongs with the console
      feature that uses all three, which is a later ticket in this slice.

  - id: slice-4-363-a-resolution-run-completes-what-was-never-resolved
    issue: 363
    operations_added: 1
    reason: >-
      One new operation: executing a Resolution Run. Reachable through the
      generated core and through none of the hand-written clients. A gap by the
      manifest's definition, and a deliberate one.

      The reason is #358's and #361's, and this route is the clearest case of
      it yet. An integrator's code records usage and reads a price back;
      deciding to complete money-adjacent numbers across a tenant's history is
      a governance act, performed once, by a person entitled to it — this route
      carries the ADMIN floor for exactly that reason, and it cannot be undone.
      An ergonomic wrapper is a statement that a client program should be doing
      something routinely, and that is the opposite of what this route is for.

      There is no sequencing argument and the difference is worth saying: the
      run is an end-state entity and a wrapper written for it would not be
      written twice. What defers it is the split above, and the console surface
      that offers the filter (ruling 12b), which is a later ticket in this
      slice.
